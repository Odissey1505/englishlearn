function StudentsPage({ session, goHome, setRoute }) {
  const [students, setStudents] = useState([]);
  const [rel, setRel] = useState(null); // зведені дані з усіх таблиць
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all');
  const [sort, setSort] = useState('new');
  const [showCreate, setShowCreate] = useState(false);
  const [pendingCount, setPendingCount] = useState(0);
  const [toDelete, setToDelete] = useState(null);
  const [deleting, setDeleting] = useState(false);

  async function loadStudents() {
    setLoading(true);
    const { data, error } = await window.SB
      .from('profiles')
      .select('*')
      .eq('role', 'student')
      .order('created_at', { ascending: false });
    if (error) {
      setError('Не вдалося завантажити учнів: ' + error.message);
    } else {
      setStudents(data || []);
    }
    setLoading(false);
  }

  // Додаткові дані для карток (прогрес, активність). Якщо щось не
  // завантажиться — картки просто покажуть менше інформації.
  async function loadRelations() {
    const safe = (p) => p.then(r => r.data || []).catch(() => []);
    const [ca, la, lc, hw, vp] = await Promise.all([
      safe(window.SB.from('course_access').select('student_id, course_id')),
      safe(window.SB.from('lesson_access').select('student_id, course_id, lesson_id')),
      safe(window.SB.from('lesson_completions').select('student_id, course_id, lesson_id, completed_at')),
      safe(window.SB.from('homework_submissions').select('student_id, status, submitted_at')),
      safe(window.SB.from('vocab_progress').select('student_id, last_reviewed_at')),
    ]);
    const by = () => new Map();
    const r = { courses: by(), access: by(), done: by(), lastAt: by(), pending: by() };
    const push = (map, id, v) => { if (!map.has(id)) map.set(id, new Set()); map.get(id).add(v); };
    const seen = (id, d) => { r.lastAt.set(id, maxDate(r.lastAt.get(id), d)); };
    ca.forEach(x => push(r.courses, x.student_id, x.course_id));
    la.forEach(x => push(r.access, x.student_id, `${x.course_id}:${x.lesson_id}`));
    lc.forEach(x => { push(r.done, x.student_id, `${x.course_id}:${x.lesson_id}`); seen(x.student_id, x.completed_at); });
    hw.forEach(x => { seen(x.student_id, x.submitted_at); if (x.status === 'submitted') r.pending.set(x.student_id, (r.pending.get(x.student_id) || 0) + 1); });
    vp.forEach(x => seen(x.student_id, x.last_reviewed_at));
    setRel(r);
  }

  async function loadPending() {
    const { count } = await window.SB
      .from('homework_submissions')
      .select('*', { count: 'exact', head: true })
      .eq('status', 'submitted');
    setPendingCount(count || 0);
  }

  useEffect(() => { loadStudents(); loadPending(); loadRelations(); }, []);

  const empty = new Set();
  const rows = useMemo(() => students.map(s => {
    const courseIds = rel ? (rel.courses.get(s.id) || empty) : empty;
    const access = rel ? (rel.access.get(s.id) || empty) : empty;
    const done = rel ? (rel.done.get(s.id) || empty) : empty;
    const courses = COURSES.filter(c => courseIds.has(c.id)).map(c => buildCourseProgress(c, access, done));
    const visible = courses.reduce((a, c) => a + c.visible, 0);
    const completed = courses.reduce((a, c) => a + c.completed, 0);
    // Остання активність: вхід на головну (last_visit_date), завершення
    // уроку, здача домашки або повторення слів — що було пізніше.
    const lastAt = maxDate(s.last_visit_date, rel ? rel.lastAt.get(s.id) : null);
    return {
      s, courses, visible, completed,
      percent: visible > 0 ? Math.round((completed / visible) * 100) : 0,
      lastAt, pending: rel ? (rel.pending.get(s.id) || 0) : 0,
      name: s.display_name || s.username,
    };
  }), [students, rel]);

  const counts = useMemo(() => ({
    all: rows.length,
    active: rows.filter(r => daysSince(r.lastAt) <= 7).length,
    review: rows.filter(r => r.pending > 0).length,
    nocourse: rows.filter(r => r.courses.length === 0).length,
    idle: rows.filter(r => daysSince(r.lastAt) > 14).length,
  }), [rows]);

  const visibleRows = useMemo(() => {
    const q = search.trim().toLowerCase();
    let list = rows.filter(r => {
      if (filter === 'active' && !(daysSince(r.lastAt) <= 7)) return false;
      if (filter === 'review' && r.pending === 0) return false;
      if (filter === 'nocourse' && r.courses.length > 0) return false;
      if (filter === 'idle' && !(daysSince(r.lastAt) > 14)) return false;
      if (!q) return true;
      return (r.s.display_name || '').toLowerCase().includes(q)
        || (r.s.username || '').toLowerCase().includes(q)
        || r.courses.some(c => c.course.title.toLowerCase().includes(q));
    });
    const by = {
      new: (a, b) => new Date(b.s.created_at || 0) - new Date(a.s.created_at || 0),
      name: (a, b) => a.name.localeCompare(b.name, 'uk'),
      activity: (a, b) => daysSince(a.lastAt) - daysSince(b.lastAt),
      progress: (a, b) => b.percent - a.percent || b.completed - a.completed,
    }[sort];
    return [...list].sort(by);
  }, [rows, search, filter, sort]);

  async function confirmDelete() {
    if (!toDelete) return;
    setDeleting(true);
    // Та сама дія, що й у профілі: видалення профілю каскадно прибирає доступи
    const { error } = await window.SB.from('profiles').delete().eq('id', toDelete.id);
    setDeleting(false);
    if (error) { toast('Помилка видалення: ' + error.message, 'error'); return; }
    setStudents(prev => prev.filter(x => x.id !== toDelete.id));
    toast(`${toDelete.display_name || toDelete.username} — видалено`, 'success');
    setToDelete(null);
  }

  const openStudent = (id, tab) => setRoute({ page: 'student', studentId: id, tab });

  return (
    <main className="page iw-students">
      <Crumbs items={[{ label: 'Library', onClick: goHome }, { label: 'Учні', current: true }]} />
      <PageHeader
        eyebrow="Teacher dashboard"
        title={<React.Fragment>Мої <em>учні</em></React.Fragment>}
        subtitle="Прогрес, доступ до курсів і домашні роботи кожного учня — в одному місці."
        actions={<IwButton variant="primary" icon={UserPlus} onClick={() => setShowCreate(true)}>Додати учня</IwButton>}
      />

      <div className="iw-stat-grid iw-students-stats">
        <StatCard icon={Users} value={loading ? '–' : counts.all} label="Учнів" tone="terracotta" />
        <StatCard icon={Activity} value={rel ? counts.active : '–'} label="Активні за 7 днів" sub="уроки, домашні, слова або вхід" tone="sage" />
        <StatCard icon={MapIcon} value={rel ? counts.all - counts.nocourse : '–'} label="Мають курс" tone="sky" />
        <StatCard icon={Inbox} value={pendingCount} label="Домашок на перевірці" sub={counts.review ? `від ${counts.review} ${pluralUk(counts.review, 'учня', 'учнів', 'учнів')}` : null} tone="mustard" />
      </div>

      <div className="iw-students-banners">
        <a className="iw-journal" href="https://odissey1505.github.io/Tutor-s-journal/" target="_blank" rel="noopener noreferrer">
          <div className="iw-journal-art"><Illustration name="notebook" /></div>
          <div className="iw-journal-body">
            <div className="iw-journal-eyebrow">Інструмент викладача</div>
            <div className="iw-journal-title">Журнал викладача</div>
            <div className="iw-journal-sub">Розклад занять, облік учнів і відвідуваності, нотатки — усе в одному місці.</div>
          </div>
          <span className="iw-btn iw-btn-primary iw-btn-sm iw-journal-cta">Відкрити <ExternalLink size={14} aria-hidden="true" /><span className="sr-only"> (у новій вкладці)</span></span>
        </a>
        {pendingCount > 0 && (
          <button className="hw-pending-banner" onClick={() => setRoute({ page: 'homework-review' })}>
            <div className="hw-pending-icon">📬</div>
            <div className="hw-pending-body">
              <div className="hw-pending-title">
                {pendingCount === 1 ? 'Одна нова домашка на перевірці' : pendingCount < 5 ? pendingCount + ' нові домашки на перевірці' : pendingCount + ' нових домашок на перевірці'}
              </div>
              <div className="hw-pending-sub">Клікни, щоб переглянути та оцінити</div>
            </div>
            <ChevronRight size={20} />
          </button>
        )}
      </div>

      <div className="iw-students-toolbar">
        <div className="iw-input-wrap iw-students-search">
          <Search size={18} aria-hidden="true" />
          <input type="search" placeholder="Ім'я, username або курс…" value={search} onChange={e => setSearch(e.target.value)} aria-label="Пошук учнів" />
          {search && <button type="button" className="search-clear" onClick={() => setSearch('')} aria-label="Очистити пошук"><X size={14} /></button>}
        </div>
        <label className="iw-select">
          <span className="sr-only">Сортування</span>
          <select value={sort} onChange={e => setSort(e.target.value)}>
            {STUDENT_SORTS.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}
          </select>
          <ChevronDown size={15} aria-hidden="true" />
        </label>
      </div>
      <div className="iw-chips" role="group" aria-label="Фільтр учнів">
        {STUDENT_FILTERS.map(f => (
          <button key={f.id} type="button" className="iw-chip" aria-pressed={filter === f.id} onClick={() => setFilter(f.id)}>
            {f.label}<span className="iw-chip-count">{rel || f.id === 'all' ? counts[f.id] : '…'}</span>
          </button>
        ))}
      </div>

      {error && <div className="modal-error" style={{ marginBottom: 20 }}>{error}</div>}

      {loading && (
        <div className="iw-students-grid" aria-busy="true">
          {[0, 1, 2, 3].map(i => <Skeleton key={i} h={170} r={16} />)}
        </div>
      )}

      {!loading && students.length === 0 && !error && (
        <EmptyState art="books" title="Ще жодного учня" text="Створи перший акаунт — і тут з'явиться картка з прогресом учня."
          action={<IwButton variant="primary" icon={UserPlus} onClick={() => setShowCreate(true)}>Додати учня</IwButton>} />
      )}

      {!loading && students.length > 0 && visibleRows.length === 0 && (
        <EmptyState art="books" title="Нікого не знайдено" text="Спробуй інший запит або зніми фільтр."
          action={<IwButton size="sm" onClick={() => { setSearch(''); setFilter('all'); }}>Скинути пошук і фільтри</IwButton>} />
      )}

      {!loading && visibleRows.length > 0 && (
        <React.Fragment>
          <p className="iw-students-count" aria-live="polite">
            Показано {visibleRows.length} з {rows.length}
          </p>
          <ul className="iw-students-grid">
            {visibleRows.map((r, i) => (
              <StudentCard key={r.s.id} row={r} relReady={!!rel} delay={Math.min(i, 8) * 40}
                onOpen={(tab) => openStudent(r.s.id, tab)} onDelete={() => setToDelete(r.s)} />
            ))}
          </ul>
        </React.Fragment>
      )}

      {showCreate && (
        <CreateStudentModal
          session={session}
          onClose={() => setShowCreate(false)}
          onCreated={(newStudent) => {
            setStudents(prev => [newStudent, ...prev]);
            setShowCreate(false);
            toast('Учня створено', 'success');
          }}
        />
      )}

      <ConfirmDialog open={!!toDelete} danger busy={deleting}
        title="Видалити учня?"
        text={toDelete ? `Акаунт «${toDelete.display_name || toDelete.username}» буде видалено разом із доступами та прогресом. Цю дію не можна скасувати.` : ''}
        confirmLabel="Так, видалити" onCancel={() => setToDelete(null)} onConfirm={confirmDelete} />
    </main>
  );
}

function StudentCard({ row, relReady, delay, onOpen, onDelete }) {
  const { s, courses, visible, completed, percent, lastAt, pending, name } = row;
  const lastLabel = lastAt ? formatRelativeTime(lastAt) : 'ще не було';
  const idle = daysSince(lastAt) > 14;
  return (
    <li className="iw-scard iw-reveal" style={{ animationDelay: `${delay}ms` }}>
      <div className="iw-scard-head">
        <Avatar name={name} seed={s.id} size={46} />
        <div className="iw-scard-id">
          <button type="button" className="iw-scard-name iw-stretch" onClick={() => onOpen()}>{name}</button>
          <div className="iw-scard-user">@{s.username}</div>
        </div>
        <DropdownMenu label={`Дії: ${name}`} trigger={({ ref, toggle, menuProps }) => (
          <button ref={ref} type="button" className="iw-scard-more" onClick={toggle} aria-label={`Дії для ${name}`} {...menuProps}>
            <MoreHorizontal size={18} />
          </button>
        )}>
          {(close) => (
            <React.Fragment>
              <MenuItem icon={Users} onSelect={() => { close(); onOpen('overview'); }}>Відкрити профіль</MenuItem>
              <MenuItem icon={Activity} onSelect={() => { close(); onOpen('progress'); }}>Прогрес по юнітах</MenuItem>
              <MenuItem icon={Unlock} onSelect={() => { close(); onOpen('access'); }}>Доступ до уроків</MenuItem>
              <MenuItem icon={Inbox} onSelect={() => { close(); onOpen('homework'); }}
                meta={pending > 0 ? <span className="iw-menu-badge">{pending}</span> : null}>Домашні роботи</MenuItem>
              <MenuItem icon={StickyNote} onSelect={() => { close(); onOpen('notes'); }}>Нотатки</MenuItem>
              <div className="iw-menu-sep" role="separator" />
              <MenuItem icon={Trash2} danger onSelect={() => { close(); onDelete(); }}>Видалити учня…</MenuItem>
            </React.Fragment>
          )}
        </DropdownMenu>
      </div>

      <div className="iw-scard-courses">
        {!relReady && <Skeleton w="60%" h={22} r={999} />}
        {relReady && courses.length === 0 && <span className="iw-scard-muted">Курс ще не відкрито</span>}
        {relReady && courses.map(c => <Badge key={c.course.id} tone="brand" title={c.course.title}>{c.course.title}</Badge>)}
      </div>

      {relReady && courses.length > 0 && visible === 0 && <span className="iw-scard-muted">Уроки ще не відкрито</span>}
      {relReady && courses.length > 0 && visible > 0 && (
        <ProgressBar value={completed} max={Math.max(visible, 1)} size="sm" tone={percent >= 100 ? 'sage' : 'terracotta'}
          label="Пройдено з відкритих" valueLabel={`${completed} / ${visible}`} />
      )}

      <div className="iw-scard-foot">
        <span className={cx('iw-scard-last', idle && 'idle')}><Clock size={13} aria-hidden="true" /> {lastLabel}</span>
        {pending > 0 && <Badge tone="warning">{pending} на перевірці</Badge>}
      </div>
    </li>
  );
}

// ── Профіль учня ──
const STUDENT_TABS = [
  { id: 'overview', label: 'Огляд', icon: Home },
  { id: 'progress', label: 'Прогрес', icon: Activity },
  { id: 'access', label: 'Доступ до уроків', icon: Unlock },
  { id: 'homework', label: 'Домашні', icon: Inbox },
  { id: 'vocab', label: 'Словник', icon: Library },
  { id: 'notes', label: 'Нотатки', icon: StickyNote },
];

function StudentPage({ studentId, initialTab, session, goHome, setRoute }) {
  const [student, setStudent] = useState(null);
  const [courseAccess, setCourseAccess] = useState(new Set()); // set of course_id
  const [lessonAccess, setLessonAccess] = useState(new Set()); // set of `${course_id}:${lesson_id}`
  const [completions, setCompletions] = useState(new Set()); // set of `${course_id}:${lesson_id}`
  const [vocabAccess, setVocabAccess] = useState(new Set()); // set of word_id
  const allVocabItems = useMemo(() => getAllVocabItems(), []);
  const [stats, setStats] = useState({
    completedLessons: [],   // масив {course_id, lesson_id, completed_at}
    hwSubmissions: [],      // масив submissions
    vocabProgress: [],      // масив {word_id, ...}
  });
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [showDelete, setShowDelete] = useState(false);
  const [deleting, setDeleting] = useState(false);
  const [tab, setTab] = useState(STUDENT_TABS.some(t => t.id === initialTab) ? initialTab : 'overview');
  const [busyKey, setBusyKey] = useState(null);

  async function loadAll() {
    setLoading(true);
    // Профіль
    const { data: profile, error: profileError } = await window.SB
      .from('profiles')
      .select('*')
      .eq('id', studentId)
      .single();
    if (profileError || !profile) {
      setError('Не вдалося завантажити учня');
      setLoading(false);
      return;
    }
    setStudent(profile);

    const [{ data: ca }, { data: la }, { data: lc }, { data: va }, { data: hw }, { data: vp }] = await Promise.all([
      window.SB.from('course_access').select('course_id').eq('student_id', studentId),
      window.SB.from('lesson_access').select('course_id, lesson_id').eq('student_id', studentId),
      window.SB.from('lesson_completions').select('course_id, lesson_id, completed_at').eq('student_id', studentId).order('completed_at', { ascending: false }),
      window.SB.from('vocab_access').select('word_id').eq('student_id', studentId),
      window.SB.from('homework_submissions').select('*').eq('student_id', studentId).order('submitted_at', { ascending: false }),
      window.SB.from('vocab_progress').select('word_id, last_reviewed_at, repetitions, last_grade').eq('student_id', studentId).order('last_reviewed_at', { ascending: false }),
    ]);
    setCourseAccess(new Set((ca || []).map(r => r.course_id)));
    setLessonAccess(new Set((la || []).map(r => `${r.course_id}:${r.lesson_id}`)));
    setCompletions(new Set((lc || []).map(r => `${r.course_id}:${r.lesson_id}`)));
    setVocabAccess(new Set((va || []).map(r => r.word_id)));
    setStats({
      completedLessons: lc || [],
      hwSubmissions: hw || [],
      vocabProgress: vp || [],
    });
    setLoading(false);
  }

  useEffect(() => { loadAll(); }, [studentId]);

  const fail = (error) => toast('Помилка: ' + error.message, 'error');

  async function toggleCourse(courseId) {
    const has = courseAccess.has(courseId);
    setBusyKey(courseId);
    if (has) {
      // Знімаємо доступ
      const { error } = await window.SB.from('course_access')
        .delete()
        .eq('student_id', studentId)
        .eq('course_id', courseId);
      setBusyKey(null);
      if (error) { fail(error); return; }
      const next = new Set(courseAccess); next.delete(courseId); setCourseAccess(next);
      toast('Доступ до курсу закрито');
    } else {
      // Даємо доступ
      const { error } = await window.SB.from('course_access').insert({
        student_id: studentId,
        course_id: courseId,
        granted_by: session.user.id
      });
      setBusyKey(null);
      if (error) { fail(error); return; }
      const next = new Set(courseAccess); next.add(courseId); setCourseAccess(next);
      toast('Курс відкрито', 'success');
    }
  }

  // Та сама послідовність, що й раніше: закрито → відкрито → завершено → (зняти «завершено»)
  async function toggleLesson(courseId, lessonId, currentState) {
    const key = `${courseId}:${lessonId}`;
    setBusyKey(key);
    if (currentState === 'completed') {
      // Знімаємо позначку "завершено"
      const { error } = await window.SB.from('lesson_completions')
        .delete()
        .eq('student_id', studentId)
        .eq('course_id', courseId)
        .eq('lesson_id', lessonId);
      setBusyKey(null);
      if (error) { fail(error); return; }
      const next = new Set(completions); next.delete(key); setCompletions(next);
      setStats(st => ({ ...st, completedLessons: st.completedLessons.filter(c => `${c.course_id}:${c.lesson_id}` !== key) }));
    } else if (currentState === 'granted') {
      // Позначаємо як завершено
      const { error } = await window.SB.from('lesson_completions').insert({
        student_id: studentId,
        course_id: courseId,
        lesson_id: lessonId,
        completed_by: session.user.id
      });
      setBusyKey(null);
      if (error) { fail(error); return; }
      const next = new Set(completions); next.add(key); setCompletions(next);
      setStats(st => ({ ...st, completedLessons: [{ course_id: courseId, lesson_id: lessonId, completed_at: new Date().toISOString() }, ...st.completedLessons] }));
    } else {
      // locked → надаємо доступ
      const { error } = await window.SB.from('lesson_access').insert({
        student_id: studentId,
        course_id: courseId,
        lesson_id: lessonId,
        granted_by: session.user.id
      });
      setBusyKey(null);
      if (error) { fail(error); return; }
      const next = new Set(lessonAccess); next.add(key); setLessonAccess(next);
    }
  }

  // Відкрити одразу всі закриті уроки юніту (та сама вставка в lesson_access)
  async function grantLessons(courseId, lessonIds) {
    const todo = lessonIds.filter(id => !lessonAccess.has(`${courseId}:${id}`) && !completions.has(`${courseId}:${id}`));
    if (!todo.length) return;
    setBusyKey(`unit:${courseId}:${todo[0]}`);
    const { error } = await window.SB.from('lesson_access').insert(todo.map(id => ({
      student_id: studentId, course_id: courseId, lesson_id: id, granted_by: session.user.id,
    })));
    setBusyKey(null);
    if (error) { fail(error); return; }
    const next = new Set(lessonAccess); todo.forEach(id => next.add(`${courseId}:${id}`)); setLessonAccess(next);
    toast(`Відкрито ${todo.length} ${pluralUk(todo.length, 'урок', 'уроки', 'уроків')}`, 'success');
  }

  async function toggleVocabWord(word) {
    const has = vocabAccess.has(word.wordId);
    if (has) {
      const { error } = await window.SB.from('vocab_access')
        .delete()
        .eq('student_id', studentId)
        .eq('word_id', word.wordId);
      if (error) { fail(error); return; }
      const next = new Set(vocabAccess); next.delete(word.wordId); setVocabAccess(next);
    } else {
      const { error } = await window.SB.from('vocab_access').insert({
        student_id: studentId,
        word_id: word.wordId,
        granted_by: session.user.id
      });
      if (error) { fail(error); return; }
      const next = new Set(vocabAccess); next.add(word.wordId); setVocabAccess(next);
    }
  }

  // Bulk: відкрити всі слова уроку одним кліком
  async function grantAllVocabInLesson(words) {
    const toGrant = words.filter(w => !vocabAccess.has(w.wordId));
    if (toGrant.length === 0) return;
    const payload = toGrant.map(w => ({
      student_id: studentId,
      word_id: w.wordId,
      granted_by: session.user.id
    }));
    const { error } = await window.SB.from('vocab_access').insert(payload);
    if (error) { fail(error); return; }
    const next = new Set(vocabAccess);
    toGrant.forEach(w => next.add(w.wordId));
    setVocabAccess(next);
  }

  // Bulk: закрити всі відкриті вручну слова уроку
  async function revokeAllVocabInLesson(words) {
    const toRevoke = words.filter(w => vocabAccess.has(w.wordId));
    if (toRevoke.length === 0) return;
    const wordIds = toRevoke.map(w => w.wordId);
    const { error } = await window.SB.from('vocab_access')
      .delete()
      .eq('student_id', studentId)
      .in('word_id', wordIds);
    if (error) { fail(error); return; }
    const next = new Set(vocabAccess);
    wordIds.forEach(id => next.delete(id));
    setVocabAccess(next);
  }

  async function grantAllVocabInCourse(courseStructure) {
    const allWords = courseStructure.lessons.flatMap(l => l.words);
    await grantAllVocabInLesson(allWords);
  }

  async function revokeAllVocabInCourse(courseStructure) {
    const allWords = courseStructure.lessons.flatMap(l => l.words);
    await revokeAllVocabInLesson(allWords);
  }

  async function handleDelete() {
    setDeleting(true);
    // Видаляємо профіль (це каскадно видалить course_access, lesson_access тощо)
    // Auth user залишається в auth.users — але без профілю не зможе увійти
    const { error } = await window.SB.from('profiles').delete().eq('id', studentId);
    if (error) {
      toast('Помилка видалення: ' + error.message, 'error');
      setDeleting(false);
      return;
    }
    setDeleting(false);
    toast('Учня видалено', 'success');
    setRoute({ page: 'students' });
  }

  const completionDates = useMemo(() => {
    const m = new Map();
    stats.completedLessons.forEach(c => m.set(`${c.course_id}:${c.lesson_id}`, c.completed_at));
    return m;
  }, [stats]);

  const progress = useMemo(() =>
    COURSES.filter(c => courseAccess.has(c.id)).map(c => buildCourseProgress(c, lessonAccess, completions, completionDates)),
  [courseAccess, lessonAccess, completions, completionDates]);

  const summary = useMemo(() => {
    const hw = stats.hwSubmissions;
    const lastAt = maxDate(
      student && student.last_visit_date,
      stats.completedLessons[0] && stats.completedLessons[0].completed_at,
      hw[0] && hw[0].submitted_at,
      stats.vocabProgress[0] && stats.vocabProgress[0].last_reviewed_at,
    );
    return {
      visible: progress.reduce((a, c) => a + c.visible, 0),
      completed: progress.reduce((a, c) => a + c.completed, 0),
      hwTotal: hw.length,
      hwPending: hw.filter(h => h.status === 'submitted').length,
      hwAccepted: hw.filter(h => h.status === 'accepted').length,
      hwReturned: hw.filter(h => h.status === 'returned').length,
      words: stats.vocabProgress.length,
      lastAt,
    };
  }, [progress, stats, student]);

  if (loading) return <PageLoader label="Відкриваю профіль учня…" />;
  if (error) return <main className="page"><div className="modal-error">{error}</div></main>;
  if (!student) return null;

  const name = student.display_name || student.username;
  const tabs = STUDENT_TABS.map(t => t.id === 'homework' && summary.hwPending > 0 ? { ...t, count: summary.hwPending } : t);

  return (
    <main className="page iw-profile">
      <Crumbs items={[
        { label: 'Library', onClick: goHome },
        { label: 'Учні', onClick: () => setRoute({ page: 'students' }) },
        { label: name, current: true }
      ]} />

      <header className="iw-profile-head">
        <Avatar name={name} seed={student.id} size={76} className="iw-profile-avatar" />
        <div className="iw-profile-id">
          <h1 className="iw-profile-name">{name}</h1>
          <div className="iw-profile-meta">
            <span>@{student.username}</span>
            {student.created_at && <span>з нами з {new Date(student.created_at).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long', year: 'numeric' })}</span>}
            <span><Clock size={13} aria-hidden="true" /> {summary.lastAt ? `активність ${formatRelativeTime(summary.lastAt)}` : 'ще не був(-ла) активним'}</span>
          </div>
          <div className="iw-profile-courses">
            {progress.length === 0 && <Badge>Курс не відкрито</Badge>}
            {progress.map(p => <Badge key={p.course.id} tone="brand">{p.course.title}</Badge>)}
          </div>
        </div>
        <div className="iw-profile-actions">
          {summary.hwPending > 0 && (
            <IwButton variant="accent" size="sm" icon={Inbox} onClick={() => setRoute({ page: 'homework-review' })}>Перевірити ({summary.hwPending})</IwButton>
          )}
          <DropdownMenu label="Дії з учнем" trigger={({ ref, toggle, menuProps }) => (
            <button ref={ref} type="button" className="iw-btn iw-btn-secondary iw-btn-sm iw-btn-icon" onClick={toggle} aria-label="Інші дії" {...menuProps}>
              <MoreHorizontal size={18} />
            </button>
          )}>
            {(close) => (
              <React.Fragment>
                <MenuItem icon={RefreshCw} onSelect={() => { close(); loadAll(); }}>Оновити дані</MenuItem>
                <MenuItem icon={StickyNote} onSelect={() => { close(); setTab('notes'); }}>Нотатки вчителя</MenuItem>
                <div className="iw-menu-sep" role="separator" />
                <MenuItem icon={Trash2} danger onSelect={() => { close(); setShowDelete(true); }}>Видалити учня…</MenuItem>
              </React.Fragment>
            )}
          </DropdownMenu>
        </div>
      </header>

      <div className="iw-stat-grid iw-profile-stats">
        <StatCard icon={CheckCircle} tone="sage" value={summary.completed} label="Уроків завершено" sub={`з ${summary.visible} відкритих`} />
        <StatCard icon={Flame} tone="terracotta" value={student.current_streak || 0}
          label={`${pluralUk(student.current_streak || 0, 'день', 'дні', 'днів')} поспіль`} sub={student.longest_streak ? `рекорд: ${student.longest_streak}` : null} />
        <StatCard icon={Library} tone="plum" value={summary.words} label="Слів у флешкартках" sub={`${vocabAccess.size} відкрито вручну`} />
        <StatCard icon={Inbox} tone="mustard" value={summary.hwTotal} label="Домашок здано"
          sub={summary.hwTotal ? `✓ ${summary.hwAccepted} · ⏳ ${summary.hwPending} · ↻ ${summary.hwReturned}` : 'поки жодної'} />
      </div>

      <Tabs label="Розділи профілю" value={tab} onChange={setTab} tabs={tabs} className="iw-profile-tabs">
        {tab === 'overview' && <StudentOverviewTab progress={progress} stats={stats} setTab={setTab} student={student} />}
        {tab === 'progress' && <StudentProgressTab progress={progress} setTab={setTab} />}
        {tab === 'access' && <StudentAccessTab courseAccess={courseAccess} lessonAccess={lessonAccess} completions={completions}
          toggleCourse={toggleCourse} toggleLesson={toggleLesson} grantLessons={grantLessons} busyKey={busyKey} progress={progress} />}
        {tab === 'homework' && <StudentHomeworkTab stats={stats} lessonAccess={lessonAccess} completions={completions} courseAccess={courseAccess} setRoute={setRoute} />}
        {tab === 'vocab' && (
          <VocabAccessSection
            student={student}
            allVocabItems={allVocabItems}
            completions={completions}
            vocabAccess={vocabAccess}
            toggleVocabWord={toggleVocabWord}
            grantAllVocabInLesson={grantAllVocabInLesson}
            revokeAllVocabInLesson={revokeAllVocabInLesson}
            grantAllVocabInCourse={grantAllVocabInCourse}
            revokeAllVocabInCourse={revokeAllVocabInCourse}
          />
        )}
        {tab === 'notes' && <TeacherNotesTab studentId={studentId} studentName={name} session={session} />}
      </Tabs>

      <ConfirmDialog open={showDelete} danger busy={deleting}
        title="Видалити учня?"
        text={`Акаунт «${name}» буде видалено разом із доступами та прогресом. Цю дію не можна скасувати.`}
        confirmLabel="Так, видалити" onCancel={() => setShowDelete(false)} onConfirm={handleDelete} />
    </main>
  );
}

// ── Вкладка «Огляд» ──
function StudentOverviewTab({ progress, stats, setTab, student }) {
  const feed = useMemo(() => {
    const items = [];
    stats.completedLessons.forEach(c => {
      const f = findLesson(c.course_id, c.lesson_id);
      items.push({ at: c.completed_at, kind: 'lesson', title: f ? `L${f.lesson.number} · ${f.lesson.title}` : c.lesson_id, sub: f ? f.course.title : c.course_id });
    });
    stats.hwSubmissions.forEach(h => {
      const f = findLesson(h.course_id, h.lesson_id);
      items.push({ at: h.submitted_at, kind: 'hw', status: h.status, hwKind: h.kind, title: f ? `L${f.lesson.number} · ${f.lesson.title}` : h.lesson_id, sub: (HW_KIND[h.kind] || {}).label || 'Домашнє' });
    });
    return items.filter(i => i.at).sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 8);
  }, [stats]);

  if (progress.length === 0) {
    return (
      <EmptyState art="books" title="Курс ще не відкрито" text="Відкрий учню курс — тоді тут з'явиться прогрес по юнітах і остання активність."
        action={<IwButton variant="primary" icon={Unlock} onClick={() => setTab('access')}>Відкрити доступ</IwButton>} />
    );
  }
  return (
    <div className="iw-overview">
      <div className="iw-overview-courses">
        {progress.map(p => (
          <section key={p.course.id} className="iw-card iw-course-sum">
            <ProgressRing value={p.completed} max={Math.max(p.total, 1)} size={92} stroke={8} tone={p.completed === p.total ? 'sage' : 'terracotta'} label={`Пройдено курсу: ${p.course.title}`} />
            <div className="iw-course-sum-body">
              <div className="iw-kicker">Курс</div>
              <h3 className="iw-course-sum-title">{p.course.title}</h3>
              <dl className="iw-mini-stats">
                <div><dt>Уроків</dt><dd>{p.completed} / {p.visible}<small> відкр. · {p.total} всього</small></dd></div>
                <div><dt>Юнітів</dt><dd>{p.unitsDone} / {p.unitsTotal}</dd></div>
              </dl>
              {p.currentUnit && (
                <div className="iw-course-sum-current">
                  <span className="iw-dot-live" aria-hidden="true" />
                  Зараз: <strong>Unit {p.currentUnit.number}</strong> · {p.currentUnit.title}
                </div>
              )}
              <IwButton size="sm" variant="ghost" iconRight={ArrowRight} onClick={() => setTab('progress')}>Прогрес по юнітах</IwButton>
            </div>
          </section>
        ))}
      </div>
      <section className="iw-card iw-feed">
        <h3 className="iw-card-title">Остання активність</h3>
        {feed.length === 0 && <p className="iw-scard-muted" style={{ margin: 0 }}>Учень ще не завершив жодного уроку й не здав домашніх.</p>}
        <ol className="iw-feed-list">
          {feed.map((it, i) => (
            <li key={i} className={cx('iw-feed-item', it.kind === 'hw' && `hw-${it.status}`)}>
              <span className="iw-feed-dot" aria-hidden="true">{it.kind === 'lesson' ? <Check size={13} /> : it.hwKind === 'speaking' ? <Mic size={13} /> : <Pencil size={13} />}</span>
              <div className="iw-feed-body">
                <div className="iw-feed-title">{it.kind === 'lesson' ? 'Завершив урок' : 'Здав домашнє'} — {it.title}</div>
                <div className="iw-feed-sub">
                  {formatRelativeTime(it.at)} · {it.sub}
                  {it.kind === 'hw' && HW_STATUS[it.status] && <Badge tone={HW_STATUS[it.status].tone}>{HW_STATUS[it.status].label}</Badge>}
                </div>
              </div>
            </li>
          ))}
        </ol>
      </section>
      {student && <StudentAchievements student={student} />}
    </div>
  );
}

const UNIT_STATE = {
  completed: { label: 'Завершено', status: 'completed' },
  current:   { label: 'Поточний',  status: 'progress' },
  available: { label: 'Відкрито',  status: 'available' },
  locked:    { label: 'Закрито',   status: 'locked' },
};

// ── Вкладка «Прогрес»: курс → юніт → урок ──
function StudentProgressTab({ progress, setTab }) {
  const [open, setOpen] = useState(() => {
    const s = new Set();
    progress.forEach(p => { if (p.currentUnit) s.add(`${p.course.id}:${p.currentUnit.id}`); });
    return s;
  });
  const toggle = (k) => setOpen(prev => { const n = new Set(prev); n.has(k) ? n.delete(k) : n.add(k); return n; });

  if (progress.length === 0) {
    return <EmptyState art="books" title="Курс ще не відкрито" text="Прогрес з'явиться, щойно учень отримає доступ до курсу."
      action={<IwButton variant="primary" icon={Unlock} onClick={() => setTab('access')}>Відкрити доступ</IwButton>} />;
  }
  return (
    <div className="iw-progress-tab">
      {progress.map(p => (
        <section key={p.course.id} className="iw-course-block">
          <div className="iw-course-block-head">
            <div>
              <div className="iw-kicker">Курс</div>
              <h3 className="iw-course-sum-title">{p.course.title}</h3>
            </div>
            <div className="iw-course-block-legend">
              <span><b>{p.completed}</b> завершено</span>
              <span><b>{p.visible - p.completed}</b> відкрито</span>
              <span><b>{p.total - p.visible}</b> закрито</span>
              <span><b>{p.unitsDone}/{p.unitsTotal}</b> юнітів</span>
            </div>
          </div>
          <ul className="iw-units">
            {p.units.map(u => {
              const k = `${p.course.id}:${u.unit.id}`;
              const isOpen = open.has(k);
              const st = UNIT_STATE[u.state];
              return (
                <li key={u.unit.id} className={cx('iw-unit', `is-${u.state}`, isOpen && 'open')}>
                  <button type="button" className="iw-unit-head" aria-expanded={isOpen} onClick={() => toggle(k)}>
                    <span className="iw-unit-num">{u.unit.number}</span>
                    <span className="iw-unit-titles">
                      <span className="iw-unit-title">{u.unit.title}</span>
                      {u.unit.subtitle && <span className="iw-unit-sub">{u.unit.subtitle}</span>}
                    </span>
                    <span className="iw-unit-bar"><ProgressBar value={u.completed} max={u.total} size="sm" tone={u.isComplete ? 'sage' : 'terracotta'} valueLabel={`${u.completed}/${u.total}`} label={`Прогрес юніту ${u.unit.number}`} /></span>
                    <StatusBadge status={st.status} label={st.label} />
                    <ChevronDown size={18} className="iw-unit-chev" aria-hidden="true" />
                  </button>
                  {isOpen && (
                    <ol className="iw-lesson-rows">
                      {u.lessons.map(l => (
                        <li key={l.lesson.id} className={cx('iw-lrow', `is-${l.status}`)}>
                          <span className="iw-lrow-num">L{l.lesson.number}</span>
                          <span className="iw-lrow-titles">
                            <span className="iw-lrow-title">{l.lesson.title}</span>
                            {l.lesson.titleUk && <span className="iw-lrow-sub">{l.lesson.titleUk}</span>}
                          </span>
                          <span className="iw-lrow-type">{l.lesson.type}</span>
                          <span className="iw-lrow-date">{l.completedAt ? new Date(l.completedAt).toLocaleDateString('uk-UA') : ''}</span>
                          <StatusBadge status={l.status} />
                        </li>
                      ))}
                    </ol>
                  )}
                </li>
              );
            })}
          </ul>
        </section>
      ))}
    </div>
  );
}

// ── Вкладка «Доступ до уроків» ──
const ACCESS_FILTERS = [
  { id: 'all', label: 'Усі' },
  { id: 'locked', label: 'Закриті' },
  { id: 'granted', label: 'Відкриті' },
  { id: 'completed', label: 'Завершені' },
];
const ACCESS_CLS = { locked: 'st-locked', granted: 'st-available', completed: 'st-completed' };
const ACCESS_NEXT = {
  locked: 'Натисни, щоб відкрити урок',
  granted: 'Натисни, щоб позначити як завершений',
  completed: 'Натисни, щоб зняти позначку «завершено»',
};

function StudentAccessTab({ courseAccess, lessonAccess, completions, toggleCourse, toggleLesson, grantLessons, busyKey, progress }) {
  const [q, setQ] = useState('');
  const [filter, setFilter] = useState('all');
  const [open, setOpen] = useState(() => new Set(progress.filter(p => p.currentUnit).map(p => `${p.course.id}:${p.currentUnit.id}`)));
  const toggleOpen = (k) => setOpen(prev => { const n = new Set(prev); n.has(k) ? n.delete(k) : n.add(k); return n; });
  const query = q.trim().toLowerCase();
  const forceOpen = Boolean(query) || filter !== 'all';

  return (
    <div className="iw-access-tab">
      <p className="iw-help">
        Перемикач відкриває курс. Усередині курсу кнопка біля уроку змінює його стан:
        <StatusBadge status="locked" /> → <StatusBadge status="available" label="Відкрито" /> → <StatusBadge status="completed" />.
        Завершення уроку не відкриває наступний автоматично.
      </p>
      {COURSES.map(course => {
        const hasCourse = courseAccess.has(course.id);
        const lessonsTotal = course.units.reduce((a, u) => a + u.lessons.length, 0);
        return (
          <section key={course.id} className={cx('iw-course-block', !hasCourse && 'is-off')}>
            <div className="iw-course-block-head">
              <div>
                <div className="iw-kicker">Курс · {course.units.length} юнітів · {lessonsTotal} уроків</div>
                <h3 className="iw-course-sum-title">{course.title}</h3>
              </div>
              <label className="iw-switch">
                <span>{hasCourse ? 'Курс відкрито' : 'Курс закрито'}</span>
                <span className="toggle-switch">
                  <input type="checkbox" checked={hasCourse} disabled={busyKey === course.id} onChange={() => toggleCourse(course.id)} aria-label={`Доступ до курсу ${course.title}`} />
                  <span className="toggle-slider" />
                </span>
              </label>
            </div>

            {hasCourse && (
              <React.Fragment>
                <div className="iw-access-tools">
                  <div className="iw-input-wrap"><Search size={17} aria-hidden="true" />
                    <input type="search" value={q} onChange={e => setQ(e.target.value)} placeholder="Номер або назва уроку…" aria-label="Пошук уроку" />
                  </div>
                  <div className="iw-chips" role="group" aria-label="Фільтр уроків">
                    {ACCESS_FILTERS.map(f => <button key={f.id} type="button" className="iw-chip" aria-pressed={filter === f.id} onClick={() => setFilter(f.id)}>{f.label}</button>)}
                  </div>
                </div>
                <ul className="iw-units">
                  {course.units.map(unit => {
                    const rows = unit.lessons.map(lesson => {
                      const key = `${course.id}:${lesson.id}`;
                      const state = completions.has(key) ? 'completed' : lessonAccess.has(key) ? 'granted' : 'locked';
                      return { lesson, key, state };
                    });
                    const shown = rows.filter(r => (filter === 'all' || r.state === filter) && (!query
                      || r.lesson.title.toLowerCase().includes(query)
                      || (r.lesson.titleUk || '').toLowerCase().includes(query)
                      || String(r.lesson.number) === query.replace(/^l/, '')
                      || unit.title.toLowerCase().includes(query)));
                    if (forceOpen && shown.length === 0) return null;
                    const k = `${course.id}:${unit.id}`;
                    const isOpen = forceOpen || open.has(k);
                    const lockedIds = rows.filter(r => r.state === 'locked').map(r => r.lesson.id);
                    const done = rows.filter(r => r.state === 'completed').length;
                    const openCount = rows.filter(r => r.state !== 'locked').length;
                    return (
                      <li key={unit.id} className={cx('iw-unit', isOpen && 'open')}>
                        <div className="iw-unit-head as-row">
                          <button type="button" className="iw-unit-toggle" aria-expanded={isOpen} onClick={() => toggleOpen(k)}>
                            <span className="iw-unit-num">{unit.number}</span>
                            <span className="iw-unit-titles">
                              <span className="iw-unit-title">{unit.title}</span>
                              <span className="iw-unit-sub">{openCount}/{rows.length} відкрито · {done} завершено</span>
                            </span>
                            <ChevronDown size={18} className="iw-unit-chev" aria-hidden="true" />
                          </button>
                          {lockedIds.length > 0 && (
                            <IwButton size="sm" variant="secondary" icon={Unlock} disabled={!!busyKey}
                              onClick={() => grantLessons(course.id, lockedIds)}>
                              Відкрити юніт <span className="iw-muted-num">({lockedIds.length})</span>
                            </IwButton>
                          )}
                        </div>
                        {isOpen && (
                          <ol className="iw-lesson-rows">
                            {shown.map(r => (
                              <li key={r.lesson.id} className={cx('iw-lrow', `is-${r.state}`)}>
                                <span className="iw-lrow-num">L{r.lesson.number}</span>
                                <span className="iw-lrow-titles">
                                  <span className="iw-lrow-title">{r.lesson.title}</span>
                                  {r.lesson.titleUk && <span className="iw-lrow-sub">{r.lesson.titleUk}</span>}
                                </span>
                                <span className="iw-lrow-type">{r.lesson.type}</span>
                                <button type="button" className={cx('iw-status', 'iw-status-btn', ACCESS_CLS[r.state])} disabled={busyKey === r.key}
                                  onClick={() => toggleLesson(course.id, r.lesson.id, r.state)}
                                  title={ACCESS_NEXT[r.state]} aria-label={`L${r.lesson.number} ${r.lesson.title}: ${r.state === 'locked' ? 'закрито' : r.state === 'granted' ? 'відкрито' : 'завершено'}. ${ACCESS_NEXT[r.state]}`}>
                                  {r.state === 'locked' && <React.Fragment><Lock size={13} /> Закрито</React.Fragment>}
                                  {r.state === 'granted' && <React.Fragment><Unlock size={13} /> Відкрито</React.Fragment>}
                                  {r.state === 'completed' && <React.Fragment><CheckCircle size={13} /> Завершено</React.Fragment>}
                                </button>
                              </li>
                            ))}
                          </ol>
                        )}
                      </li>
                    );
                  })}
                </ul>
              </React.Fragment>
            )}
          </section>
        );
      })}
    </div>
  );
}

// ── Вкладка «Домашні» ──
function StudentHomeworkTab({ stats, lessonAccess, completions, courseAccess, setRoute }) {
  const [filter, setFilter] = useState('all');
  const subs = stats.hwSubmissions;
  // «Задано» = відкриті уроки курсів учня, у яких є домашнє завдання
  const assigned = useMemo(() => {
    const out = [];
    COURSES.forEach(c => {
      if (!courseAccess.has(c.id)) return;
      c.units.forEach(u => u.lessons.forEach(l => {
        const key = `${c.id}:${l.id}`;
        if (!l.homework || !(lessonAccess.has(key) || completions.has(key))) return;
        const kinds = ['writing', 'speaking'].filter(k => l.homework[k]);
        const done = kinds.filter(k => subs.some(s => s.course_id === c.id && s.lesson_id === l.id && s.kind === k));
        out.push({ course: c, lesson: l, kinds, done });
      }));
    });
    return out;
  }, [subs, lessonAccess, completions, courseAccess]);
  const notSubmitted = assigned.filter(a => a.done.length < a.kinds.length);
  const shown = subs.filter(s => filter === 'all' || s.status === filter);
  const count = (st) => subs.filter(s => s.status === st).length;

  return (
    <div className="iw-hw-tab">
      <div className="iw-stat-grid">
        <StatCard icon={FileText} tone="sky" value={assigned.length} label="Уроків з домашнім" sub="серед відкритих" />
        <StatCard icon={Inbox} tone="mustard" value={count('submitted')} label="На перевірці" />
        <StatCard icon={CheckCircle} tone="sage" value={count('accepted')} label="Прийнято" />
        <StatCard icon={RefreshCw} tone="terracotta" value={count('returned')} label="Повернуто" />
      </div>

      <section className="iw-card">
        <div className="iw-card-head">
          <h3 className="iw-card-title">Здані роботи</h3>
          <div className="iw-chips" role="group" aria-label="Фільтр домашніх">
            {[['all', 'Усі', subs.length], ['submitted', 'На перевірці', count('submitted')], ['accepted', 'Прийнято', count('accepted')], ['returned', 'Повернуто', count('returned')]].map(([id, label, n]) => (
              <button key={id} type="button" className="iw-chip" aria-pressed={filter === id} onClick={() => setFilter(id)}>{label}<span className="iw-chip-count">{n}</span></button>
            ))}
          </div>
        </div>
        {shown.length === 0 && <p className="iw-scard-muted">{subs.length === 0 ? 'Учень ще не здав жодної домашньої роботи.' : 'Немає робіт із таким статусом.'}</p>}
        <ul className="iw-hw-list">
          {shown.map(s => {
            const f = findLesson(s.course_id, s.lesson_id);
            const kind = HW_KIND[s.kind] || { label: s.kind, icon: FileText };
            const KI = kind.icon;
            const st = HW_STATUS[s.status] || { label: s.status, tone: null };
            return (
              <li key={s.id || `${s.lesson_id}:${s.kind}:${s.submitted_at}`} className="iw-hw-row">
                <span className="iw-hw-kind" title={kind.label}><KI size={16} aria-hidden="true" /></span>
                <div className="iw-hw-body">
                  <div className="iw-hw-title">{f ? `L${f.lesson.number} · ${f.lesson.title}` : s.lesson_id}</div>
                  <div className="iw-hw-sub">
                    {kind.label} · здано {s.submitted_at ? new Date(s.submitted_at).toLocaleDateString('uk-UA', { day: 'numeric', month: 'short' }) : '—'}
                    {s.reviewed_at && ` · перевірено ${new Date(s.reviewed_at).toLocaleDateString('uk-UA', { day: 'numeric', month: 'short' })}`}
                  </div>
                  {s.teacher_comment && <div className="iw-hw-comment">«{s.teacher_comment}»</div>}
                </div>
                <Badge tone={st.tone}>{st.label}</Badge>
                {s.status === 'submitted' && <IwButton size="sm" variant="primary" onClick={() => setRoute({ page: 'homework-review' })}>Перевірити</IwButton>}
              </li>
            );
          })}
        </ul>
      </section>

      {notSubmitted.length > 0 && (
        <section className="iw-card iw-card-soft">
          <h3 className="iw-card-title">Ще не здано <span className="iw-muted-num">({notSubmitted.length})</span></h3>
          <ul className="iw-hw-pending-list">
            {notSubmitted.map(a => (
              <li key={`${a.course.id}:${a.lesson.id}`}>
                <span className="iw-lrow-num">L{a.lesson.number}</span>
                <span className="iw-lrow-title">{a.lesson.title}</span>
                <span className="iw-hw-missing">
                  {a.kinds.filter(k => !a.done.includes(k)).map(k => <Badge key={k}>{(HW_KIND[k] || {}).label || k}</Badge>)}
                </span>
              </li>
            ))}
          </ul>
        </section>
      )}
    </div>
  );
}

// ── Вкладка «Нотатки» — приватні нотатки вчителя ──
// Таблиця teacher_notes з RLS «тільки для вчителів». Учні не можуть
// прочитати її навіть напряму через API. SQL — supabase/teacher_notes.sql
const TEACHER_NOTES_SQL = `-- Inkwell 2.0 · приватні нотатки вчителя про учня
create or replace function public.inkwell_is_teacher()
returns boolean language sql stable security definer set search_path = public as $$
  select exists (select 1 from public.profiles where id = auth.uid() and role = 'teacher');
$$;

create table if not exists public.teacher_notes (
  id uuid primary key default gen_random_uuid(),
  student_id uuid not null references public.profiles(id) on delete cascade,
  author_id uuid default auth.uid() references public.profiles(id) on delete set null,
  body text not null check (char_length(body) between 1 and 5000),
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);
create index if not exists teacher_notes_student_idx on public.teacher_notes (student_id, updated_at desc);

alter table public.teacher_notes enable row level security;
drop policy if exists "teacher_notes: teachers only" on public.teacher_notes;
create policy "teacher_notes: teachers only" on public.teacher_notes
  for all to authenticated
  using (public.inkwell_is_teacher())
  with check (public.inkwell_is_teacher());

create or replace function public.teacher_notes_touch()
returns trigger language plpgsql as $$
begin new.updated_at := now(); return new; end; $$;
drop trigger if exists teacher_notes_touch on public.teacher_notes;
create trigger teacher_notes_touch before update on public.teacher_notes
  for each row execute function public.teacher_notes_touch();`;

function isMissingTable(error) {
  return !!error && (error.code === '42P01' || error.code === 'PGRST205' || /does not exist|could not find the table/i.test(error.message || ''));
}

function TeacherNotesTab({ studentId, studentName, session }) {
  const [notes, setNotes] = useState([]);
  const [state, setState] = useState('loading'); // loading | ready | missing | error
  const [errMsg, setErrMsg] = useState('');
  const [draft, setDraft] = useState('');
  const [saving, setSaving] = useState(false);
  const [editing, setEditing] = useState(null); // { id, body }
  const [toDelete, setToDelete] = useState(null);

  async function load() {
    setState('loading');
    const { data, error } = await window.SB.from('teacher_notes')
      .select('id, body, created_at, updated_at, author_id')
      .eq('student_id', studentId)
      .order('updated_at', { ascending: false });
    if (isMissingTable(error)) { setState('missing'); return; }
    if (error) { setErrMsg(error.message); setState('error'); return; }
    setNotes(data || []);
    setState('ready');
  }
  useEffect(() => { load(); }, [studentId]);

  async function add() {
    const body = draft.trim();
    if (!body) return;
    setSaving(true);
    const { data, error } = await window.SB.from('teacher_notes')
      .insert({ student_id: studentId, author_id: session.user.id, body })
      .select('id, body, created_at, updated_at, author_id')
      .single();
    setSaving(false);
    if (error) { toast('Не вдалося зберегти: ' + error.message, 'error'); return; }
    setNotes(prev => [data || { id: Date.now(), body, created_at: new Date().toISOString(), updated_at: new Date().toISOString() }, ...prev]);
    setDraft('');
    toast('Нотатку збережено', 'success');
  }

  async function saveEdit() {
    const body = editing.body.trim();
    if (!body) return;
    setSaving(true);
    const { error } = await window.SB.from('teacher_notes').update({ body }).eq('id', editing.id);
    setSaving(false);
    if (error) { toast('Не вдалося зберегти: ' + error.message, 'error'); return; }
    const now = new Date().toISOString();
    setNotes(prev => prev.map(n => n.id === editing.id ? { ...n, body, updated_at: now } : n).sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at)));
    setEditing(null);
    toast('Зміни збережено', 'success');
  }

  async function remove() {
    const id = toDelete.id;
    setSaving(true);
    const { error } = await window.SB.from('teacher_notes').delete().eq('id', id);
    setSaving(false);
    if (error) { toast('Не вдалося видалити: ' + error.message, 'error'); return; }
    setNotes(prev => prev.filter(n => n.id !== id));
    setToDelete(null);
    toast('Нотатку видалено');
  }

  const onKey = (fn) => (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); fn(); } };

  if (state === 'loading') return <div className="iw-notes"><Skeleton h={120} r={16} /><Skeleton h={80} r={16} /></div>;

  if (state === 'missing') {
    return (
      <div className="iw-card iw-setup">
        <div className="iw-setup-art"><Illustration name="notebook" /></div>
        <div>
          <h3 className="iw-card-title">Нотатки ще не підключено</h3>
          <p className="iw-modal-text">
            Для приватних нотаток потрібна одна нова таблиця в Supabase. Вона доступна лише вчителям — учні не побачать її навіть через API.
            Відкрий <strong>Supabase → SQL Editor</strong>, встав код і натисни <strong>Run</strong>. Наявні дані це не змінює.
          </p>
          <div className="iw-setup-actions">
            <IwButton variant="primary" icon={FileText} onClick={() => {
              const done = () => toast('SQL скопійовано', 'success');
              try { navigator.clipboard.writeText(TEACHER_NOTES_SQL).then(done, () => toast('Не вдалося скопіювати — виділи код вручну', 'error')); } catch (e) { toast('Не вдалося скопіювати — виділи код вручну', 'error'); }
            }}>Скопіювати SQL</IwButton>
            <IwButton variant="secondary" icon={RefreshCw} onClick={load}>Перевірити ще раз</IwButton>
          </div>
          <details className="iw-setup-sql"><summary>Показати SQL</summary><pre>{TEACHER_NOTES_SQL}</pre></details>
        </div>
      </div>
    );
  }

  if (state === 'error') {
    return <div className="modal-error">Не вдалося завантажити нотатки: {errMsg} <IwButton size="sm" variant="ghost" onClick={load}>Спробувати ще раз</IwButton></div>;
  }

  return (
    <div className="iw-notes">
      <div className="iw-card iw-note-new">
        <label className="iw-note-label" htmlFor="iw-note-draft">
          <Lock size={14} aria-hidden="true" /> Приватна нотатка про {studentName} — бачать лише вчителі
        </label>
        <textarea id="iw-note-draft" className="iw-textarea" rows={3} maxLength={5000} value={draft}
          onChange={e => setDraft(e.target.value)} onKeyDown={onKey(add)}
          placeholder="Наприклад: плутає Present Perfect і Past Simple; любить футбол — давати приклади про спорт." />
        <div className="iw-note-actions">
          <span className="iw-note-hint">Ctrl + Enter — зберегти</span>
          <IwButton variant="primary" size="sm" onClick={add} disabled={saving || !draft.trim()}>{saving ? 'Зберігаю…' : 'Додати нотатку'}</IwButton>
        </div>
      </div>

      {notes.length === 0 && <EmptyState art="notebook" title="Нотаток поки немає" text="Записуй спостереження, цілі та домовленості — вони залишаться тут між заняттями." />}

      <ul className="iw-note-list">
        {notes.map(n => (
          <li key={n.id} className="iw-card iw-note">
            {editing && editing.id === n.id ? (
              <React.Fragment>
                <textarea className="iw-textarea" rows={4} maxLength={5000} autoFocus value={editing.body}
                  onChange={e => setEditing({ ...editing, body: e.target.value })} onKeyDown={onKey(saveEdit)} aria-label="Редагування нотатки" />
                <div className="iw-note-actions">
                  <IwButton size="sm" variant="ghost" onClick={() => setEditing(null)} disabled={saving}>Скасувати</IwButton>
                  <IwButton size="sm" variant="primary" onClick={saveEdit} disabled={saving || !editing.body.trim()}>Зберегти</IwButton>
                </div>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <p className="iw-note-body">{n.body}</p>
                <div className="iw-note-foot">
                  <span>
                    {new Date(n.created_at).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long', year: 'numeric' })}
                    {n.updated_at && Math.abs(new Date(n.updated_at) - new Date(n.created_at)) > 60000 && ` · змінено ${formatRelativeTime(n.updated_at)}`}
                  </span>
                  <span className="iw-note-tools">
                    <IwButton size="sm" variant="ghost" icon={Pencil} onClick={() => setEditing({ id: n.id, body: n.body })}>Змінити</IwButton>
                    <IwButton size="sm" variant="ghost" icon={Trash2} onClick={() => setToDelete(n)} aria-label="Видалити нотатку" />
                  </span>
                </div>
              </React.Fragment>
            )}
          </li>
        ))}
      </ul>

      <ConfirmDialog open={!!toDelete} danger busy={saving} title="Видалити нотатку?" text="Нотатку буде видалено назавжди."
        confirmLabel="Видалити" onCancel={() => setToDelete(null)} onConfirm={remove} />
    </div>
  );
}

function HomeworkReviewPage({ session, goHome, setRoute }) {
  const [submissions, setSubmissions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [selected, setSelected] = useState(null); // submission обраний для перевірки
  const [filter, setFilter] = useState('pending'); // pending | all

  async function loadSubmissions() {
    setLoading(true);
    let query = window.SB
      .from('homework_submissions')
      .select('*')
      .order('submitted_at', { ascending: false });
    if (filter === 'pending') query = query.eq('status', 'submitted');
    const { data: subs, error } = await query;
    if (error) {
      setError(error.message);
      setLoading(false);
      return;
    }
    // Окремо тягнемо профілі учнів для показу імен
    const studentIds = [...new Set((subs || []).map(s => s.student_id))];
    let profilesMap = new Map();
    if (studentIds.length > 0) {
      const { data: profs } = await window.SB
        .from('profiles')
        .select('id, username, display_name')
        .in('id', studentIds);
      (profs || []).forEach(p => profilesMap.set(p.id, p));
    }
    const enriched = (subs || []).map(s => ({
      ...s,
      student_profile: profilesMap.get(s.student_id) || null
    }));
    setSubmissions(enriched);
    setLoading(false);
  }

  useEffect(() => { loadSubmissions(); }, [filter]);

  // Групуємо за учнем + уроком (одна пара writing+speaking = один рядок якщо обидва здані)
  const grouped = useMemo(() => {
    const map = new Map();
    submissions.forEach(s => {
      const key = `${s.student_id}:${s.course_id}:${s.lesson_id}`;
      if (!map.has(key)) {
        const lesson = findLesson(s.course_id, s.lesson_id);
        map.set(key, {
          key,
          student: s.student_profile,
          studentId: s.student_id,
          courseId: s.course_id,
          lessonId: s.lesson_id,
          courseTitle: lesson?.course?.title || s.course_id,
          lessonNumber: lesson?.lesson?.number || '?',
          lessonTitle: lesson?.lesson?.title || s.lesson_id,
          writing: null,
          speaking: null,
          latestSubmittedAt: s.submitted_at
        });
      }
      const g = map.get(key);
      if (s.kind === 'writing') g.writing = s;
      if (s.kind === 'speaking') g.speaking = s;
      if (s.submitted_at > g.latestSubmittedAt) g.latestSubmittedAt = s.submitted_at;
    });
    return Array.from(map.values()).sort((a, b) => b.latestSubmittedAt.localeCompare(a.latestSubmittedAt));
  }, [submissions]);

  function handleReviewed() {
    setSelected(null);
    loadSubmissions(); // перезавантажуємо список
  }

  return (
    <main className="page">
      <Crumbs items={[
        { label: 'Library', onClick: goHome },
        { label: 'Учні', onClick: () => setRoute({ page: 'students' }) },
        { label: 'Домашки на перевірці', current: true }
      ]} />
      <header className="page-header">
        <div className="page-eyebrow"><span className="dot" /> Homework review</div>
        <h1 className="page-title">Домашки учнів</h1>
        <p style={{ fontSize: 16, color: 'var(--ink-2)', lineHeight: 1.6, marginTop: 14 }}>
          Тут з’являються здані домашки. Клікни на рядок, щоб переглянути, залишити коментар і прийняти або повернути на доопрацювання.
        </p>
      </header>

      <div className="hw-review-toolbar">
        <div className="hw-review-tabs">
          <button className={`hw-review-tab ${filter === 'pending' ? 'active' : ''}`} onClick={() => setFilter('pending')}>
            На перевірці
          </button>
          <button className={`hw-review-tab ${filter === 'all' ? 'active' : ''}`} onClick={() => setFilter('all')}>
            Усі домашки
          </button>
        </div>
      </div>

      {error && <div className="modal-error">{error}</div>}
      {loading && <div className="empty-inline">Завантажую...</div>}

      {!loading && grouped.length === 0 && (
        <div className="empty-inline">
          <div className="empty-inline-title">{filter === 'pending' ? 'Нічого перевіряти 🎉' : 'Ще немає жодної домашки'}</div>
          <div>{filter === 'pending' ? 'Усі здані домашки вже переглянуто. Так тримати!' : 'Учні ще не здавали жодної домашки.'}</div>
        </div>
      )}

      {!loading && grouped.length > 0 && (
        <div className="hw-review-list">
          {grouped.map(g => (
            <HomeworkReviewRow key={g.key} group={g} onClick={() => setSelected(g)} />
          ))}
        </div>
      )}

      {selected && (
        <HomeworkReviewModal
          group={selected}
          session={session}
          onClose={() => setSelected(null)}
          onReviewed={handleReviewed}
        />
      )}
    </main>
  );
}

function HomeworkReviewRow({ group, onClick }) {
  const hasWriting = !!group.writing;
  const hasSpeaking = !!group.speaking;
  const writingStatus = group.writing?.status;
  const speakingStatus = group.speaking?.status;

  return (
    <button className="hw-review-row" onClick={onClick}>
      <div className="hw-review-avatar">{initialsFor(group.student?.display_name || group.student?.username || '?')}</div>
      <div className="hw-review-info">
        <div className="hw-review-student">{group.student?.display_name || group.student?.username || 'Учень'}</div>
        <div className="hw-review-lesson">
          {group.courseTitle} · Lesson {group.lessonNumber}: {group.lessonTitle}
        </div>
        <div className="hw-review-date">
          Здано: {new Date(group.latestSubmittedAt).toLocaleString('uk-UA', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}
        </div>
      </div>
      <div className="hw-review-badges">
        {hasWriting && <HomeworkKindBadge kind="writing" status={writingStatus} />}
        {hasSpeaking && <HomeworkKindBadge kind="speaking" status={speakingStatus} />}
      </div>
      <ChevronRight size={18} className="hw-review-chevron" />
    </button>
  );
}

function HomeworkKindBadge({ kind, status }) {
  const icon = kind === 'writing' ? '✍️' : '🎤';
  const label = kind === 'writing' ? 'Writing' : 'Speaking';
  return (
    <div className={`hw-review-kind-badge status-${status}`}>
      <span>{icon}</span>
      <span>{label}</span>
      {status === 'accepted' && <span className="hw-review-kind-mark">✓</span>}
      {status === 'returned' && <span className="hw-review-kind-mark">↻</span>}
      {status === 'submitted' && <span className="hw-review-kind-mark hw-review-kind-mark-new">•</span>}
    </div>
  );
}

// Модалка перевірки — велика, з обома частинами
function HomeworkReviewModal({ group, session, onClose, onReviewed }) {
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal hw-review-modal" onClick={e => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose} aria-label="Закрити"><X size={18} /></button>
        <div className="hw-review-modal-head">
          <h2 className="modal-title">{group.student?.display_name || group.student?.username}</h2>
          <div style={{ fontSize: 13.5, color: 'var(--ink-2)', marginTop: 2 }}>
            {group.courseTitle} · Lesson {group.lessonNumber}: {group.lessonTitle}
          </div>
        </div>

        <div className="hw-review-parts">
          {group.writing && (
            <HomeworkReviewPart
              submission={group.writing}
              kind="writing"
              icon="✍️"
              session={session}
              onReviewed={onReviewed}
            />
          )}
          {group.speaking && (
            <HomeworkReviewPart
              submission={group.speaking}
              kind="speaking"
              icon="🎤"
              session={session}
              onReviewed={onReviewed}
            />
          )}
        </div>
      </div>
    </div>
  );
}

// Одна секція перевірки — writing або speaking
function HomeworkReviewPart({ submission, kind, icon, session, onReviewed }) {
  const [comment, setComment] = useState(submission.teacher_comment || '');
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');
  const [audioUrl, setAudioUrl] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [deleting, setDeleting] = useState(false);

  // Тягнемо підписаний URL для аудіо
  useEffect(() => {
    if (kind !== 'speaking' || !submission.content_audio_url) return;
    async function load() {
      const { data } = await window.SB.storage
        .from('homework-audio')
        .createSignedUrl(submission.content_audio_url, 3600);
      if (data) setAudioUrl(data.signedUrl);
    }
    load();
  }, [submission.content_audio_url, kind]);

  async function handleDelete() {
    setError('');
    setDeleting(true);
    const { error } = await deleteHomeworkSubmission(submission);
    setDeleting(false);
    if (error) {
      setError('Помилка видалення: ' + error.message);
      return;
    }
    onReviewed();
  }

  async function updateStatus(newStatus) {
    setError('');
    setSaving(true);
    const { error } = await window.SB.from('homework_submissions')
      .update({
        status: newStatus,
        teacher_comment: comment.trim() || null,
        reviewed_at: new Date().toISOString(),
        reviewed_by: session.user.id
      })
      .eq('id', submission.id);
    setSaving(false);
    if (error) {
      setError(error.message);
      return;
    }
    onReviewed();
  }

  const isReviewed = submission.status !== 'submitted';

  return (
    <div className={`hw-review-part hw-review-part-${kind}`}>
      <div className="hw-review-part-head">
        <span className="hw-review-part-icon">{icon}</span>
        <div>
          <div className="hw-review-part-kind">{kind === 'writing' ? 'Writing' : 'Speaking'}</div>
          <div className="hw-review-part-status" data-status={submission.status}>
            {submission.status === 'submitted' && '🟡 На перевірці'}
            {submission.status === 'accepted' && '🟢 Прийнято'}
            {submission.status === 'returned' && '🔴 Повернуто на доопрацювання'}
          </div>
        </div>
      </div>

      {kind === 'writing' && (
        <div className="hw-review-content">
          <div className="hw-review-content-label">Відповідь учня</div>
          <div className="hw-review-content-text">{submission.content_text}</div>
        </div>
      )}

      {kind === 'speaking' && (
        <div className="hw-review-content">
          <div className="hw-review-content-label">Запис учня</div>
          {audioUrl ? (
            <audio controls src={audioUrl} style={{ width: '100%', marginTop: 8 }} />
          ) : (
            <div style={{ color: 'var(--ink-3)', fontStyle: 'italic', padding: '10px 0' }}>Завантажую аудіо...</div>
          )}
        </div>
      )}

      <div className="hw-review-comment-field">
        <label className="hw-form-label">Твій коментар (необов'язково)</label>
        <textarea
          className="hw-textarea"
          value={comment}
          onChange={e => setComment(e.target.value)}
          placeholder={kind === 'writing' ? "Наприклад: чудова робота! Але «goed» → «went». І перегляньте артиклі в 2 реченні." : "Наприклад: гарне вимовляння, тільки уповільни трохи на другій частині."}
          rows={3}
          disabled={saving}
        />
      </div>

      {error && <div className="hw-form-error">{error}</div>}

      <div className="hw-review-actions">
        {confirmDelete ? (
          <div className="hw-review-delete-confirm">
            <span>Точно видалити цю здачу?</span>
            <button className="modal-btn ghost" onClick={() => setConfirmDelete(false)} disabled={deleting}>
              Скасувати
            </button>
            <button className="modal-btn danger" onClick={handleDelete} disabled={deleting}>
              {deleting ? '...' : 'Так, видалити'}
            </button>
          </div>
        ) : (
          <React.Fragment>
            <button
              className="modal-btn ghost hw-review-delete-btn"
              onClick={() => setConfirmDelete(true)}
              disabled={saving}
              title="Видалити цю здачу"
            >
              <Trash2 size={13} /> Видалити
            </button>
            <div style={{ flex: 1 }} />
            <button
              className="modal-btn danger"
              onClick={() => updateStatus('returned')}
              disabled={saving}
              title="Повернути учню на доопрацювання"
            >
              ↻ Повернути
            </button>
            <button
              className="modal-btn primary"
              onClick={() => updateStatus('accepted')}
              disabled={saving}
              title="Прийняти цю частину"
            >
              {saving ? '...' : '✓ Прийняти'}
            </button>
          </React.Fragment>
        )}
      </div>

      {isReviewed && (
        <div style={{ fontSize: 12, color: 'var(--ink-3)', fontStyle: 'italic', marginTop: 8, textAlign: 'right' }}>
          Оцінено раніше · {new Date(submission.reviewed_at).toLocaleString('uk-UA', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}
        </div>
      )}
    </div>
  );
}
