// Модальне вікно у порталі: Esc, фокус-пастка, повернення фокусу
function Modal({ open, onClose, title, children, actions, width }) {
  const box = useRef(null);
  const titleId = useSafeId();
  useEffect(() => {
    if (!open) return;
    const prev = document.activeElement;
    const focusables = () => Array.from(box.current ? box.current.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])') : []).filter(el => !el.disabled);
    const raf = requestAnimationFrame(() => { const f = focusables(); (f[0] || box.current) && (f[0] || box.current).focus(); });
    const onKey = (e) => {
      if (e.key === 'Escape' && onClose) { e.stopPropagation(); onClose(); }
      if (e.key === 'Tab') {
        const f = focusables(); if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener('keydown', onKey);
    const overflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => {
      cancelAnimationFrame(raf);
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = overflow;
      if (prev && prev.focus) prev.focus();
    };
  }, [open]);
  if (!open) return null;
  return ReactDOM.createPortal(
    <div className="iw-modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget && onClose) onClose(); }}>
      <div className="iw-modal" role="dialog" aria-modal="true" aria-labelledby={titleId} ref={box} tabIndex={-1} style={width ? { maxWidth: width } : undefined}>
        {title && <h2 className="iw-modal-title" id={titleId}>{title}</h2>}
        {children}
        {actions && <div className="iw-modal-actions">{actions}</div>}
      </div>
    </div>,
    document.body
  );
}

  const [items, setItems] = useState([]);

function getAllLessons() {
  const flat = [];
  COURSES.forEach(course => course.units.forEach(unit => unit.lessons.forEach(lesson => {
    flat.push({ ...lesson, courseId: course.id, unitId: unit.id, unitNumber: unit.number, level: course.level, age: course.age });
  })));
  return flat;
}
function findLesson(courseId, lessonId) {
  for (const course of COURSES) {
    if (course.id !== courseId) continue;
    for (const unit of course.units) {
      const lesson = unit.lessons.find(l => l.id === lessonId);
      if (lesson) return { course, unit, lesson };
    }
  }
  return null;
}

// ── Vocabulary utilities ──
function slugify(str) {
  return String(str || '').toLowerCase()
    .replace(/\u2019/g, '') // ' apostrophe
    .replace(/[^a-z0-9\s-]/g, '')
    .trim().replace(/\s+/g, '-').replace(/-+/g, '-')
    .slice(0, 40) || 'word';
}

// Витягуємо всі слова з усіх курсів як плоский список з мета-даними
function getAllVocabItems() {
  const items = [];
  COURSES.forEach(course => course.units.forEach(unit => unit.lessons.forEach(lesson => {
    const list = lesson.vocabPresentation && lesson.vocabPresentation.items;
    // Revision та Exam уроки лише повторюють уже вивчене — у банк слів не додаємо
    if (!list || lesson.excludeFromVocabBank) return;
    if (lesson.type === 'Revision' || lesson.type === 'Exam') return;
    list.forEach((word, idx) => {
      const slug = slugify(word.en);
      items.push({
        wordId: `${course.id}:${lesson.id}:${slug}-${idx}`, // idx для унікальності при повторах
        courseId: course.id,
        courseTitle: course.title,
        unitId: unit.id,
        unitNumber: unit.number,
        unitTitle: unit.title,
        lessonId: lesson.id,
        lessonNumber: lesson.number,
        lessonTitle: lesson.title,
        lessonTitleUk: lesson.titleUk,
        emoji: word.emoji,
        en: word.en,
        uk: word.uk,
        explain: word.explain,
        accent: word.accent
      });
    });
  })));
  return items;
}

function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function MCQExercise({ exercise, num }) {
  const [answers, setAnswers] = useState({});
  const [checked, setChecked] = useState(false);
  const score = useMemo(() => { let s = 0; exercise.questions.forEach((q, i) => { if (answers[i] === q.correct) s++; }); return s; }, [answers, exercise]);
  const select = (qi, oi) => { if (checked) return; setAnswers(prev => ({ ...prev, [qi]: oi })); };
  const reset = () => { setAnswers({}); setChecked(false); };
  const allAnswered = Object.keys(answers).length === exercise.questions.length;
  return (
    <div className="exercise">
      <div className="exercise-head">
        <div>
          <div className="exercise-num">Exercise {num}</div>
          <h4 className="exercise-title">{exercise.title}</h4>
          <div className="exercise-instruction">{exercise.instruction}</div>
        </div>
        <div className="exercise-score">{Object.keys(answers).length}/{exercise.questions.length}</div>
      </div>
      <div className="mcq-list">
        {exercise.questions.map((q, qi) => {
          const sel = answers[qi];
          const isCorrect = checked && sel === q.correct;
          return (
            <div key={qi} className="mcq-item">
              <div className="mcq-q"><span className="qnum">{qi + 1}.</span>{q.q}</div>
              <div className="mcq-options">
                {q.options.map((opt, oi) => {
                  let cls = 'mcq-option';
                  if (sel === oi) cls += ' selected';
                  if (checked && oi === q.correct) cls += ' correct';
                  if (checked && sel === oi && oi !== q.correct) cls += ' wrong';
                  return <button key={oi} className={cls} onClick={() => select(qi, oi)} disabled={checked}>{opt}</button>;
                })}
              </div>
              {checked && (
                <div className={`mcq-feedback ${isCorrect ? 'correct' : 'wrong'}`}>
                  {isCorrect ? '✓ Correct!' : sel === undefined ? '— Not answered' : `✗ Correct answer: ${q.options[q.correct]}`}
                </div>
              )}
            </div>
          );
        })}
      </div>
      <div className="check-btn-row">
        {!checked ? <button className="check-btn" onClick={() => setChecked(true)} disabled={!allAnswered}><CheckCircle size={15} /> Check answers</button>
                  : <button className="check-btn reset" onClick={reset}><RefreshCw size={14} /> Try again</button>}
        {checked && <span className="result-pill"><CheckCircle size={14} /> {score} / {exercise.questions.length}</span>}
      </div>
    </div>
  );
}

function FillExercise({ exercise, num }) {
  const [answers, setAnswers] = useState({});
  const [checked, setChecked] = useState(false);
  const isMatch = (input, correct) => {
    if (!input) return false;
    const norm = (s) => s.toLowerCase().trim().replace(/[.,!?]/g, '').replace(/\u2019/g, "'").replace(/\s+/g, ' ');
    return norm(input) === norm(correct);
  };
  const score = useMemo(() => { let s = 0; exercise.questions.forEach((q, i) => { if (isMatch(answers[i], q.answer)) s++; }); return s; }, [answers, exercise]);
  const set = (i, v) => { if (checked) return; setAnswers(prev => ({ ...prev, [i]: v })); };
  const reset = () => { setAnswers({}); setChecked(false); };
  const allFilled = exercise.questions.every((_, i) => answers[i] && answers[i].trim());
  return (
    <div className="exercise">
      <div className="exercise-head">
        <div>
          <div className="exercise-num">Exercise {num}</div>
          <h4 className="exercise-title">{exercise.title}</h4>
          <div className="exercise-instruction">{exercise.instruction}</div>
        </div>
        <div className="exercise-score">{exercise.questions.filter((_, i) => answers[i] && answers[i].trim()).length}/{exercise.questions.length}</div>
      </div>
      {exercise.bank && (
        <div className="word-bank">
          <div className="word-bank-label">Word bank</div>
          {exercise.bank.map(w => <span key={w} className="word-bank-chip">{w}</span>)}
        </div>
      )}
      <div className="fill-list">
        {exercise.questions.map((q, i) => {
          const ok = checked && isMatch(answers[i], q.answer);
          const wrong = checked && !ok;
          return (
            <div key={i} className="fill-item">
              <div className="fill-row">
                <span style={{ fontFamily: 'var(--font-display)', fontWeight: 700, color: 'var(--ink-3)', marginRight: 6 }}>{i + 1}.</span>
                <span>{q.before}</span>
                <input className={`fill-input ${ok ? 'correct' : wrong ? 'wrong' : ''}`} type="text" value={answers[i] || ''} onChange={(e) => set(i, e.target.value)} placeholder="..." disabled={checked} />
                <span>{q.after}</span>
                {q.hint && <span className="fill-hint">({q.hint})</span>}
              </div>
              {checked && wrong && (
                <div className="mcq-feedback wrong" style={{ marginTop: 8, marginLeft: 26 }}>✗ Correct answer: <strong>{q.answer}</strong></div>
              )}
            </div>
          );
        })}
      </div>
      <div className="check-btn-row">
        {!checked ? <button className="check-btn" onClick={() => setChecked(true)} disabled={!allFilled}><CheckCircle size={15} /> Check answers</button>
                  : <button className="check-btn reset" onClick={reset}><RefreshCw size={14} /> Try again</button>}
        {checked && <span className="result-pill"><CheckCircle size={14} /> {score} / {exercise.questions.length}</span>}
      </div>
    </div>
  );
}

function MatchExercise({ exercise, num }) {
  const [leftItems] = useState(() => exercise.pairs.map((p, i) => ({ id: i, text: p.left })));
  const [rightItems] = useState(() => shuffle(exercise.pairs.map((p, i) => ({ id: i, text: p.right }))));
  const [selectedLeft, setSelectedLeft] = useState(null);
  const [selectedRight, setSelectedRight] = useState(null);
  const [matches, setMatches] = useState(new Set());
  useEffect(() => {
    if (selectedLeft !== null && selectedRight !== null) {
      if (selectedLeft === selectedRight) setMatches(prev => new Set([...prev, selectedLeft]));
      const t = setTimeout(() => { setSelectedLeft(null); setSelectedRight(null); }, 350);
      return () => clearTimeout(t);
    }
  }, [selectedLeft, selectedRight]);
  const reset = () => { setMatches(new Set()); setSelectedLeft(null); setSelectedRight(null); };
  const done = matches.size === exercise.pairs.length;
  return (
    <div className="exercise">
      <div className="exercise-head">
        <div>
          <div className="exercise-num">Exercise {num}</div>
          <h4 className="exercise-title">{exercise.title}</h4>
          <div className="exercise-instruction">{exercise.instruction}</div>
        </div>
        <div className="exercise-score">{matches.size}/{exercise.pairs.length}</div>
      </div>
      <div className="match-grid">
        <div>
          <div className="match-col-title">Activity</div>
          <div className="match-col">
            {leftItems.map(item => {
              let cls = 'match-tile';
              if (matches.has(item.id)) cls += ' matched';
              else if (selectedLeft === item.id) cls += ' selected';
              return <button key={item.id} className={cls} onClick={() => !matches.has(item.id) && setSelectedLeft(item.id)}>{item.text}</button>;
            })}
          </div>
        </div>
        <div>
          <div className="match-col-title">Place / situation</div>
          <div className="match-col">
            {rightItems.map(item => {
              let cls = 'match-tile';
              if (matches.has(item.id)) cls += ' matched';
              else if (selectedRight === item.id) cls += ' selected';
              return <button key={item.id} className={cls} onClick={() => !matches.has(item.id) && setSelectedRight(item.id)}>{item.text}</button>;
            })}
          </div>
        </div>
      </div>
      <div className="check-btn-row">
        {done && <span className="result-pill"><CheckCircle size={14} /> All matched!</span>}
        <button className="check-btn reset" onClick={reset}><RefreshCw size={14} /> Reset</button>
      </div>
    </div>
  );
}

function Exercise({ exercise, num }) {
  if (exercise.type === 'mcq') return <MCQExercise exercise={exercise} num={num} />;

// Компонент з логікою здачі
function HomeworkSubmitter({ kind, submission, courseId, lessonId, session, onUpdate }) {
  const status = submission?.status; // undefined | 'submitted' | 'accepted' | 'returned'
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [deleting, setDeleting] = useState(false);

  async function handleDelete() {
    setDeleting(true);
    const { error } = await deleteHomeworkSubmission(submission);
    setDeleting(false);
    if (error) {
      alert('Помилка видалення: ' + error.message);
      return;
    }
    setConfirmDelete(false);
    onUpdate(null); // повертаємо до порожнього стану (форма з'явиться знову)
  }

  // Прийнято — показуємо результат, без форми
  if (status === 'accepted') {
    return (
      <div className="hw-status-badge accepted">
        <div className="hw-status-icon"><Check size={18} /></div>
        <div style={{ flex: 1 }}>
          <div className="hw-status-title">Прийнято ✨</div>
          <div className="hw-status-sub">Твоє завдання зараховане!</div>
          {submission.teacher_comment && (
            <div className="hw-teacher-comment">
              <div className="hw-teacher-comment-label">Коментар вчителя</div>
              <div className="hw-teacher-comment-text">{submission.teacher_comment}</div>
            </div>
          )}
          {kind === 'writing' && <HomeworkYourAnswer text={submission.content_text} />}
          {kind === 'speaking' && <HomeworkAudioPlayer path={submission.content_audio_url} />}
          <HomeworkDeleteControl
            confirmDelete={confirmDelete}
            setConfirmDelete={setConfirmDelete}
            handleDelete={handleDelete}
            deleting={deleting}
          />
        </div>
      </div>
    );
  }

  // На перевірці — показуємо що надіслав, чекаємо
  if (status === 'submitted') {
    return (
      <div className="hw-status-badge submitted">
        <div className="hw-status-icon"><Clock size={18} /></div>
        <div style={{ flex: 1 }}>
          <div className="hw-status-title">На перевірці</div>
          <div className="hw-status-sub">Учитель ще не перевірив. Дам знати, коли буде готово 🙌</div>
          {kind === 'writing' && <HomeworkYourAnswer text={submission.content_text} />}
          {kind === 'speaking' && <HomeworkAudioPlayer path={submission.content_audio_url} />}
          <HomeworkDeleteControl
            confirmDelete={confirmDelete}
            setConfirmDelete={setConfirmDelete}
            handleDelete={handleDelete}
            deleting={deleting}
          />
        </div>
      </div>
    );
  }

  // Повернуто — показуємо коментар і форму перездачі
  if (status === 'returned') {
    return (
      <React.Fragment>
        <div className="hw-status-badge returned">
          <div className="hw-status-icon">↻</div>
          <div style={{ flex: 1 }}>
            <div className="hw-status-title">Повернуто на доопрацювання</div>
            <div className="hw-status-sub">Учитель залишив коментар. Прочитай, зроби правки й здай знову.</div>
            {submission.teacher_comment && (
              <div className="hw-teacher-comment">
                <div className="hw-teacher-comment-label">Коментар вчителя</div>
                <div className="hw-teacher-comment-text">{submission.teacher_comment}</div>
              </div>
            )}
            <HomeworkDeleteControl
              confirmDelete={confirmDelete}
              setConfirmDelete={setConfirmDelete}
              handleDelete={handleDelete}
              deleting={deleting}
            />
          </div>
        </div>
        <HomeworkForm
          kind={kind}
          courseId={courseId}
          lessonId={lessonId}
          session={session}
          existing={submission}
          onDone={onUpdate}
          resubmit
        />
      </React.Fragment>
    );
  }

  // Ще нічого не здано — показуємо форму
  return (
    <HomeworkForm
      kind={kind}
      courseId={courseId}
      lessonId={lessonId}
      session={session}
      existing={null}
      onDone={onUpdate}
    />
  );
}

// Плеєр для аудіо з приватного bucket
function HomeworkAudioPlayer({ path }) {
  const [url, setUrl] = useState(null);
  const [error, setError] = useState('');

  useEffect(() => {
    if (!path) return;
    async function load() {
      // Створюємо тимчасовий підписаний URL (60 хв)
      const { data, error } = await window.SB.storage
        .from('homework-audio')
        .createSignedUrl(path, 3600);
      if (error) setError(error.message);
      else setUrl(data.signedUrl);
    }
    load();
  }, [path]);

  if (error) return <div className="hw-your-answer"><em style={{ color: 'var(--terracotta-deep)' }}>Не вдалося завантажити аудіо: {error}</em></div>;

  return (
    <div className="hw-your-answer">
      <div className="hw-your-answer-label">Твій запис</div>
      <audio controls src={url} style={{ width: '100%', marginTop: 6 }} />
    </div>
  );
}

// Форма подачі — writing або speaking
function HomeworkForm({ kind, courseId, lessonId, session, existing, onDone, resubmit }) {
  const [text, setText] = useState(existing?.content_text || '');
  const [audioBlob, setAudioBlob] = useState(null);
  const [audioUrl, setAudioUrl] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState('');

  async function handleSubmit() {
    setError('');
    if (kind === 'writing') {
      if (!text.trim() || text.trim().length < 10) {
        setError('Напиши хоча б кілька повних речень');
        return;
      }
    } else {
      if (!audioBlob) {
        setError('Спершу запиши аудіо');
        return;
      }
    }

    setSubmitting(true);
    try {
      let audioPath = existing?.content_audio_url || null;

      // Для speaking — заливаємо файл у Storage
      if (kind === 'speaking' && audioBlob) {
        const ext = audioBlob.type.includes('webm') ? 'webm' : audioBlob.type.includes('mp4') ? 'm4a' : 'ogg';
        const fileName = `${session.user.id}/${courseId}__${lessonId}__${Date.now()}.${ext}`;
        const { error: uploadError } = await window.SB.storage
          .from('homework-audio')
          .upload(fileName, audioBlob, { contentType: audioBlob.type, upsert: true });
        if (uploadError) {
          setError('Не вдалося завантажити аудіо: ' + uploadError.message);
          setSubmitting(false);
          return;
        }
        audioPath = fileName;
      }

      // Створюємо або оновлюємо запис
      const payload = {
        student_id: session.user.id,
        course_id: courseId,
        lesson_id: lessonId,
        kind,
        content_text: kind === 'writing' ? text.trim() : null,
        content_audio_url: kind === 'speaking' ? audioPath : null,
        status: 'submitted',
        submitted_at: new Date().toISOString(),
        // При перездачі — очищуємо старий коментар/review
        teacher_comment: null,
        reviewed_at: null,
        reviewed_by: null,
      };

      let result;
      if (existing) {
        result = await window.SB
          .from('homework_submissions')
          .update(payload)
          .eq('id', existing.id)
          .select()
          .single();
      } else {
        result = await window.SB
          .from('homework_submissions')
          .insert(payload)
          .select()
          .single();
      }
      if (result.error) {
        setError('Помилка збереження: ' + result.error.message);
        setSubmitting(false);
        return;
      }
      onDone(result.data);
    } catch (err) {
      setError('Помилка: ' + err.message);
      setSubmitting(false);
    }
  }

  return (
    <div className="hw-form">
      {error && <div className="hw-form-error">{error}</div>}

      {kind === 'writing' && (
        <React.Fragment>
          <label className="hw-form-label">Твоя відповідь</label>
          <textarea
            className="hw-textarea"
            value={text}
            onChange={e => setText(e.target.value)}
            placeholder="Напиши тут свою відповідь англійською..."
            rows={6}
            disabled={submitting}
          />
          <div className="hw-form-meta">{text.trim().split(/\s+/).filter(Boolean).length} слів</div>
        </React.Fragment>
      )}

      {kind === 'speaking' && (
        <AudioRecorder
          onRecorded={(blob, url) => { setAudioBlob(blob); setAudioUrl(url); }}
          disabled={submitting}
        />
      )}

      <button
        className="hw-submit-btn"
        onClick={handleSubmit}
        disabled={submitting || (kind === 'writing' ? !text.trim() : !audioBlob)}
      >
        {submitting ? 'Надсилаю...' : (resubmit ? 'Здати знову' : 'Здати домашку')}
      </button>
    </div>
  );
}

// Компонент запису аудіо через MediaRecorder API
function AudioRecorder({ onRecorded, disabled }) {
  const [state, setState] = useState('idle'); // idle | recording | recorded
  const [error, setError] = useState('');
  const [duration, setDuration] = useState(0);
  const [audioUrl, setAudioUrl] = useState(null);
  const mediaRecorderRef = useRef(null);
  const streamRef = useRef(null);
  const chunksRef = useRef([]);
  const startTimeRef = useRef(0);
  const intervalRef = useRef(null);

  async function startRecording() {
    setError('');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      streamRef.current = stream;
      // Обираємо оптимальний mimeType для браузера
      let mimeType = 'audio/webm;codecs=opus';
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = 'audio/webm';
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'audio/mp4';
          if (!MediaRecorder.isTypeSupported(mimeType)) {
            mimeType = '';
          }
        }
      }
      const mr = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      chunksRef.current = [];
      mr.ondataavailable = (e) => { if (e.data.size > 0) chunksRef.current.push(e.data); };
      mr.onstop = () => {
        const blob = new Blob(chunksRef.current, { type: mr.mimeType || 'audio/webm' });
        const url = URL.createObjectURL(blob);
        setAudioUrl(url);
        setState('recorded');
        onRecorded(blob, url);
        // зупиняємо мікрофон
        stream.getTracks().forEach(t => t.stop());
      };
      startTimeRef.current = Date.now();
      setDuration(0);
      intervalRef.current = setInterval(() => {
        setDuration(Math.round((Date.now() - startTimeRef.current) / 1000));
      }, 250);
      mr.start();
      mediaRecorderRef.current = mr;
      setState('recording');
    } catch (err) {
      if (err.name === 'NotAllowedError') {
        setError('Доступ до мікрофона заборонений. Дозволь його в налаштуваннях браузера.');
      } else {
        setError('Не вдалося отримати доступ до мікрофона: ' + err.message);
      }
    }
  }

  function stopRecording() {
    if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
      mediaRecorderRef.current.stop();
    }
    if (intervalRef.current) { clearInterval(intervalRef.current); intervalRef.current = null; }
  }

  function resetRecording() {
    if (audioUrl) URL.revokeObjectURL(audioUrl);
    setAudioUrl(null);
    setState('idle');
    setDuration(0);
    onRecorded(null, null);
  }

  const mins = Math.floor(duration / 60);
  const secs = duration % 60;

  return (
    <div className="audio-recorder">
      {error && <div className="hw-form-error">{error}</div>}

      {state === 'idle' && (
        <button className="audio-btn audio-btn-start" onClick={startRecording} disabled={disabled}>
          <span className="audio-btn-dot" /> Записати
        </button>
      )}

      {state === 'recording' && (
        <React.Fragment>
          <div className="audio-recording-indicator">
            <span className="audio-pulse" />
            <span>Записую... {String(mins).padStart(2, '0')}:{String(secs).padStart(2, '0')}</span>
          </div>
          <button className="audio-btn audio-btn-stop" onClick={stopRecording}>
            ■ Стоп
          </button>
        </React.Fragment>
      )}

      {state === 'recorded' && (
        <React.Fragment>
          <div className="audio-recorded-label">Запис ({String(mins).padStart(2, '0')}:{String(secs).padStart(2, '0')})</div>
          <audio controls src={audioUrl} style={{ width: '100%', marginTop: 6 }} />
          <button className="audio-btn audio-btn-redo" onClick={resetRecording} disabled={disabled}>
            ↻ Записати знову
          </button>
        </React.Fragment>
      )}
    </div>
  );
}

const TOC_ITEMS = [
  { id: 'sec-warmup', label: 'Warm-Up' },
  { id: 'sec-vocab', label: 'Vocabulary' },
  { id: 'sec-vocab-practice', label: 'Practice' },
  { id: 'sec-discovery', label: 'Discovery' },
  { id: 'sec-grammar', label: 'Grammar' },
  { id: 'sec-grammar-practice', label: 'Practice' },
  { id: 'sec-reading', label: 'Reading' },
  { id: 'sec-speaking', label: 'Speaking' },
  { id: 'sec-summary', label: 'Summary' },
  { id: 'sec-homework', label: 'Homework' },
];

function LessonTOC() {
  const [active, setActive] = useState('sec-warmup');
  useEffect(() => {
    const observers = [];
    TOC_ITEMS.forEach(item => {
      const el = document.getElementById(item.id);
      if (!el) return;
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(entry => { if (entry.isIntersecting) setActive(item.id); });
      }, { rootMargin: '-30% 0px -60% 0px' });
      obs.observe(el);
      observers.push(obs);
    });
    return () => observers.forEach(o => o.disconnect());
  }, []);
  const go = (id) => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  return (
    <nav className="lesson-toc">
      {TOC_ITEMS.map((item, i) => (
        <button key={item.id} className={`lesson-toc-link ${active === item.id ? 'active' : ''}`} onClick={() => go(item.id)}>
          <span className="lesson-toc-num">{String(i + 1).padStart(2, '0')}</span>
          <span>{item.label}</span>
        </button>
      ))}
    </nav>
  );
}

  const { course, unit, lesson } = found;

  // Перевірка доступу
  const hasAccess = isTeacher || (canSeeLesson && canSeeLesson(courseId, lessonId));
  if (!hasAccess) {
    return (
      <main className="page">
        <Crumbs items={[
          { label: 'Library', onClick: goHome },
          { label: course.title, onClick: () => goCourse(course.id) },
          { label: `Lesson ${lesson.number}`, current: true }

function ScrollToTop() {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const onScroll = () => setVisible(window.scrollY > 400);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <button
      className={`scroll-top ${visible ? 'visible' : ''}`}
      onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
      aria-label="Прокрутити нагору"
      title="До початку сторінки"
    >
      <ChevronUp size={20} />
    </button>
  );
}

function VocabAccessSection({ student, allVocabItems, completions, vocabAccess, toggleVocabWord, grantAllVocabInLesson, revokeAllVocabInLesson, grantAllVocabInCourse, revokeAllVocabInCourse }) {
  const [expandedCourse, setExpandedCourse] = useState(null);
  const [expandedLesson, setExpandedLesson] = useState(null);

  // Групуємо всі слова за курсом → уроком
  const structure = useMemo(() => {
    const map = new Map();
    allVocabItems.forEach(item => {
      if (!map.has(item.courseId)) {
        const course = COURSES.find(c => c.id === item.courseId);
        map.set(item.courseId, {
          courseId: item.courseId,
          courseTitle: course ? course.title : item.courseTitle,
          lessons: new Map()
        });
      }
      const courseEntry = map.get(item.courseId);
      if (!courseEntry.lessons.has(item.lessonId)) {
        courseEntry.lessons.set(item.lessonId, {
          lessonId: item.lessonId,
          lessonNumber: item.lessonNumber,
          lessonTitle: item.lessonTitle,
          courseId: item.courseId,
          words: []
        });
      }
      courseEntry.lessons.get(item.lessonId).words.push(item);
    });
    return Array.from(map.values()).map(c => ({
      ...c,
      lessons: Array.from(c.lessons.values()).sort((a, b) => a.lessonNumber - b.lessonNumber)
    }));
  }, [allVocabItems]);

  return (
    <section className="access-section">
      <h2 className="access-section-title">Слова у Vocabulary Bank</h2>
      <p className="access-section-sub">
        Автоматично: учень бачить слова з <strong>завершених</strong> уроків. Тут ти можеш <strong>вручну</strong> відкрити доступ до окремих слів з ще не завершених уроків (наприклад, для попереднього ознайомлення).
      </p>

      {structure.map(course => {
        const isCourseOpen = expandedCourse === course.courseId;
        const totalWords = course.lessons.reduce((s, l) => s + l.words.length, 0);
        const manualCount = course.lessons.reduce((s, l) => s + l.words.filter(w => vocabAccess.has(w.wordId)).length, 0);
        const allWordsInCourseGranted = manualCount === totalWords && totalWords > 0;
        return (
          <div key={course.courseId} className="access-course-block">
            <div className="access-course-head" style={{ cursor: 'pointer' }} onClick={() => setExpandedCourse(isCourseOpen ? null : course.courseId)}>
              <div className="access-course-name">{course.courseTitle}</div>
              <div className="access-course-meta">
                {totalWords} слів{manualCount > 0 ? ` · +${manualCount} відкрито вручну` : ''}
              </div>
              {totalWords > 0 && (
                <button
                  className={`vocab-bulk-btn ${allWordsInCourseGranted ? 'revoke' : 'grant'}`}
                  onClick={e => {
                    e.stopPropagation();
                    if (allWordsInCourseGranted) revokeAllVocabInCourse(course);
                    else grantAllVocabInCourse(course);
                  }}
                  title={allWordsInCourseGranted ? 'Закрити всі слова курсу' : 'Відкрити всі слова курсу'}
                >
                  {allWordsInCourseGranted
                    ? <React.Fragment><Lock size={11} /> Закрити всі</React.Fragment>
                    : <React.Fragment><Unlock size={11} /> Відкрити всі</React.Fragment>}
                </button>
              )}
              <ChevronRight size={16} style={{ color: 'var(--ink-3)', transform: isCourseOpen ? 'rotate(90deg)' : 'none', transition: 'transform 0.2s' }} />
            </div>
            {isCourseOpen && (
              <div className="access-lessons">
                {course.lessons.map(lesson => {
                  const isLessonCompleted = completions.has(`${lesson.courseId}:${lesson.lessonId}`);
                  const isLessonOpen = expandedLesson === `${lesson.courseId}:${lesson.lessonId}`;
                  const wordsWithAccess = lesson.words.filter(w => vocabAccess.has(w.wordId)).length;
                  const allWordsInLessonManuallyGranted = wordsWithAccess === lesson.words.length && lesson.words.length > 0;
                  return (
                    <div key={lesson.lessonId} style={{ padding: '8px 0', borderBottom: '1px dashed color-mix(in srgb, var(--line) 60%, transparent)' }}>
                      <div

// Форматуємо час у стилі "5 хв тому", "2 год тому", "3 дні тому"
function formatRelativeTime(dateStr) {
  if (!dateStr) return '';
  const date = new Date(dateStr);
  const now = new Date();
  const diffMs = now - date;
  const diffMin = Math.round(diffMs / 60000);
  const diffHr = Math.round(diffMs / 3600000);
  const diffDay = Math.round(diffMs / 86400000);

  if (diffMin < 1) return 'щойно';
  if (diffMin < 60) return `${diffMin} хв тому`;
  if (diffHr < 24) return `${diffHr} год тому`;
  if (diffDay === 1) return 'вчора';
  if (diffDay < 7) return `${diffDay} дні тому`;
  if (diffDay < 30) return `${Math.round(diffDay / 7)} тижн. тому`;
  if (diffDay < 365) return `${Math.round(diffDay / 30)} міс. тому`;
  return date.toLocaleDateString('uk-UA');
}

function CreateStudentModal({ session, onClose, onCreated }) {
  const [displayName, setDisplayName] = useState('');
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [teacherPassword, setTeacherPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const needsTeacherPassword = !window.__inkwell_teacher_pw;

  async function handleCreate() {
    setError('');
    if (!displayName.trim() || !username.trim() || !password) {
      setError('Заповни всі поля');
      return;
    }
    if (password.length < 6) {
      setError('Пароль має бути не менше 6 символів');
      return;
    }
    if (needsTeacherPassword && !teacherPassword) {
      setError('Введи свій пароль вчителя для підтвердження');
      return;
    }
    // Зберігаємо пароль вчителя в пам'яті сесії (не в localStorage!)
    const teacherPw = needsTeacherPassword ? teacherPassword : window.__inkwell_teacher_pw;

    setLoading(true);
    try {
      const cleanUsername = username.trim().toLowerCase();
      const studentEmail = cleanUsername + '@inkwell.local';

      // 1. Створюємо учня через signUp (цей виклик автоматично залогінить учня)
      const { data: signUpData, error: signUpError } = await window.SB.auth.signUp({
        email: studentEmail,
        password: password,
      });
      if (signUpError) {
        if (signUpError.message.toLowerCase().includes('already') || signUpError.message.toLowerCase().includes('registered')) {
          setError('Учень з таким іменем вже існує');
        } else {
          setError('Помилка створення: ' + signUpError.message);
        }
        setLoading(false);
        return;
      }
      const studentUserId = signUpData.user.id;

      // 2. Одразу перелогінюємось назад як teacher
      const teacherEmail = session.profile.username + '@inkwell.local';
      const { error: reloginError } = await window.SB.auth.signInWithPassword({
        email: teacherEmail,
        password: teacherPw,
      });
      if (reloginError) {
        setError('Не вдалося повернутись до акаунта вчителя. Перевір свій пароль. ' + reloginError.message);
        setLoading(false);
        return;
      }

      // 3. Створюємо профіль учня (тепер від імені teacher)
      const { error: profileError } = await window.SB.from('profiles').insert({
        id: studentUserId,
        username: cleanUsername,
        display_name: displayName.trim(),
        role: 'student'
      });
      if (profileError) {
        setError('Учня створено в auth, але не вдалося створити профіль: ' + profileError.message);
        setLoading(false);
        return;
      }

      // Успіх! Запам'ятовуємо пароль вчителя на час сесії
      window.__inkwell_teacher_pw = teacherPw;
      onCreated({
        id: studentUserId,
        username: cleanUsername,
        display_name: displayName.trim(),
        role: 'student',
        created_at: new Date().toISOString()
      });
    } catch (err) {
      setError('Помилка: ' + err.message);
      setLoading(false);
    }
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose} aria-label="Закрити"><X size={18} /></button>
        <h2 className="modal-title">Новий учень</h2>
        <p className="modal-sub">Створи акаунт для учня. Він зможе увійти зі своїм ім'ям і паролем, які ти тут вкажеш.</p>
        {error && <div className="modal-error">{error}</div>}
        <div className="modal-field">
          <label className="modal-label">Ім'я учня (для показу)</label>
          <input className="modal-input" type="text" value={displayName} onChange={e => setDisplayName(e.target.value)} placeholder="наприклад, Софія" disabled={loading} autoFocus />
        </div>
        <div className="modal-field">
          <label className="modal-label">Ім'я користувача (для входу)</label>
          <input className="modal-input" type="text" value={username} onChange={e => setUsername(e.target.value)} placeholder="наприклад, sofia" disabled={loading} />
        </div>
        <div className="modal-field">
          <label className="modal-label">Пароль учня</label>
          <input className="modal-input" type="text" value={password} onChange={e => setPassword(e.target.value)} placeholder="мінімум 6 символів" disabled={loading} />
        </div>
        {needsTeacherPassword && (
          <div className="modal-field" style={{ marginTop: 20, paddingTop: 16, borderTop: '1px dashed var(--line)' }}>
            <label className="modal-label">Твій пароль (для підтвердження)</label>
            <input className="modal-input" type="password" value={teacherPassword} onChange={e => setTeacherPassword(e.target.value)} placeholder="пароль вчителя" disabled={loading} />
            <div style={{ fontSize: 12, color: 'var(--ink-3)', marginTop: 6, fontStyle: 'italic' }}>Потрібно лише при першому створенні учня — після цього не запитаю до перезавантаження сторінки.</div>
          </div>
        )}
        <div className="modal-actions">
          <button className="modal-btn ghost" onClick={onClose} disabled={loading}>Скасувати</button>
          <button className="modal-btn primary" onClick={handleCreate} disabled={loading}>
            {loading ? 'Створюю...' : 'Створити'}
          </button>
        </div>
      </div>
    </div>
  );
}

// INKWELL 2.0 · ФАЗА 3 — «Учні» та профіль учня (вчитель)
// ═══════════════════════════════════════════════════════════

// ── Єдині правила підрахунку прогресу (ті самі, що на головній учня) ──
// • Урок «видимий», якщо є lesson_access АБО lesson_completions.
// • Відсоток курсу = завершені / видимі (як у StudentDashboard).
// • Юніт завершено, коли завершені ВСІ його уроки.
// • Поточний юніт — перший, де є відкритий, але не завершений урок;
//   якщо такого нема — перший незавершений юніт.
function buildCourseProgress(course, lessonAccess, completions, completionDates) {
  let total = 0, visible = 0, completed = 0, unitsDone = 0;
  const units = course.units.map(unit => {
    let uTotal = 0, uVisible = 0, uDone = 0;
    const lessons = unit.lessons.map(lesson => {
      const key = `${course.id}:${lesson.id}`;
      const isDone = completions.has(key);
      const isOpen = isDone || lessonAccess.has(key);
      uTotal++; if (isOpen) uVisible++; if (isDone) uDone++;
      return { lesson, key, status: isDone ? 'completed' : isOpen ? 'available' : 'locked', completedAt: completionDates ? completionDates.get(key) : null };
    });
    total += uTotal; visible += uVisible; completed += uDone;
    const isComplete = uTotal > 0 && uDone === uTotal;
    if (isComplete) unitsDone++;
    return { unit, lessons, total: uTotal, visible: uVisible, completed: uDone, isComplete };
  });
  let current = units.find(u => u.lessons.some(l => l.status === 'available'));
  if (!current) current = units.find(u => !u.isComplete) || null;
  units.forEach(u => {
    u.state = u.isComplete ? 'completed' : u === current ? 'current' : u.visible > 0 ? 'available' : 'locked';
  });
  return {
    course, units, total, visible, completed, unitsDone,
    unitsTotal: units.length,
    percent: visible > 0 ? Math.round((completed / visible) * 100) : 0,
    currentUnit: current ? current.unit : null,
  };
}

function maxDate(...vals) {
  let best = null;
  vals.forEach(v => { if (v && (!best || new Date(v) > new Date(best))) best = v; });
  return best;
}
function daysSince(d) { return d ? (Date.now() - new Date(d).getTime()) / 86400000 : Infinity; }
function pluralUk(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
