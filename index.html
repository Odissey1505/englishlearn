function TeacherLessonPanel({ courseId, lessonId, lesson, course, session, nextLesson }) {
  const [expanded, setExpanded] = useState(false);
  const [students, setStudents] = useState([]);
  const [selectedStudentId, setSelectedStudentId] = useState('');
  const [state, setState] = useState({
    courseAccess: false,
    lessonAccess: false,
    completed: false,
    writing: null,
    speaking: null,
  });
  const [loading, setLoading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [message, setMessage] = useState('');

  // Тягнемо список учнів (тільки при відкритті)
  useEffect(() => {
    if (!expanded || students.length > 0) return;
    async function load() {
      const { data } = await window.SB
        .from('profiles')
        .select('id, username, display_name')
        .eq('role', 'student')
        .order('display_name', { ascending: true });
      setStudents(data || []);
    }
    load();
  }, [expanded]);

  // При зміні обраного учня — тягнемо його стан для цього уроку
  useEffect(() => {
    if (!selectedStudentId) return;
    async function load() {
      setLoading(true);
      const [ca, la, lc, hw] = await Promise.all([
        window.SB.from('course_access').select('*').eq('student_id', selectedStudentId).eq('course_id', courseId).maybeSingle(),
        window.SB.from('lesson_access').select('*').eq('student_id', selectedStudentId).eq('course_id', courseId).eq('lesson_id', lessonId).maybeSingle(),
        window.SB.from('lesson_completions').select('*').eq('student_id', selectedStudentId).eq('course_id', courseId).eq('lesson_id', lessonId).maybeSingle(),
        window.SB.from('homework_submissions').select('*').eq('student_id', selectedStudentId).eq('course_id', courseId).eq('lesson_id', lessonId),
      ]);
      setState({
        courseAccess: !!ca.data,
        lessonAccess: !!la.data,
        completed: !!lc.data,
        writing: (hw.data || []).find(x => x.kind === 'writing') || null,
        speaking: (hw.data || []).find(x => x.kind === 'speaking') || null,
      });
      setLoading(false);
    }
    load();
  }, [selectedStudentId, courseId, lessonId]);

  async function markCompleted() {
    setSaving(true);
    setMessage('');
    // 1. Створюємо lesson_completion
    const { error: compError } = await window.SB.from('lesson_completions').insert({
      student_id: selectedStudentId,
      course_id: courseId,
      lesson_id: lessonId,
      completed_by: session.user.id
    });
    if (compError && !compError.message.includes('duplicate')) {
      setMessage('Помилка: ' + compError.message);
      setSaving(false);
      return;
    }
    // 2. Автоматично відкриваємо доступ до наступного уроку (якщо є)
    if (nextLesson) {
      const { error: accessError } = await window.SB.from('lesson_access').insert({
        student_id: selectedStudentId,
        course_id: courseId,
        lesson_id: nextLesson.id,
        granted_by: session.user.id
      });
      if (accessError && !accessError.message.includes('duplicate')) {
        setMessage('Урок завершено, але не вдалося відкрити наступний: ' + accessError.message);
        setSaving(false);
        return;
      }
    }
    setState(prev => ({ ...prev, completed: true }));
    setMessage(nextLesson ? `✓ Урок завершено. Наступний (L${nextLesson.number}) автоматично відкрито учню!` : '✓ Урок завершено. Це був останній урок курсу — вітаю з випуском!');
    setSaving(false);
  }

  async function unmarkCompleted() {
    setSaving(true);
    setMessage('');
    const { error } = await window.SB.from('lesson_completions')
      .delete()
      .eq('student_id', selectedStudentId)
      .eq('course_id', courseId)
      .eq('lesson_id', lessonId);
    if (error) {
      setMessage('Помилка: ' + error.message);
      setSaving(false);
      return;
    }
    setState(prev => ({ ...prev, completed: false }));
    setMessage('Позначку "завершено" знято. Наступний урок залишається відкритим (якщо був).');
    setSaving(false);
  }

  async function grantLessonAccess() {
    setSaving(true);
    setMessage('');
    const { error } = await window.SB.from('lesson_access').insert({
      student_id: selectedStudentId,
      course_id: courseId,
      lesson_id: lessonId,
      granted_by: session.user.id
    });
    if (error && !error.message.includes('duplicate')) {
      setMessage('Помилка: ' + error.message);
      setSaving(false);
      return;
    }
    setState(prev => ({ ...prev, lessonAccess: true }));
    setMessage('✓ Доступ до уроку відкрито');
    setSaving(false);
  }

  const selectedStudent = students.find(s => s.id === selectedStudentId);
  const canMarkComplete = selectedStudentId && state.courseAccess && (state.lessonAccess || state.completed);

  return (
    <div className={`teacher-lesson-panel ${expanded ? 'expanded' : ''}`}>
      <button className="teacher-panel-toggle" onClick={() => setExpanded(!expanded)}>
        <span className="teacher-panel-toggle-icon">👨‍🏫</span>
        <span className="teacher-panel-toggle-label">
          Панель вчителя {expanded ? '▾' : '▴'}
        </span>
      </button>

      {expanded && (
        <div className="teacher-panel-body">
          <div className="teacher-panel-title">Керування уроком для учня</div>

          <div className="teacher-panel-field">
            <label className="teacher-panel-label">Оберіть учня</label>
            <select
              className="teacher-panel-select"
              value={selectedStudentId}
              onChange={e => { setSelectedStudentId(e.target.value); setMessage(''); }}
            >
              <option value="">— оберіть учня —</option>
              {students.map(s => (
                <option key={s.id} value={s.id}>{s.display_name || s.username}</option>
              ))}
            </select>
          </div>

          {selectedStudentId && loading && (
            <div style={{ color: 'var(--ink-3)', fontSize: 13, fontStyle: 'italic', padding: '10px 0' }}>Завантажую стан...</div>
          )}

          {selectedStudentId && !loading && (
            <React.Fragment>
              <div className="teacher-panel-status-grid">
                <div className={`teacher-panel-status-item ${state.courseAccess ? 'ok' : 'warn'}`}>
                  <div className="teacher-panel-status-label">Курс</div>
                  <div className="teacher-panel-status-value">{state.courseAccess ? '✓ Відкрито' : '✗ Немає доступу'}</div>
                </div>
                <div className={`teacher-panel-status-item ${state.completed ? 'ok' : state.lessonAccess ? 'info' : 'warn'}`}>
                  <div className="teacher-panel-status-label">Урок</div>
                  <div className="teacher-panel-status-value">
                    {state.completed ? '✓ Завершено' : state.lessonAccess ? '🔓 Відкрито' : '🔒 Закрито'}
                  </div>
                </div>
                <div className={`teacher-panel-status-item ${statusColor(state.writing?.status)}`}>
                  <div className="teacher-panel-status-label">Writing</div>
                  <div className="teacher-panel-status-value">{formatHwStatus(state.writing)}</div>
                </div>
                <div className={`teacher-panel-status-item ${statusColor(state.speaking?.status)}`}>
                  <div className="teacher-panel-status-label">Speaking</div>
                  <div className="teacher-panel-status-value">{formatHwStatus(state.speaking)}</div>
                </div>
              </div>

              {!state.courseAccess && (
                <div className="teacher-panel-hint warn">
                  ⚠️ Учень не має доступу до цього курсу. Спершу відкрий йому доступ у розділі «Учні».
                </div>
              )}

              {state.courseAccess && !state.lessonAccess && !state.completed && (
                <button
                  className="teacher-panel-btn ghost"
                  onClick={grantLessonAccess}
                  disabled={saving}
                >
                  🔓 Спершу відкрити доступ до уроку
                </button>
              )}

              {canMarkComplete && !state.completed && (
                <button
                  className="teacher-panel-btn primary"
                  onClick={markCompleted}
                  disabled={saving}
                >
                  {saving ? 'Зберігаю...' : nextLesson
                    ? `✓ Завершити урок і відкрити L${nextLesson.number}`
                    : '✓ Завершити урок (це останній)'}
                </button>
              )}

              {state.completed && (
                <button
                  className="teacher-panel-btn danger-outline"
                  onClick={unmarkCompleted}
                  disabled={saving}
                >
                  ↩ Скасувати позначку "завершено"
                </button>
              )}

              {message && (
                <div className={`teacher-panel-message ${message.startsWith('✓') ? 'ok' : message.startsWith('Помилка') ? 'error' : 'info'}`}>
                  {message}
                </div>
              )}
            </React.Fragment>
          )}
        </div>
      )}
    </div>
  );
}

// Видалення домашки: спочатку файл зі Storage (якщо speaking), потім рядок з БД
// ═══════════════════════════════════════════════════════════
// SPACED REPETITION (SM-2 lite)
// ═══════════════════════════════════════════════════════════

// Розраховуємо новий стан картки після оцінювання
// current: { ease_factor, interval_days, repetitions } (або undefined для нової)
// grade: 0 (не знаю) | 3 (складно) | 4 (добре) | 5 (легко)
function computeNextReview(current, grade) {
  const now = new Date();
  let ease = current?.ease_factor ?? 2.5;
  let interval = current?.interval_days ?? 0;
  let repetitions = current?.repetitions ?? 0;

  if (grade === 0) {
    // Не знаю — обнуляємо repetitions, показуємо завтра
    repetitions = 0;
    interval = 1;
    ease = Math.max(1.3, ease - 0.2);
  } else {
    // Знаю (3, 4, 5)
    if (repetitions === 0) {
      interval = 1;
    } else if (repetitions === 1) {
      interval = 6;
    } else {
      interval = Math.round(interval * ease);
    }
    repetitions++;

    if (grade === 3) ease = Math.max(1.3, ease - 0.15);
    else if (grade === 5) ease = ease + 0.10;
    // grade === 4: без змін
  }

  const nextReview = new Date(now);
  nextReview.setDate(nextReview.getDate() + interval);

  return {
    ease_factor: parseFloat(ease.toFixed(2)),
    interval_days: interval,
    repetitions,
    last_grade: grade,
    last_reviewed_at: now.toISOString(),
    next_review_at: nextReview.toISOString(),
  };
}

// Форматуємо інтервал для показу («завтра», «через 3 дні», «через 2 місяці»)
function formatInterval(days) {
  if (days === 0) return 'сьогодні';
  if (days === 1) return 'завтра';
  if (days < 7) return `через ${days} дн.`;
  if (days < 30) return `через ${Math.round(days / 7)} тижн.`;
  if (days < 365) return `через ${Math.round(days / 30)} міс.`;
  return `через ${Math.round(days / 365)} р.`;
}

async function deleteHomeworkSubmission(submission) {
  // Якщо це speaking — прибираємо аудіо-файл
  if (submission.kind === 'speaking' && submission.content_audio_url) {
    const { error: storageError } = await window.SB.storage
      .from('homework-audio')
      .remove([submission.content_audio_url]);
    if (storageError) {
      console.warn('Не вдалося видалити аудіо-файл:', storageError.message);
      // Не зупиняємось — все одно видаляємо запис із БД
    }
  }
  const { error } = await window.SB
    .from('homework_submissions')
    .delete()
    .eq('id', submission.id);
  return { error };
}

// Utility функції для статусу домашки
function statusColor(status) {
  if (status === 'accepted') return 'ok';
  if (status === 'submitted') return 'info';
  if (status === 'returned') return 'warn';
  return '';
}

function formatHwStatus(hw) {
  if (!hw) return '— не здано';
  if (hw.status === 'submitted') return '🟡 На перевірці';
  if (hw.status === 'accepted') return '🟢 Прийнято';
  if (hw.status === 'returned') return '🔴 Повернуто';
  return hw.status;
}

// ═══════════════════════════════════════════════════════════
// FLASHCARDS PAGE
// ═══════════════════════════════════════════════════════════

function FlashcardsPage({ session, mode, courseId, lessonId, unitId, wordIds, limit, canSeeVocabWord, goHome, setRoute }) {
  // mode: 'lesson' (тренуємо всі слова з певного уроку) | 'due' (усі слова на повторення сьогодні)
  const allItems = useMemo(() => getAllVocabItems(), []);
  const [cards, setCards] = useState([]);         // масив карток для тренування
  const [currentIndex, setCurrentIndex] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [progressMap, setProgressMap] = useState(new Map()); // wordId → row з vocab_progress
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [stats, setStats] = useState({ notKnown: 0, hard: 0, good: 0, easy: 0 });
  const [saving, setSaving] = useState(false);
  const swipeRef = useRef({ x: null, moved: false });

  useEffect(() => {
    async function load() {
      setLoading(true);
      // 1. Тягнемо весь vocab_progress учня
      const { data: progressRows, error: progError } = await window.SB
        .from('vocab_progress')
        .select('*')
        .eq('student_id', session.user.id);
      if (progError) {
        setError('Не вдалося завантажити прогрес: ' + progError.message);
        setLoading(false);
        return;
      }
      const pMap = new Map();
      (progressRows || []).forEach(p => pMap.set(p.word_id, p));
      setProgressMap(pMap);

      // 2. Відбираємо картки залежно від режиму
      let selectedCards = [];
      const now = new Date();
      if (mode === 'lesson' && courseId && lessonId) {
        // Тренуємо всі слова з цього уроку (без фільтру за терміном)
        selectedCards = allItems.filter(w =>
          w.courseId === courseId && w.lessonId === lessonId && canSeeVocabWord(w)
        );
      } else if (mode === 'unit' && courseId && unitId) {
        // Тренуємо всі слова з цілого юніта
        selectedCards = allItems.filter(w =>
          w.courseId === courseId && w.unitId === unitId && canSeeVocabWord(w)
        );
      } else if (mode === 'course' && courseId) {
        // Тренуємо всі слова з цілого курсу
        selectedCards = allItems.filter(w =>
          w.courseId === courseId && canSeeVocabWord(w)
        );
      } else if (mode === 'due') {
        // Тренуємо лише ті, що вже готові до повторення
        const dueWordIds = new Set(
          (progressRows || [])
            .filter(p => new Date(p.next_review_at) <= now)
            .map(p => p.word_id)
        );
        // + всі, які ніколи ще не бачив — теж потрапляють у "нові на сьогодні"
        selectedCards = allItems.filter(w => {
          if (!canSeeVocabWord(w)) return false;
          return dueWordIds.has(w.wordId) || !pMap.has(w.wordId);
        });
        // Обмежуємо: максимум 20 карток за сесію, щоб не перевантажити
        // (учень може обрати менше: 5 або 10)
        selectedCards = selectedCards.slice(0, Math.min(Number(limit) || 20, 20));
      } else if ((mode === 'favorites' || mode === 'collection') && Array.isArray(wordIds)) {
        // Обране або власна колекція — лише слова, доступні учню
        const set = new Set(wordIds);
        selectedCards = allItems.filter(w => set.has(w.wordId) && canSeeVocabWord(w));
      }

      // Перемішуємо
      selectedCards = shuffle(selectedCards);
      setCards(selectedCards);
      setCurrentIndex(0);
      setFlipped(false);
      setLoading(false);
    }
    load();
  }, [mode, courseId, lessonId, unitId, limit, (wordIds || []).join(','), session.user.id]);

  // Клавіатура: пробіл — перевернути; 1/2/3/4 — оцінити
  useEffect(() => {
    function handleKey(e) {
      if (!cards.length || currentIndex >= cards.length) return;
      if (e.key === ' ' || e.key === 'Enter') {
        if (e.target && e.target.closest && e.target.closest('button, a, input, textarea, select')) return;
        e.preventDefault();
        setFlipped(f => !f);
      } else if (flipped) {
        if (e.key === '1') gradeCard(0);
        else if (e.key === '2') gradeCard(3);
        else if (e.key === '3') gradeCard(4);
        else if (e.key === '4') gradeCard(5);
      }
    }
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [cards, currentIndex, flipped]);

  async function gradeCard(grade) {
    if (saving) return;
    setSaving(true);
    const card = cards[currentIndex];
    const existing = progressMap.get(card.wordId);
    const next = computeNextReview(existing, grade);

    // Upsert у vocab_progress
    const payload = {
      student_id: session.user.id,
      word_id: card.wordId,
      ...next,
    };
    const { error } = await window.SB
      .from('vocab_progress')
      .upsert(payload, { onConflict: 'student_id,word_id' });

    if (error) {
      toast('Помилка збереження: ' + error.message, 'error');
      setSaving(false);
      return;
    }

    // Оновлюємо локальну мапу
    const newMap = new Map(progressMap);
    newMap.set(card.wordId, { ...(existing || {}), ...payload });
    setProgressMap(newMap);

    // Рахуємо статистику
    setStats(prev => ({
      notKnown: prev.notKnown + (grade === 0 ? 1 : 0),
      hard: prev.hard + (grade === 3 ? 1 : 0),
      good: prev.good + (grade === 4 ? 1 : 0),
      easy: prev.easy + (grade === 5 ? 1 : 0),
    }));

    // Переходимо на наступну картку
    setFlipped(false);
    setCurrentIndex(prev => prev + 1);
    setSaving(false);
  }

  const finished = !loading && cards.length > 0 && currentIndex >= cards.length;
  const empty = !loading && cards.length === 0;
  const current = cards[currentIndex];

  return (
    <main className="page flashcards-page">
      <Crumbs items={[
        { label: 'Library', onClick: goHome },
        { label: 'Vocabulary Bank', onClick: () => setRoute({ page: 'vocabulary' }) },
        { label: 'Тренування', current: true }
      ]} />

      {loading && <div className="empty-inline">Завантажую картки...</div>}
      {error && <div className="modal-error">{error}</div>}

      {empty && (
        <div className="empty-inline" style={{ marginTop: 40 }}>
          <div className="empty-inline-title" style={{ fontSize: 22 }}>
            {mode === 'due' ? '🎉 На сьогодні все повторено!' : mode === 'favorites' || mode === 'collection' ? 'У цьому наборі поки немає слів' : 'Немає слів для тренування'}
          </div>
          <div style={{ marginTop: 10 }}>
            {mode === 'due'
              ? 'Приходь завтра — з’являться нові картки для повторення.'
              : 'Спробуй інший урок або зачекай, поки відкриється більше слів.'}
          </div>
          <button className="fc-back-btn" onClick={() => setRoute({ page: 'vocabulary' })} style={{ marginTop: 20 }}>
            ← Повернутись до Vocabulary Bank
          </button>
        </div>
      )}

      {!loading && cards.length > 0 && !finished && (
        <React.Fragment>
          <div className="fc-progress-bar">
            <div className="fc-progress-fill" style={{ width: `${((currentIndex) / cards.length) * 100}%` }} />
          </div>
          <div className="fc-progress-text">
            <span>{currentIndex} / {cards.length}</span>
            <span className="fc-hint-kb">
              {flipped ? 'Оцініть себе: 1 · 2 · 3 · 4' : 'Пробіл або клік — перевернути картку'}
            </span>
          </div>

          <div className={`flashcard ${flipped ? 'flipped' : ''}`} onClick={() => { if (!swipeRef.current.moved) setFlipped(f => !f); }}
            role="button" tabIndex={0} aria-label={flipped ? `${current.uk}. Натисни, щоб перевернути назад` : `${current.en}. Натисни, щоб побачити переклад`}
            onPointerDown={(e) => { swipeRef.current = { x: e.clientX, y: e.clientY, moved: false }; }}
            onPointerUp={(e) => {
              const s0 = swipeRef.current; if (s0.x == null) return;
              const dx = e.clientX - s0.x, dy = e.clientY - s0.y;
              swipeRef.current = { x: null, moved: Math.abs(dx) > 12 };
              // Свайп працює лише після перевертання: вліво — «Не знаю», вправо — «Добре»
              if (flipped && Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 1.5) gradeCard(dx > 0 ? 4 : 0);
            }}>
            <div className="flashcard-inner">
              {/* FRONT */}
              <div className={`flashcard-face flashcard-front accent-${current.accent || 'sage'}`}>
                <span className="fc-speak"><SpeakButton text={current.en} size={18} /></span>
                <div className="flashcard-emoji">{current.emoji}</div>
                <div className="flashcard-word">{current.en}</div>
                <div className="flashcard-hint">натисни, щоб побачити переклад</div>
              </div>
              {/* BACK */}
              <div className={`flashcard-face flashcard-back accent-${current.accent || 'sage'}`}>
                <div className="flashcard-uk">{current.uk}</div>
                {current.explain && <div className="flashcard-explain">{current.explain}</div>}
                <div className="flashcard-en-small">{current.en}</div>
              </div>
            </div>
          </div>

          {flipped && <div className="fc-swipe-hint">Свайп вліво — «Не знаю», вправо — «Добре»</div>}
          {flipped && (
            <div className="fc-grade-buttons">
              <button className="fc-grade fc-grade-notknown" onClick={() => gradeCard(0)} disabled={saving}>
                <div className="fc-grade-emoji">😅</div>
                <div className="fc-grade-label">Не знаю</div>
                <div className="fc-grade-interval">{formatInterval(1)}</div>
                <div className="fc-grade-key">1</div>
              </button>
              <button className="fc-grade fc-grade-hard" onClick={() => gradeCard(3)} disabled={saving}>
                <div className="fc-grade-emoji">🤔</div>
                <div className="fc-grade-label">Складно</div>
                <div className="fc-grade-interval">{formatInterval(computeNextReview(progressMap.get(current.wordId), 3).interval_days)}</div>
                <div className="fc-grade-key">2</div>
              </button>
              <button className="fc-grade fc-grade-good" onClick={() => gradeCard(4)} disabled={saving}>
                <div className="fc-grade-emoji">🙂</div>
                <div className="fc-grade-label">Добре</div>
                <div className="fc-grade-interval">{formatInterval(computeNextReview(progressMap.get(current.wordId), 4).interval_days)}</div>
                <div className="fc-grade-key">3</div>
              </button>
              <button className="fc-grade fc-grade-easy" onClick={() => gradeCard(5)} disabled={saving}>
                <div className="fc-grade-emoji">😎</div>
                <div className="fc-grade-label">Легко</div>
                <div className="fc-grade-interval">{formatInterval(computeNextReview(progressMap.get(current.wordId), 5).interval_days)}</div>
                <div className="fc-grade-key">4</div>
              </button>
            </div>
          )}
        </React.Fragment>
      )}

      {finished && (
        <div className="fc-finished">
          <div className="fc-finished-emoji">🎉</div>
          <h2 className="fc-finished-title">Молодець!</h2>
          <p className="fc-finished-sub">Ти пройшов {cards.length} {cards.length === 1 ? 'картку' : cards.length < 5 ? 'картки' : 'карток'} у цій сесії.</p>
          <div className="fc-stats">
            <div className="fc-stat fc-stat-notknown">
              <div className="fc-stat-num">{stats.notKnown}</div>
              <div className="fc-stat-label">😅 Не знаю</div>
            </div>
            <div className="fc-stat fc-stat-hard">
              <div className="fc-stat-num">{stats.hard}</div>
              <div className="fc-stat-label">🤔 Складно</div>
            </div>
            <div className="fc-stat fc-stat-good">
              <div className="fc-stat-num">{stats.good}</div>
              <div className="fc-stat-label">🙂 Добре</div>
            </div>
            <div className="fc-stat fc-stat-easy">
              <div className="fc-stat-num">{stats.easy}</div>
              <div className="fc-stat-label">😎 Легко</div>
            </div>
          </div>
          <div className="fc-finished-actions">
            <button className="fc-back-btn" onClick={() => setRoute({ page: 'vocabulary' })}>
              ← До Vocabulary Bank
            </button>
            <button className="fc-again-btn" onClick={() => {
              setStats({ notKnown: 0, hard: 0, good: 0, easy: 0 });
              setCurrentIndex(0);
              setCards(shuffle(cards));
            }}>
              🔄 Пройти ще раз
            </button>
          </div>
        </div>
      )}
    </main>
  );
}

function getGreeting() {
  const hour = new Date().getHours();
  if (hour >= 5 && hour < 12) return { text: 'Доброго ранку', emoji: '☀️' };
  if (hour >= 12 && hour < 18) return { text: 'Добрий день', emoji: '👋' };
  if (hour >= 18 && hour < 23) return { text: 'Добрий вечір', emoji: '🌆' };
  return { text: 'Доброї ночі', emoji: '🌙' };
}

// Оновлюємо streak на основі last_visit_date
async function updateStreak(profile) {
  const today = new Date();
  const todayStr = today.toISOString().split('T')[0]; // YYYY-MM-DD

  // Якщо сьогодні вже заходив — нічого не робимо
  if (profile.last_visit_date === todayStr) {
    return { current_streak: profile.current_streak, longest_streak: profile.longest_streak };
  }

  // Рахуємо різницю з попереднім візитом
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayStr = yesterday.toISOString().split('T')[0];

  let newStreak;
  if (profile.last_visit_date === yesterdayStr) {
    // Заходив вчора — інкрементуємо
    newStreak = (profile.current_streak || 0) + 1;
  } else if (!profile.last_visit_date) {
    // Перший вхід — стартовий streak
    newStreak = 1;
  } else {
    // Був перерив — почати з 1
    newStreak = 1;
  }

  const newLongest = Math.max(newStreak, profile.longest_streak || 0);

  const { error } = await window.SB.from('profiles').update({
    last_visit_date: todayStr,
    current_streak: newStreak,
    longest_streak: newLongest,
  }).eq('id', profile.id);

  if (error) {
    console.warn('Не вдалося оновити streak:', error);
    return { current_streak: profile.current_streak || 0, longest_streak: profile.longest_streak || 0 };
  }

  return { current_streak: newStreak, longest_streak: newLongest };
}

// ═══════════════════════════════════════════════════════════
// INKWELL 2.0 · ФАЗА 4 — Головна учня
// ═══════════════════════════════════════════════════════════
// Правила (див. також buildCourseProgress):
// • Серія днів (streak) — наявне правило: щоденний вхід на головну
//   (updateStreak, profiles.current_streak / longest_streak).
// • Календар показує ДВА різні сигнали: «заходив» (виводиться з
//   поточної серії) і «навчався» (реальні події: завершений урок,
//   здана домашка, повторення слів у флешкартках).
// • «Продовжити» — перший відкритий учителем і ще не завершений урок.
//   Учень ніколи не відкриває уроки сам.

const STREAK_MILESTONES = [3, 5, 7, 10, 14, 21, 30, 50, 75, 100];
const HOME_MOTTOS = [
  'Маленький крок щодня — і за місяць ти здивуєш себе.',
  'Нові слова — нові двері. Відчинимо ще одні?',
  'Помилки — це просто чернетки майбутніх успіхів.',
  'Кожен урок робить твою англійську трохи сміливішою.',
  'Почни з одного уроку — далі піде легше.',
  'Твоя бібліотека чекає. Яку сторінку гортаємо сьогодні?',
  'Сьогодні — гарний день, щоб вивчити щось нове.',
];

const Calendar = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></Icon>;
const Layers2 = (p) => <Icon {...p}><rect x="2" y="6" width="14" height="14" rx="2"/><path d="M6 2h14a2 2 0 0 1 2 2v14"/></Icon>;
const Play = (p) => <Icon {...p}><polygon points="6 3 20 12 6 21 6 3"/></Icon>;

function localDayKey(d) {
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
}

function StudentDashboard({ session, setRoute, permissions, canSeeCourse, canSeeLesson, isLessonCompleted, canSeeVocabWord }) {
  const [streak, setStreak] = useState({ current_streak: session.profile.current_streak || 0, longest_streak: session.profile.longest_streak || 0 });
  const [vocab, setVocab] = useState({ due: 0, fresh: 0, total: 0 });
  const [hw, setHw] = useState([]);
  const [completedRows, setCompletedRows] = useState([]);
  const [reviewDays, setReviewDays] = useState([]);
  const [loading, setLoading] = useState(true);
  const [celebrate, setCelebrate] = useState(null);

  const greeting = getGreeting();
  const displayName = session.profile.display_name || session.profile.username;
  const firstName = displayName.split(' ')[0];
  const motto = HOME_MOTTOS[Math.floor(Date.now() / 86400000) % HOME_MOTTOS.length];

  useEffect(() => {
    let alive = true;
    async function loadAll() {
      setLoading(true);
      // 1. Оновлюємо streak (наявне правило — щоденний вхід)
      const newStreak = await updateStreak(session.profile);
      if (!alive) return;
      setStreak(newStreak);
      const n = newStreak.current_streak || 0;
      if (STREAK_MILESTONES.includes(n)) {
        const key = `inkwell-streak-celebrated:${session.user.id}:${n}`;
        let seen = false;
        try { seen = localStorage.getItem(key) === localDayKey(Date.now()); } catch (e) {}
        try { if (!seen) localStorage.setItem(key, localDayKey(Date.now())); } catch (e) {}
        if (!seen) setCelebrate(n);
      }

      const safe = (p) => p.then(r => r.data || []).catch(() => []);
      const [vp, hws, lc] = await Promise.all([
        safe(window.SB.from('vocab_progress').select('word_id, next_review_at, last_reviewed_at').eq('student_id', session.user.id)),
        safe(window.SB.from('homework_submissions').select('course_id, lesson_id, kind, status, submitted_at').eq('student_id', session.user.id)),
        safe(window.SB.from('lesson_completions').select('course_id, lesson_id, completed_at').eq('student_id', session.user.id).order('completed_at', { ascending: false })),
      ]);
      if (!alive) return;

      // 2. Флешкартки — скільки на повторення / нових (як і раніше)
      const now = new Date();
      const seenIds = new Set(vp.map(r => r.word_id));
      const dueIds = new Set(vp.filter(r => r.next_review_at && new Date(r.next_review_at) <= now).map(r => r.word_id));
      const visibleVocab = getAllVocabItems().filter(w => canSeeVocabWord(w));
      setVocab({
        due: visibleVocab.filter(w => dueIds.has(w.wordId)).length,
        fresh: visibleVocab.filter(w => !seenIds.has(w.wordId)).length,
        total: visibleVocab.length,
      });
      setReviewDays(vp.map(r => r.last_reviewed_at).filter(Boolean));
      setHw(hws);
      setCompletedRows(lc);
      setLoading(false);
    }
    loadAll();
    return () => { alive = false; };
  }, [session.user.id]);

  // Курси учня з прогресом (ті самі правила, що й у вчителя)
  const myCourses = useMemo(() => {
    const dates = new Map(completedRows.map(r => [`${r.course_id}:${r.lesson_id}`, r.completed_at]));
    return COURSES.filter(c => canSeeCourse(c.id))
      .map(c => buildCourseProgress(c, permissions.lessonAccess, permissions.completions, dates));
  }, [permissions, completedRows]);

  // Відкриті вчителем і ще не завершені уроки
  const openLessons = useMemo(() => {
    const out = [];
    myCourses.forEach(p => p.units.forEach(u => u.lessons.forEach(l => {
      if (l.status !== 'available') return;
      const kinds = l.lesson.homework ? ['writing', 'speaking'].filter(k => l.lesson.homework[k]) : [];
      out.push({ course: p.course, unit: u.unit, lesson: l.lesson, hasHomework: kinds.length > 0 });
    })));
    return out;
  }, [myCourses]);
  const continueLesson = openLessons[0] || null;

  const hwStats = useMemo(() => ({
    pending: hw.filter(h => h.status === 'submitted').length,
    accepted: hw.filter(h => h.status === 'accepted').length,
    returned: hw.filter(h => h.status === 'returned').length,
  }), [hw]);

  // Завершені уроки, до яких ще не здано домашнє
  const homeworkTodo = useMemo(() => {
    const out = [];
    completedRows.forEach(r => {
      const f = findLesson(r.course_id, r.lesson_id);
      if (!f || !f.lesson.homework) return;
      const kinds = ['writing', 'speaking'].filter(k => f.lesson.homework[k]);
      const missing = kinds.filter(k => !hw.some(h => h.course_id === r.course_id && h.lesson_id === r.lesson_id && h.kind === k));
      if (missing.length) out.push({ ...f, missing });
    });
    return out;
  }, [completedRows, hw]);

  // Граматика з останнього завершеного уроку (для «Сьогодні»)
  const grammarReview = useMemo(() => {
    for (const r of completedRows) {
      const f = findLesson(r.course_id, r.lesson_id);
      const t = f && f.lesson.grammar && f.lesson.grammar.title;
      if (t && !/^grammar (presentation|revision)/i.test(t)) return { ...f, topic: t };
    }
    return null;
  }, [completedRows]);

  // Календар: останні 14 днів
  const calendar = useMemo(() => {
    const learned = new Set();
    completedRows.forEach(r => r.completed_at && learned.add(localDayKey(r.completed_at)));
    hw.forEach(h => h.submitted_at && learned.add(localDayKey(h.submitted_at)));
    reviewDays.forEach(d => learned.add(localDayKey(d)));
    const today = new Date(); today.setHours(12, 0, 0, 0);
    const visited = new Set();
    const n = streak.current_streak || 0;
    for (let i = 0; i < n && i < 14; i++) { const d = new Date(today); d.setDate(d.getDate() - i); visited.add(localDayKey(d)); }
    const days = [];
    for (let i = 13; i >= 0; i--) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      const k = localDayKey(d);
      days.push({ key: k, date: d, learned: learned.has(k), visited: visited.has(k), today: i === 0 });
    }
    return { days, learnedCount: days.filter(d => d.learned).length };
  }, [completedRows, hw, reviewDays, streak]);

  const goLesson = (courseId, lessonId) => setRoute({ page: 'lesson', courseId, lessonId });

  // «Сьогодні» — до чотирьох реальних пропозицій
  const today = useMemo(() => {
    const items = [];
    if (continueLesson) items.push({ id: 'lesson', icon: Play, tone: 'terracotta', title: `Урок ${continueLesson.lesson.number}: ${continueLesson.lesson.title}`, sub: continueLesson.lesson.titleUk || continueLesson.course.title, cta: 'Почати', go: () => goLesson(continueLesson.course.id, continueLesson.lesson.id) });
    if (hwStats.returned > 0) items.push({ id: 'returned', icon: RefreshCw, tone: 'error', title: `Виправ домашнє (${hwStats.returned})`, sub: 'Вчитель повернув роботу з коментарем', cta: 'Відкрити', go: () => setRoute({ page: 'my-homework' }) });
    if (vocab.due > 0) items.push({ id: 'due', icon: Layers2, tone: 'plum', title: `Повтори ${vocab.due} ${pluralUk(vocab.due, 'слово', 'слова', 'слів')}`, sub: 'Флешкартки на сьогодні', cta: 'Повторити', go: () => setRoute({ page: 'flashcards', mode: 'due' }) });
    else if (vocab.fresh > 0) items.push({ id: 'fresh', icon: Layers2, tone: 'plum', title: `Вивчи нові слова (${Math.min(vocab.fresh, 20)})`, sub: `${vocab.fresh} ${pluralUk(vocab.fresh, 'нове слово чекає', 'нові слова чекають', 'нових слів чекають')} у флешкартках`, cta: 'Вчити', go: () => setRoute({ page: 'flashcards', mode: 'due' }) });
    if (homeworkTodo.length > 0) {
      const h = homeworkTodo[0];
      items.push({ id: 'hw', icon: Pencil, tone: 'mustard', title: `Здай домашнє до уроку ${h.lesson.number}`, sub: `${h.lesson.title} · ${h.missing.map(k => (HW_KIND[k] || {}).label || k).join(', ').toLowerCase()}`, cta: 'До уроку', go: () => goLesson(h.course.id, h.lesson.id) });
    }
    if (grammarReview && items.length < 4) items.push({ id: 'grammar', icon: Brain, tone: 'sage', title: `Повтори: ${grammarReview.topic}`, sub: `Граматика з уроку ${grammarReview.lesson.number}`, cta: 'Повторити', go: () => goLesson(grammarReview.course.id, grammarReview.lesson.id) });
    // Учень ще нічого не проходив — пропонуємо те, що доступне завжди
    if (items.length === 0 && completedRows.length === 0) items.push({ id: 'explore', icon: Brain, tone: 'sky', title: 'Зазирни в таблицю часів', sub: `${TENSES.length} часів англійської з поясненнями і прикладами`, cta: 'Відкрити', go: () => setRoute({ page: 'grammar' }) });
    return items.slice(0, 4);
  }, [continueLesson, hwStats, vocab, homeworkTodo, grammarReview, completedRows]);

  const totalDone = myCourses.reduce((a, c) => a + c.completed, 0);
  const n = streak.current_streak || 0;

  return (
    <main className="student-dashboard iw-home">
      {/* 1. Привітання + серія */}
      <section className="iw-home-top">
        <div className="iw-welcome">
          <div className="iw-welcome-text">
            <div className="iw-welcome-eyebrow"><span aria-hidden="true">{greeting.emoji}</span> {greeting.text}</div>
            <h1 className="iw-welcome-name">{firstName}<span className="iw-welcome-dot">!</span></h1>
            <p className="iw-welcome-motto">{motto}</p>
            <div className="iw-welcome-actions">
              {continueLesson ? (
                <IwButton variant="primary" size="lg" iconRight={ArrowRight} onClick={() => goLesson(continueLesson.course.id, continueLesson.lesson.id)}>
                  Урок {continueLesson.lesson.number}: {continueLesson.lesson.title}
                </IwButton>
              ) : (
                <IwButton variant="secondary" size="lg" icon={Brain} onClick={() => setRoute({ page: 'grammar' })}>Grammar Bank</IwButton>
              )}
              {totalDone > 0 && <span className="iw-welcome-meta"><CheckCircle size={15} aria-hidden="true" /> {totalDone} {pluralUk(totalDone, 'урок пройдено', 'уроки пройдено', 'уроків пройдено')}</span>}
            </div>
          </div>
          <div className="iw-welcome-art">
            <Illustration name="desk" />
            <CompanionSpot context="home" state={new Date().getHours() >= 23 || new Date().getHours() < 6 ? 'sleep' : 'greet'} size={96}
              lines={[greetingLine(firstName),
                ...(continueLesson ? [`Lesson ${continueLesson.lesson.number} is waiting for you!`] : []),
                ...(vocab.due > 0 ? [`You have ${vocab.due} ${vocab.due === 1 ? 'word' : 'words'} to review today!`] : []),
                ...COMPANION_LINES.home]} />
          </div>
        </div>

        <aside className={cx('iw-streak', celebrate && 'is-celebrating')} aria-label="Серія днів">
          {celebrate && (
            <div className="iw-streak-celebrate" role="status">
              <span className="iw-confetti" aria-hidden="true">{Array.from({ length: 10 }).map((_, i) => <i key={i} />)}</span>
              🎉 {celebrate} {pluralUk(celebrate, 'день', 'дні', 'днів')} поспіль — так тримати!
              <button type="button" className="iw-streak-celebrate-x" onClick={() => setCelebrate(null)} aria-label="Закрити привітання"><X size={14} /></button>
            </div>
          )}
          <div className="iw-streak-head">
            <div className="iw-streak-flame" aria-hidden="true"><Flame size={26} /></div>
            <div>
              <div className="iw-streak-num">{n}</div>
              <div className="iw-streak-label">{pluralUk(n, 'день', 'дні', 'днів')} поспіль</div>
            </div>
            <div className="iw-streak-best">
              <span>Рекорд</span>
              <strong>{Math.max(streak.longest_streak || 0, n)}</strong>
            </div>
          </div>
          <div className="iw-cal" role="list" aria-label="Останні 14 днів">
            {calendar.days.map(d => (
              <span key={d.key} role="listitem" className={cx('iw-cal-day', d.learned && 'learned', d.visited && 'visited', d.today && 'today')}
                title={`${d.date.toLocaleDateString('uk-UA', { weekday: 'short', day: 'numeric', month: 'short' })}${d.learned ? ' — навчання' : d.visited ? ' — вхід' : ''}`}>
                <span className="iw-cal-wd">{d.date.toLocaleDateString('uk-UA', { weekday: 'narrow' })}</span>
                <span className="iw-cal-dot">{d.date.getDate()}</span>
                <span className="sr-only">{d.learned ? 'навчання' : d.visited ? 'вхід' : 'без активності'}</span>
              </span>
            ))}
          </div>
          <div className="iw-cal-legend">
            <span><i className="lg-learned" /> навчання</span>
            <span><i className="lg-visited" /> вхід</span>
            <span className="iw-cal-count">{calendar.learnedCount} з 14 днів</span>
          </div>
          <p className="iw-streak-rule">Серія зростає, коли ти заходиш сюди щодня.</p>
        </aside>
      </section>
      <CompanionInvite />

      {/* 2. Продовжити + Сьогодні */}
      <section className="iw-home-row">
        <div className="iw-home-col">
          <h2 className="iw-home-h">Продовжити навчання</h2>
          {loading && permissions.loading ? <Skeleton h={170} r={20} /> : continueLesson ? (
            <button type="button" className="iw-continue" onClick={() => goLesson(continueLesson.course.id, continueLesson.lesson.id)}>
              <span className="iw-continue-num" aria-hidden="true"><small>Урок</small>{continueLesson.lesson.number}</span>
              <span className="iw-continue-body">
                <span className="iw-kicker">{continueLesson.course.title} · Unit {continueLesson.unit.number}</span>
                <span className="iw-continue-title">{continueLesson.lesson.title}</span>
                {continueLesson.lesson.titleUk && <span className="iw-continue-sub">{continueLesson.lesson.titleUk}</span>}
                <span className="iw-continue-tags">
                  <StatusBadge status="available" label="Відкрито вчителем" />
                  <Badge>{continueLesson.lesson.type}</Badge>
                  {continueLesson.hasHomework && <Badge tone="info">Є домашнє</Badge>}
                </span>
              </span>
              <span className="iw-continue-cta" aria-hidden="true">Почати <ArrowRight size={18} /></span>
            </button>
          ) : (
            <EmptyState art="books"
              title={myCourses.length && myCourses.every(c => c.completed === c.total) ? 'Курс завершено — вітаємо!' : 'Нових уроків поки немає'}
              text={myCourses.length && myCourses.some(c => c.completed > 0) ? 'Усі відкриті уроки пройдено. Вчитель відкриє наступні — а поки можна повторити слова чи граматику.' : 'Твій вчитель відкриє уроки незабаром. Тим часом можна зазирнути в Grammar Bank.'}
              action={<IwButton size="sm" icon={Brain} onClick={() => setRoute({ page: 'grammar' })}>Grammar Bank</IwButton>} />
          )}
        </div>

        <div className="iw-home-col">
          <h2 className="iw-home-h">Сьогодні</h2>
          <div className="iw-card iw-today">
            {loading ? <React.Fragment><Skeleton h={44} /><Skeleton h={44} /><Skeleton h={44} /></React.Fragment> : today.length === 0 ? (
              <div className="iw-today-done">
                <div className="iw-today-done-art"><Illustration name="trophy" /></div>
                <div><strong>На сьогодні все зроблено!</strong><p>Можеш відпочити або зазирнути в Grammar Bank.</p></div>
              </div>
            ) : (
              <ul className="iw-today-list">
                {today.map(it => {
                  const I = it.icon;
                  return (
                    <li key={it.id}>
                      <button type="button" className={cx('iw-today-item', `tone-${it.tone}`)} onClick={it.go}>
                        <span className="iw-today-icon"><I size={17} aria-hidden="true" /></span>
                        <span className="iw-today-text"><strong>{it.title}</strong><span>{it.sub}</span></span>
                        <span className="iw-today-cta">{it.cta} <ChevronRight size={14} aria-hidden="true" /></span>
                      </button>
                    </li>
                  );
                })}
              </ul>
            )}
          </div>
        </div>
