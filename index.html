  primary key (student_id, topic_id)
);

alter table public.grammar_progress enable row level security;
drop policy if exists "grammar_progress: own rows" on public.grammar_progress;
create policy "grammar_progress: own rows" on public.grammar_progress
  for all to authenticated
  using (student_id = auth.uid())
  with check (student_id = auth.uid());
drop policy if exists "grammar_progress: teachers read" on public.grammar_progress;
create policy "grammar_progress: teachers read" on public.grammar_progress
  for select to authenticated
  using (exists (select 1 from public.profiles p where p.id = auth.uid() and p.role = 'teacher'));`;

function useGrammarProgress(session) {
  const uid = session.user.id;
  const localKey = `inkwell-grammar:${uid}`;
  const [rows, setRows] = useState(() => new Map());
  const [mode, setMode] = useState('loading'); // loading | db | local
  const rowsRef = useRef(rows);
  rowsRef.current = rows;

  const readLocal = () => { try { return new Map(Object.entries(JSON.parse(localStorage.getItem(localKey) || '{}'))); } catch (e) { return new Map(); } };
  const writeLocal = (m) => { try { localStorage.setItem(localKey, JSON.stringify(Object.fromEntries(m))); } catch (e) {} };

  useEffect(() => {
    let alive = true;
    window.SB.from('grammar_progress').select('*').eq('student_id', uid).then(({ data, error }) => {
      if (!alive) return;
      if (error) { setRows(readLocal()); setMode('local'); return; }
      const m = new Map((data || []).map(r => [r.topic_id, r]));
      // Перенести в акаунт те, що було збережено на пристрої до появи таблиці
      const local = readLocal();
      const toMove = [];
      local.forEach((r, id) => { if (!m.has(id)) { m.set(id, r); toMove.push({ ...r, student_id: uid, topic_id: id }); } });
      if (toMove.length) window.SB.from('grammar_progress').upsert(toMove, { onConflict: 'student_id,topic_id' }).then(({ error: e2 }) => { if (!e2) { try { localStorage.removeItem(localKey); } catch (e) {} } });
      setRows(m); setMode('db');
    }, () => { if (alive) { setRows(readLocal()); setMode('local'); } });
    return () => { alive = false; };
  }, [uid]);

  const patch = (changes) => {
    // changes: [{ topic_id, fn(row) => newRow }]
    const next = new Map(rowsRef.current);
    const now = new Date().toISOString();
    const payload = changes.map(({ topic_id, fn }) => {
      const prev = next.get(topic_id) || { topic_id, favorite: false, studied_count: 0, practice_attempts: 0, practice_correct: 0 };
      const row = { ...fn(prev), topic_id, updated_at: now };
      next.set(topic_id, row);
      return row;
    });
    setRows(next);
    if (mode === 'db') {
      window.SB.from('grammar_progress').upsert(payload.map(r => ({
        student_id: uid, topic_id: r.topic_id, favorite: !!r.favorite, studied_count: r.studied_count || 0,
        last_studied_at: r.last_studied_at || null, practice_attempts: r.practice_attempts || 0,
        practice_correct: r.practice_correct || 0, last_practiced_at: r.last_practiced_at || null, updated_at: r.updated_at,
      })), { onConflict: 'student_id,topic_id' }).then(({ error }) => { if (error) toast('Не вдалося зберегти прогрес: ' + error.message, 'error'); });
    } else {
      writeLocal(next);
    }
  };

  return {
    rows, mode,
    get: (id) => rows.get(id),
    toggleFavorite: (id) => patch([{ topic_id: id, fn: r => ({ ...r, favorite: !r.favorite }) }]),
    markStudied: (id) => patch([{ topic_id: id, fn: r => ({ ...r, studied_count: (r.studied_count || 0) + 1, last_studied_at: new Date().toISOString() }) }]),
    recordPractice: (results) => {
      const agg = new Map();
      results.forEach(({ topicId, correct }) => {
        const a = agg.get(topicId) || { n: 0, ok: 0 };
        a.n++; if (correct) a.ok++; agg.set(topicId, a);
      });
      patch(Array.from(agg.entries()).map(([id, a]) => ({ topic_id: id, fn: r => ({
        ...r, practice_attempts: (r.practice_attempts || 0) + a.n, practice_correct: (r.practice_correct || 0) + a.ok, last_practiced_at: new Date().toISOString(),
      }) })));
    },
  };
}

// ── Генерація вправ (лише з наявного контенту) ──
// shuffle() — наявна спільна функція (див. вище)
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

// Маркери, що належать лише одному часу (неоднозначні — відкидаємо)
const AMBIGUOUS_MARKERS = new Set(['today', 'this week', 'this week/month/year', 'soon', 'later']);
function uniqueMarkers() {
  const all = TENSES.map(t => ({ t, list: t.markers.split(/,\s*/).map(m => m.trim()).filter(Boolean) }));
  const owners = new Map();
  all.forEach(({ t, list }) => list.forEach(m => { const k = m.toLowerCase(); owners.set(k, (owners.get(k) || new Set()).add(t.id)); }));
  const out = [];
  all.forEach(({ t, list }) => list.forEach(m => {
    const k = m.toLowerCase();
    if (owners.get(k).size !== 1 || AMBIGUOUS_MARKERS.has(k) || /\[|\]/.test(m)) return;
    const clash = all.some(o => o.t.id !== t.id && o.list.some(x => { const y = x.toLowerCase(); return y.startsWith(k) || k.startsWith(y); }));
    if (!clash) out.push({ marker: m, tense: t });
  }));
  return out;
}

function distractorTenses(correct, n = 3) {
  const near = TENSES.filter(t => t.id !== correct.id && (t.group === correct.group || t.col === correct.col));
  const far = TENSES.filter(t => t.id !== correct.id && !near.includes(t));
  return shuffle(near).concat(shuffle(far)).slice(0, n);
}

function tokenize(sentence) { return sentence.split(/\s+/).filter(Boolean); }
function orderableSentence(s) { const n = tokenize(s).length; return n >= 4 && n <= 10 && !/[()—–;]/.test(s); }

function makeTenseQuestion(type, tense) {
  if (type === 'which') {
    const uses = (tense.uses || []).filter(u => u.examples && u.examples.length);
    if (!uses.length) return null;
    const use = pick(uses); const ex = pick(use.examples);
    const opts = shuffle([tense, ...distractorTenses(tense)]);
    return { type, topicId: tense.id, prompt: 'Який час у цьому реченні?', sentence: ex, options: opts.map(t => ({ id: t.id, label: t.name })), answer: tense.id,
      explain: `${tense.name} — ${use.case.toLowerCase()}. ${use.explain}` };
  }
  if (type === 'markers') {
    const pool = uniqueMarkers().filter(m => m.tense.id === tense.id);
    if (!pool.length) return null;
    const m = pick(pool);
    const opts = shuffle([tense, ...distractorTenses(tense)]);
    return { type, topicId: tense.id, prompt: `З яким часом найчастіше вживають маркер «${m.marker}»?`, options: opts.map(t => ({ id: t.id, label: t.name })), answer: tense.id,
      explain: `${tense.name}: ${tense.when}` };
  }
  if (type === 'formula') {
    const opts = shuffle([tense, ...distractorTenses(tense)]);
    return { type, topicId: tense.id, prompt: `Яка формула часу ${tense.name}?`, options: opts.map(t => ({ id: t.id, label: t.formula, mono: true })), answer: tense.id,
      explain: `${tense.name}: ${tense.formulaLong}. Наприклад: ${tense.positive}` };
  }
  if (type === 'order') {
    const sentences = (tense.uses || []).flatMap(u => u.examples).concat([tense.positive, tense.question]).filter(orderableSentence);
    if (!sentences.length) return null;
    const s = pick(sentences);
    return makeOrderQuestion(s, tense.id, `${tense.name}: ${tense.formulaLong}`);
  }
  return null;
}
function makeOrderQuestion(sentence, topicId, explain) {
  const tokens = tokenize(sentence);
  let shuffled = shuffle(tokens.map((w, i) => ({ w, i })));
  for (let k = 0; k < 5 && shuffled.every((x, i) => x.i === i); k++) shuffled = shuffle(shuffled);
  return { type: 'order', topicId, prompt: 'Склади речення з цих слів', tokens: shuffled, answer: tokens.join(' '), explain };
}

const PRACTICE_TYPES = [
  { id: 'mixed', label: 'Мікс' },
  { id: 'which', label: 'Який це час?' },
  { id: 'markers', label: 'Маркери часу' },
  { id: 'formula', label: 'Формули' },
  { id: 'order', label: 'Склади речення' },
];
function buildSession(scope, type, topics, count = 8) {
  // scope: 'all' | 'present' | 'past' | 'future' | <topicId>
  const lessonTopic = topics.find(t => t.id === scope && t.kind === 'lesson');
  if (lessonTopic) {
    const sentences = lessonTopic.grammar.blocks.flatMap(b => (b.examples || []).map(e => stripHtml(e.en))).filter(orderableSentence);
    return shuffle(sentences).slice(0, count).map(s => makeOrderQuestion(s, lessonTopic.id, `${lessonTopic.name} — урок ${lessonTopic.lesson.number}`));
  }
  const pool = scope === 'all' ? TENSES : ['present', 'past', 'future'].includes(scope) ? TENSES.filter(t => t.group === scope) : TENSES.filter(t => t.id === scope);
  const types = type === 'mixed' ? ['which', 'markers', 'formula', 'order'] : [type];
  const out = [];
  const seen = new Set();
  for (let guard = 0; out.length < count && guard < count * 25; guard++) {
    const q = makeTenseQuestion(pick(types), pick(pool));
    if (!q) continue;
    const key = q.type + (q.sentence || q.prompt || '') + (q.answer || '');
    if (seen.has(key)) continue;
    seen.add(key); out.push(q);
  }
  return out;
}
function lessonTopicPracticable(topic) {
  return topic.kind === 'lesson' && topic.grammar.blocks.some(b => (b.examples || []).some(e => orderableSentence(stripHtml(e.en))));
}

        <div className="iw-gtopic-main">

            <span className="iw-kicker">Формула</span>
            <div className={cx('iw-gformula-text', t.formulaLong.length > 32 && 'long')}>{t.formulaLong}</div>
            <p className="iw-gformula-when">{t.when}</p>
          </section>
          <section className="iw-gforms" aria-label="Ствердження, заперечення, питання">
            <div className="iw-gform pos"><span className="iw-gform-sign" aria-label="Ствердження">+</span><span>{t.positive}</span></div>
            <div className="iw-gform neg"><span className="iw-gform-sign" aria-label="Заперечення">−</span><span>{t.negative}</span></div>
            <div className="iw-gform que"><span className="iw-gform-sign" aria-label="Питання">?</span><span>{t.question}</span></div>
          </section>
          <section>
            <h3 className="iw-card-title">Коли вживається</h3>
            <div className="iw-guses">
              {(t.uses || []).map((u, i) => (
                <details key={i} className="iw-guse" open={i === 0}>
                  <summary><span className="iw-guse-num">{i + 1}</span><span className="iw-guse-case">{u.case}</span><ChevronDown size={16} className="iw-guse-chev" aria-hidden="true" /></summary>
                  <p>{u.explain}</p>
                  <ul>{u.examples.map((ex, j) => <li key={j}>{ex}</li>)}</ul>
                </details>
              ))}
            </div>
          </section>
        </div>
        <aside className="iw-gtopic-side">
          <section className="iw-card">
            <h3 className="iw-card-title">Маркери часу</h3>
            <div className="iw-gmarkers">{t.markers.split(/,\s*/).map((m, i) => <span key={i} className="iw-gmarker">{m}</span>)}</div>
          </section>
          <section className="iw-card iw-gpractice-cta">
            <h3 className="iw-card-title">Потренуйся</h3>
            <p>8 коротких завдань саме на {t.name}: приклади, маркери, формула, порядок слів.</p>
            <IwButton variant="primary" icon={Target} onClick={() => onPractice(t.id)}>Почати практику</IwButton>
            {topicAccuracy(row) != null && <div className="iw-gpractice-last">Твоя точність: <strong>{topicAccuracy(row)}%</strong> ({row.practice_correct}/{row.practice_attempts})</div>}
          </section>
          {related.length > 0 && (
            <section className="iw-card">
              <h3 className="iw-card-title">Часто плутають з</h3>
              <div className="iw-grelated">
                {related.map(r => <button key={r.id} type="button" className="iw-chip" onClick={() => onCompare(t.id, r.id)}><Columns size={13} aria-hidden="true" />{t.name} vs {r.name}</button>)}
              </div>
            </section>
          )}
        </aside>
      </div>
    </article>
  );
}

function TenseSelect({ value, onChange, label }) {
  return (
    <label className="iw-select iw-gcompare-select">
      <span className="sr-only">{label}</span>
      <select value={value} onChange={e => onChange(e.target.value)}>
        {TENSE_ROWS.map(r => <optgroup key={r.key} label={r.label}>{TENSES.filter(t => t.group === r.key).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}</optgroup>)}
      </select>
      <ChevronDown size={15} aria-hidden="true" />
    </label>
  );
}

function GrammarCompare({ pair, setPair, openTopic, onPractice }) {
  const [a, b] = pair.map(id => TENSES.find(t => t.id === id));

  const rows = [
    ['Формула', t => <code>{t.formulaLong}</code>],
    ['Коли', t => t.when],
    ['Маркери', t => <div className="iw-gmarkers">{t.markers.split(/,\s*/).map((m, i) => <span key={i} className="iw-gmarker">{m}</span>)}</div>],
    ['+', t => t.positive], ['−', t => t.negative], ['?', t => t.question],
    ['Вживання', t => <ul className="iw-gcompare-uses">{(t.uses || []).map((u, i) => <li key={i}><strong>{u.case}.</strong> {u.examples[0]}</li>)}</ul>],
  ];
  return (
    <div className="iw-gcompare">
      <div className="iw-gcompare-presets">
        <span className="iw-kicker">Популярні пари</span>
        <div className="iw-chips">
          {COMPARE_PRESETS.map(p => {
            const on = p[0] === pair[0] && p[1] === pair[1];
            return <button key={p.join()} type="button" className="iw-chip" aria-pressed={on} onClick={() => setPair(p)}>{TENSES.find(t => t.id === p[0]).name} vs {TENSES.find(t => t.id === p[1]).name}</button>;
          })}
        </div>
      </div>
      <div className="iw-gcompare-pickers">
        <TenseSelect value={pair[0]} label="Перший час" onChange={v => setPair([v, pair[1]])} />
        <button type="button" className="iw-btn iw-btn-ghost iw-btn-icon" onClick={() => setPair([pair[1], pair[0]])} aria-label="Поміняти місцями" data-tip="Поміняти місцями"><RefreshCw size={16} /></button>
        <TenseSelect value={pair[1]} label="Другий час" onChange={v => setPair([pair[0], v])} />
      </div>
      {a.id === b.id ? <p className="iw-help">Обери два різні часи.</p> : (
        <div className="iw-gcompare-table" role="table" aria-label={`${a.name} проти ${b.name}`}>
          <div className="iw-gcompare-row head" role="row">
            <span role="columnheader" />
            {[a, b].map(t => (
              <span key={t.id} role="columnheader" className={cx('iw-gcompare-th', `grp-${t.group}`)}>
                <button type="button" onClick={() => openTopic(t.id)}>{t.name}</button>
                <small>{t.nameUk}</small>
              </span>
            ))}
          </div>
          {rows.map(([label, fn]) => (
            <div key={label} className="iw-gcompare-row" role="row">
              <span role="rowheader" className={cx('iw-gcompare-label', label.length === 1 && 'sign')}>{label}</span>
              <span role="cell" className="iw-gcompare-cell" data-label={a.name}>{fn(a)}</span>
              <span role="cell" className="iw-gcompare-cell" data-label={b.name}>{fn(b)}</span>
            </div>
          ))}
        </div>
      )}
      <div className="iw-gcompare-foot">
        <IwButton variant="secondary" icon={Target} onClick={() => onPractice(a.group === b.group ? a.group : 'all', 'which')}>Потренуватися розрізняти</IwButton>
      </div>
    </div>
  );
}

function GrammarPractice({ topics, state, setState, start, progress, openTopic }) {
  const comp = useCompanion();
  const { scope, type, run } = state;
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [built, setBuilt] = useState([]);
  const [answers, setAnswers] = useState([]);
  useEffect(() => { setIdx(0); setPicked(null); setBuilt([]); setAnswers([]); }, [run]);
  const scopeTopic = topics.find(t => t.id === scope);
  const scopeLabel = scope === 'all' ? 'Усі часи' : scope === 'present' ? 'Present' : scope === 'past' ? 'Past' : scope === 'future' ? 'Future' : scopeTopic ? scopeTopic.name : scope;

  if (!run) {
    const lessonScopes = topics.filter(lessonTopicPracticable);
    return (
      <div className="iw-gpractice-setup">
        <div className="iw-card">
          <h3 className="iw-card-title">Що тренуємо?</h3>
          <div className="iw-chips" role="group" aria-label="Тема">
            {[['all', 'Усі часи'], ['present', 'Present'], ['past', 'Past'], ['future', 'Future']].map(([id, l]) => (
              <button key={id} type="button" className="iw-chip" aria-pressed={scope === id} onClick={() => setState(s => ({ ...s, scope: id }))}>{l}</button>
            ))}
          </div>
          <label className="iw-select iw-gpractice-tense">
            <span className="sr-only">Окремий час або тема з уроку</span>
            <select value={['all', 'present', 'past', 'future'].includes(scope) ? '' : scope} onChange={e => e.target.value && setState(s => ({ ...s, scope: e.target.value, type: e.target.value.startsWith('lesson:') ? 'order' : s.type }))}>
              <option value="">…або обери окремий час</option>
              <optgroup label="Часи">{TENSES.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}</optgroup>
              {lessonScopes.length > 0 && <optgroup label="З уроків (склади речення)">{lessonScopes.map(t => <option key={t.id} value={t.id}>Урок {t.lesson.number}: {t.name}</option>)}</optgroup>}
            </select>
            <ChevronDown size={15} aria-hidden="true" />
          </label>
          {!scope.startsWith('lesson:') && (
            <React.Fragment>
              <h3 className="iw-card-title" style={{ marginTop: 22 }}>Тип завдань</h3>
              <div className="iw-chips" role="group" aria-label="Тип завдань">
                {PRACTICE_TYPES.map(p => <button key={p.id} type="button" className="iw-chip" aria-pressed={type === p.id} onClick={() => setState(s => ({ ...s, type: p.id }))}>{p.label}</button>)}
              </div>
            </React.Fragment>
          )}
          <div className="iw-gpractice-go">
            <IwButton variant="primary" size="lg" icon={Play} onClick={() => start(scope, scope.startsWith('lesson:') ? 'order' : type)}>Почати · 8 завдань</IwButton>
          </div>
        </div>
        <div className="iw-card iw-card-soft iw-gpractice-about">
          <div className="iw-gpractice-art"><Illustration name="trophy" /></div>
          <p>Завдання складаються з прикладів, формул і маркерів, які вже є в Grammar Bank і в твоїх уроках. Результати допомагають побачити, що варто повторити — це тренування, а не оцінка рівня англійської.</p>
        </div>
      </div>
    );
  }

  if (run.length === 0) {
    return <EmptyState art="books" title="Для цієї теми поки немає завдань" text="Обери інший час або тип завдань." action={<IwButton size="sm" onClick={() => setState(s => ({ ...s, run: null }))}>Назад</IwButton>} />;
  }

  if (idx >= run.length) {
    const ok = answers.filter(a => a.correct).length;
    const pct = Math.round((ok / run.length) * 100);
    const wrong = answers.filter(a => !a.correct);
    return (
      <div className="iw-gresult">
        <div className="iw-card iw-gresult-head">
          {comp && comp.active
            ? <CompanionSpot event size={96} align="right" state={pct >= 80 ? 'celebrate' : pct >= 50 ? 'happy' : 'encourage'}
                lines={[pct >= 80 ? 'Amazing work! You nailed it!' : pct >= 50 ? 'Nice job! A bit more practice and you’ll nail it.' : 'Mistakes help us learn. Let’s try again!']} />
            : pct >= 80 && <div className="iw-gresult-art"><Illustration name="trophy" /></div>}
          <ProgressRing value={ok} max={run.length} size={110} stroke={9} tone={pct >= 80 ? 'sage' : pct >= 50 ? 'mustard' : 'terracotta'} label="Результат">{ok}/{run.length}</ProgressRing>
          <div>
            <h3 className="iw-gresult-title">{pct >= 80 ? 'Чудова робота!' : pct >= 50 ? 'Непогано — ще трохи практики!' : 'Варто повторити тему'}</h3>
            <p className="iw-modal-text">{scopeLabel} · {pct}% правильних відповідей</p>
            <div className="iw-gresult-actions">
              <IwButton variant="primary" icon={RefreshCw} onClick={() => start(scope, type)}>Ще раз</IwButton>
              <IwButton variant="secondary" onClick={() => setState(s => ({ ...s, run: null }))}>Інші налаштування</IwButton>
            </div>
          </div>
        </div>
        {wrong.length > 0 && (
          <section className="iw-card">
            <h3 className="iw-card-title">Розбір помилок</h3>
            <ul className="iw-gresult-list">
              {wrong.map((a, i) => (
                <li key={i}>
                  <div className="iw-gresult-q">{a.q.sentence ? `«${a.q.sentence}»` : a.q.prompt}</div>
                  <div className="iw-gresult-a">Правильно: <strong>{a.q.type === 'order' ? a.q.answer : (a.q.options.find(o => o.id === a.q.answer) || {}).label}</strong></div>
                  <div className="iw-gresult-e">{a.q.explain}</div>
                  {TENSES.some(t => t.id === a.q.topicId) && <button type="button" className="iw-link" onClick={() => openTopic(a.q.topicId)}>Повторити тему →</button>}
                </li>
              ))}
            </ul>
          </section>
        )}
      </div>
    );
  }

  const q = run[idx];
  const answered = picked != null;
  const correct = answered && (q.type === 'order' ? picked === q.answer : picked === q.answer);
  const submit = (value) => {
    if (answered) return;
    const isOk = value === q.answer;
    setPicked(value);
    const next = [...answers, { q, value, correct: isOk }];
    setAnswers(next);
    if (next.length === run.length) progress.recordPractice(next.map(a => ({ topicId: a.q.topicId, correct: a.correct })));
  };
  const nextQ = () => { setIdx(i => i + 1); setPicked(null); setBuilt([]); };
  const onKey = (e) => {
    if (q.type !== 'order' && !answered && /^[1-4]$/.test(e.key) && q.options[+e.key - 1]) submit(q.options[+e.key - 1].id);
    if (answered && e.key === 'Enter') { e.preventDefault(); nextQ(); }
  };

  return (
    <div className="iw-gq" onKeyDown={onKey}>
      <div className="iw-gq-top">
        <span className="iw-kicker">{scopeLabel} · {(PRACTICE_TYPES.find(p => p.id === q.type) || {}).label}</span>
        <span className="iw-gq-count">{idx + 1} / {run.length}</span>
        <IwButton size="sm" variant="ghost" onClick={() => setState(s => ({ ...s, run: null }))}>Завершити</IwButton>
      </div>
      <ProgressBar value={idx + (answered ? 1 : 0)} max={run.length} size="sm" tone="lavender-fill" label="Прогрес сесії" />
      <div className="iw-card iw-gq-card" key={idx}>
        <h3 className="iw-gq-prompt">{q.prompt}</h3>
        {q.sentence && <blockquote className="iw-gq-sentence">{q.sentence}</blockquote>}

        {q.type !== 'order' && (
          <div className="iw-gq-options" role="group" aria-label="Варіанти відповіді">
            {q.options.map((o, i) => {
              const st = !answered ? '' : o.id === q.answer ? 'right' : o.id === picked ? 'wrong' : 'dim';
              return (
                <button key={o.id} type="button" className={cx('iw-gq-opt', st, o.mono && 'mono')} onClick={() => submit(o.id)} disabled={answered} autoFocus={i === 0 && !answered}>
                  <span className="iw-gq-key" aria-hidden="true">{i + 1}</span>{o.label}
                  {st === 'right' && <CheckCircle size={17} className="iw-gq-mark" aria-label="правильно" />}
                  {st === 'wrong' && <X size={17} className="iw-gq-mark" aria-label="неправильно" />}
                </button>
              );
            })}
          </div>
        )}

        {q.type === 'order' && (
          <div className="iw-gorder">
            <div className={cx('iw-gorder-line', answered && (correct ? 'right' : 'wrong'))} aria-live="polite" aria-label="Твоє речення">
              {built.length === 0 && <span className="iw-gorder-ph">Натискай на слова по черзі…</span>}
              {built.map((tk, i) => (
                <button key={tk.i} type="button" className="iw-gorder-tok in" disabled={answered} onClick={() => setBuilt(b => b.filter((_, j) => j !== i))}>{tk.w}</button>
              ))}
            </div>
            <div className="iw-gorder-bank">
              {q.tokens.map(tk => {
                const used = built.some(b => b.i === tk.i);
                return <button key={tk.i} type="button" className="iw-gorder-tok" disabled={used || answered} onClick={() => setBuilt(b => [...b, tk])}>{tk.w}</button>;
              })}
            </div>
            {!answered && (
              <div className="iw-gorder-actions">
                <IwButton size="sm" variant="ghost" onClick={() => setBuilt([])} disabled={!built.length}>Очистити</IwButton>
                <IwButton variant="primary" disabled={built.length !== q.tokens.length} onClick={() => submit(built.map(b => b.w).join(' '))}>Перевірити</IwButton>
              </div>
            )}
          </div>
        )}

        {answered && (
          <div className={cx('iw-gq-feedback', correct ? 'right' : 'wrong')} role="status">
            <strong>{correct ? 'Правильно!' : 'Не зовсім.'}</strong>
            {!correct && q.type === 'order' && <div>Правильний порядок: <em>{q.answer}</em></div>}
            <p>{q.explain}</p>
            <IwButton variant="primary" iconRight={ArrowRight} onClick={nextQ} autoFocus>{idx + 1 === run.length ? 'Результат' : 'Далі'}</IwButton>
          </div>
        )}
      </div>
    </div>
  );
}

function GrammarProgressView({ topics, progress, openTopic, start, isTeacher }) {
  const rows = Array.from(progress.rows.values()).filter(r => topics.some(t => t.id === r.topic_id));
  const studied = rows.filter(r => r.studied_count > 0);
  const practiced = rows.filter(r => r.practice_attempts > 0);
  const attempts = practiced.reduce((a, r) => a + r.practice_attempts, 0);
  const correct = practiced.reduce((a, r) => a + r.practice_correct, 0);
  const acc = attempts ? Math.round((correct / attempts) * 100) : null;
  const topicOf = (id) => topics.find(t => t.id === id);
  const revise = practiced.filter(r => r.practice_attempts >= 3 && r.practice_correct / r.practice_attempts < 0.7)
    .sort((a, b) => a.practice_correct / a.practice_attempts - b.practice_correct / b.practice_attempts).slice(0, 5);
  const notPracticed = studied.filter(r => !r.practice_attempts && TENSES.some(t => t.id === r.topic_id)).slice(0, 5);
  const recent = [...studied].sort((a, b) => new Date(b.last_studied_at || 0) - new Date(a.last_studied_at || 0)).slice(0, 6);

  return (
    <div className="iw-gprog">
      {progress.mode === 'local' && (
        <div className="iw-gprog-note">
          <Lock size={14} aria-hidden="true" />
          {isTeacher
            ? <span>Прогрес зараз зберігається лише в цьому браузері. Щоб він зберігався в акаунтах учнів, запусти в Supabase SQL з файлу <code>supabase/grammar_progress.sql</code>.
                <button type="button" className="iw-link" onClick={() => { try { navigator.clipboard.writeText(GRAMMAR_PROGRESS_SQL).then(() => toast('SQL скопійовано', 'success')); } catch (e) {} }}> Скопіювати SQL</button></span>
            : <span>Прогрес збережено на цьому пристрої.</span>}
        </div>
      )}
      <div className="iw-stat-grid">
        <StatCard icon={BookOpen} tone="sky" value={studied.length} label="Тем вивчено" sub={`з ${topics.length} доступних`} />
        <StatCard icon={Target} tone="lavender-fill" value={practiced.length} label="Тем у практиці" />
        <StatCard icon={CheckCircle} tone="sage" value={acc == null ? '—' : `${acc}%`} label="Точність у практиці" sub={attempts ? `${correct} з ${attempts} завдань` : 'ще не тренувався(-лась)'} />
      </div>
      <p className="iw-gb-levelnote">Точність показує результати тренувань у Grammar Bank — це не оцінка рівня англійської.</p>

      {rows.length === 0 ? (
        <EmptyState art="books" title="Тут з'явиться твій прогрес" text="Відкрий будь-яку тему або пройди коротку практику — і тут буде видно, що вже вивчено."
          action={<IwButton variant="primary" size="sm" icon={Target} onClick={() => start('all')}>Почати практику</IwButton>} />
      ) : (
        <div className="iw-gprog-grid">
          <section className="iw-card">
            <h3 className="iw-card-title">Точність по темах</h3>
            {practiced.length === 0 && <p className="iw-scard-muted">Пройди практику, щоб побачити точність по темах.</p>}
            <div className="iw-gprog-bars">
              {practiced.sort((a, b) => b.practice_attempts - a.practice_attempts).map(r => {
                const t = topicOf(r.topic_id); const p = Math.round((r.practice_correct / r.practice_attempts) * 100);
                return (
                  <button key={r.topic_id} type="button" className="iw-gprog-bar" onClick={() => openTopic(r.topic_id)}>
                    <ProgressBar value={r.practice_correct} max={r.practice_attempts} size="sm" tone={p >= 80 ? 'sage' : p >= 60 ? 'mustard' : 'terracotta'}
                      label={t.name} valueLabel={`${p}% · ${r.practice_correct}/${r.practice_attempts}`} />
                  </button>
                );
              })}
            </div>
          </section>
          <div className="iw-gprog-side">
            {(revise.length > 0 || notPracticed.length > 0) && (
              <section className="iw-card">
                <h3 className="iw-card-title">Варто повторити</h3>
                <ul className="iw-gprog-list">
                  {revise.map(r => <li key={r.topic_id}><button type="button" className="iw-link" onClick={() => openTopic(r.topic_id)}>{topicOf(r.topic_id).name}</button><span>{Math.round((r.practice_correct / r.practice_attempts) * 100)}% у практиці</span><IwButton size="sm" variant="ghost" onClick={() => start(r.topic_id)}>Тренувати</IwButton></li>)}
                  {notPracticed.map(r => <li key={r.topic_id}><button type="button" className="iw-link" onClick={() => openTopic(r.topic_id)}>{topicOf(r.topic_id).name}</button><span>вивчено, але ще без практики</span><IwButton size="sm" variant="ghost" onClick={() => start(r.topic_id)}>Тренувати</IwButton></li>)}
                </ul>
              </section>
            )}
            {recent.length > 0 && <section className="iw-card">
              <h3 className="iw-card-title">Нещодавно вивчені</h3>
              <ul className="iw-gprog-list">
                {recent.map(r => <li key={r.topic_id}><button type="button" className="iw-link" onClick={() => openTopic(r.topic_id)}>{topicOf(r.topic_id).name}</button><span>{formatRelativeTime(r.last_studied_at)}</span></li>)}
              </ul>
            </section>}
          </div>
        </div>
      )}
    </div>
  );
}

//   ручний доступ від вчителя). Пошук, практика, челендж і колекції
//   працюють ЛИШЕ з доступними словами.
// • Інтервальне повторення — наявний алгоритм SM-2 (computeNextReview)
//   і таблиця vocab_progress. Статуси слова:
//     нове — ще не повторювалось; вчу — інтервал < 21 дня;
//     у довготривалій пам'яті — інтервал ≥ 21 дня (як «зріла» картка в SM-2);
//     на повторення — next_review_at уже настав.
// • Практика й щоденний челендж — окремі вправи Vocabulary Bank, вони не
//   змінюють розклад флешкарток.

const canSpeak = () => typeof window !== 'undefined' && 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
function speakWord(text) {
  if (!canSpeak()) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/[—–].*$/, '').replace(/[()]/g, ''));
    u.lang = 'en-GB'; u.rate = 0.9;
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(x => /en-GB/i.test(x.lang)) || voices.find(x => /^en/i.test(x.lang));
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

// ── Сховище: обране, колекції, активність ──
function useVocabStore(session) {
  const uid = session.user.id;
  const localKey = `inkwell-vocab:${uid}`;
  const empty = { favorites: [], collections: [], activity: [] };
  const [state, setState] = useState({ mode: 'loading', favRowId: null, ...empty });
  const ref = useRef(state); ref.current = state;
  const readLocal = () => { try { return { ...empty, ...JSON.parse(localStorage.getItem(localKey) || '{}') }; } catch (e) { return empty; } };
  const writeLocal = (s) => { try { localStorage.setItem(localKey, JSON.stringify({ favorites: s.favorites, collections: s.collections, activity: s.activity.slice(-200) })); } catch (e) {} };

  useEffect(() => {
    let alive = true;
    (async () => {
      const [c, a] = await Promise.all([
        window.SB.from('vocab_collections').select('*').eq('student_id', uid),
        window.SB.from('vocab_activity').select('*').eq('student_id', uid).order('created_at', { ascending: false }),
      ]).catch(() => [{ error: true }, { error: true }]);
      if (!alive) return;
      if (c.error || a.error) { setState({ mode: 'local', favRowId: null, ...readLocal() }); return; }
      let favRow = (c.data || []).find(r => r.is_favorites);
      const collections = (c.data || []).filter(r => !r.is_favorites).map(r => ({ id: r.id, name: r.name, wordIds: r.word_ids || [], updated_at: r.updated_at }));
      const activity = (a.data || []).map(r => ({ id: r.id, kind: r.kind, mode: r.mode, day: r.day, score: r.score, total: r.total, at: r.created_at }));
      let favorites = favRow ? (favRow.word_ids || []) : [];
      // Переносимо в акаунт те, що було збережено в браузері до появи таблиць
      const local = readLocal();
      if (local.favorites.length || local.collections.length || local.activity.length) {
        favorites = Array.from(new Set([...favorites, ...local.favorites]));
        if (local.favorites.length) {
          if (favRow) await window.SB.from('vocab_collections').update({ word_ids: favorites, updated_at: new Date().toISOString() }).eq('id', favRow.id);
          else { const r = await window.SB.from('vocab_collections').insert({ student_id: uid, name: 'Обране', word_ids: favorites, is_favorites: true }).select().single(); favRow = r.data; }
        }
        for (const col of local.collections) {
          const r = await window.SB.from('vocab_collections').insert({ student_id: uid, name: col.name, word_ids: col.wordIds }).select().single();
          if (r.data) collections.push({ id: r.data.id, name: r.data.name, wordIds: r.data.word_ids || [] });
        }
        const acts = local.activity.filter(x => !(x.kind === 'daily' && activity.some(y => y.kind === 'daily' && y.day === x.day)));
        if (acts.length) await window.SB.from('vocab_activity').insert(acts.map(x => ({ student_id: uid, kind: x.kind, mode: x.mode, day: x.day, score: x.score, total: x.total })));
        acts.forEach(x => activity.unshift(x));
        try { localStorage.removeItem(localKey); } catch (e) {}
      }
      if (alive) setState({ mode: 'db', favRowId: favRow ? favRow.id : null, favorites, collections, activity });
    })();
    return () => { alive = false; };
  }, [uid]);

  const commitLocal = (next) => { setState(next); writeLocal(next); };
  const fail = (e) => toast('Не вдалося зберегти: ' + (e && e.message ? e.message : 'помилка'), 'error');

  async function toggleFavorite(wordId) {
    const s = ref.current;
    const on = s.favorites.includes(wordId);
    const favorites = on ? s.favorites.filter(x => x !== wordId) : [...s.favorites, wordId];
    if (s.mode !== 'db') { commitLocal({ ...s, favorites }); return; }
    setState({ ...s, favorites });
    if (s.favRowId) {
      const { error } = await window.SB.from('vocab_collections').update({ word_ids: favorites, updated_at: new Date().toISOString() }).eq('id', s.favRowId);
      if (error) fail(error);
    } else {
      const { data, error } = await window.SB.from('vocab_collections').insert({ student_id: uid, name: 'Обране', word_ids: favorites, is_favorites: true }).select().single();
      if (error) fail(error); else setState(st => ({ ...st, favRowId: data.id }));
    }
  }
  async function createCollection(name, wordIds = []) {
    const s = ref.current;
    if (s.mode !== 'db') {
      const col = { id: 'local-' + Date.now(), name, wordIds };
      commitLocal({ ...s, collections: [...s.collections, col] }); return col;
    }
    const { data, error } = await window.SB.from('vocab_collections').insert({ student_id: uid, name, word_ids: wordIds }).select().single();
    if (error) { fail(error); return null; }
    const col = { id: data.id, name: data.name, wordIds: data.word_ids || [] };
    setState(st => ({ ...st, collections: [...st.collections, col] }));
    return col;
  }
  async function updateCollection(id, changes) {
    const s = ref.current;
    const collections = s.collections.map(c => c.id === id ? { ...c, ...changes } : c);
    if (s.mode !== 'db') { commitLocal({ ...s, collections }); return; }
    setState({ ...s, collections });
    const patch = { updated_at: new Date().toISOString() };
    if (changes.name != null) patch.name = changes.name;
    if (changes.wordIds) patch.word_ids = changes.wordIds;
    const { error } = await window.SB.from('vocab_collections').update(patch).eq('id', id);
    if (error) fail(error);
  }
  async function deleteCollection(id) {
    const s = ref.current;
    const collections = s.collections.filter(c => c.id !== id);
    if (s.mode !== 'db') { commitLocal({ ...s, collections }); return; }
    setState({ ...s, collections });
    const { error } = await window.SB.from('vocab_collections').delete().eq('id', id);
    if (error) fail(error);
  }
  async function toggleInCollection(id, wordId) {
    const col = ref.current.collections.find(c => c.id === id);
    if (!col) return;
    const has = col.wordIds.includes(wordId);
    await updateCollection(id, { wordIds: has ? col.wordIds.filter(x => x !== wordId) : [...col.wordIds, wordId] });
    return !has;
  }
  async function logActivity(kind, mode, score, total) {
    const s = ref.current;
    const entry = { kind, mode, day: localDayKey(Date.now()), score, total, at: new Date().toISOString() };
    if (kind === 'daily' && s.activity.some(a => a.kind === 'daily' && a.day === entry.day)) return;
    if (s.mode !== 'db') { commitLocal({ ...s, activity: [entry, ...s.activity] }); return; }
    setState({ ...s, activity: [entry, ...s.activity] });
    const { error } = await window.SB.from('vocab_activity').insert({ student_id: uid, kind, mode, day: entry.day, score, total });
    if (error) fail(error);
  }
  return { ...state, toggleFavorite, createCollection, updateCollection, deleteCollection, toggleInCollection, logActivity };
}

function wordStatus(row, now = new Date()) {
  if (!row) return 'new';
  if (row.next_review_at && new Date(row.next_review_at) <= now) return 'due';
  if ((row.interval_days || 0) >= STRONG_INTERVAL_DAYS) return 'strong';
  return 'learning';
}

  learning: { label: 'Вчу', tone: 'info' },
  strong: { label: 'Довготривала пам’ять', tone: 'success' },
};

// ── Генерація вправ зі слів ──
function seededRandom(seedStr) {
  let h = 1779033703 ^ seedStr.length;
  for (let i = 0; i < seedStr.length; i++) { h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = h >>> 0;
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function shuffleWith(arr, rnd) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const normAnswer = (s) => String(s || '').toLowerCase().replace(/[’']/g, "'").replace(/[.,!?;:"()]/g, '').replace(/\s+/g, ' ').trim().replace(/^(to|a|an|the) /, '');
const typeable = (w) => /^[A-Za-z' -]{2,24}$/.test(w.en) && w.en.trim().split(/\s+/).length <= 3;
function maskExplain(w) {
  if (!w.explain) return null;
  const re = new RegExp(w.en.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig');
  const masked = w.explain.replace(re, '_____');
  return masked;
}

const VOCAB_PRACTICE_TYPES = [
  { id: 'mix', label: 'Мікс' },
  { id: 'match', label: 'Пари' },
  { id: 'en2uk', label: 'Англ → Укр' },
  { id: 'uk2en', label: 'Укр → Англ' },
  { id: 'meaning', label: 'За поясненням' },
  { id: 'listen', label: 'На слух' },
  { id: 'type', label: 'Напиши переклад' },
];

function makeWordQuestion(type, w, pool, rnd) {
  const others = shuffleWith(pool.filter(x => x.wordId !== w.wordId && x.en !== w.en && x.uk !== w.uk), rnd).slice(0, 3);
  if (others.length < 3 && type !== 'type') return null;
  const opts = (key) => shuffleWith([w, ...others], rnd).map(x => ({ id: x.wordId, label: x[key], emoji: key === 'en' ? null : null }));
  if (type === 'en2uk') return { type, word: w, prompt: 'Як це перекладається?', big: w.en, emoji: w.emoji, options: opts('uk'), answer: w.wordId };
  if (type === 'uk2en') return { type, word: w, prompt: 'Як це англійською?', big: w.uk, emoji: w.emoji, options: opts('en'), answer: w.wordId };
  if (type === 'meaning') {
    const m = maskExplain(w); if (!m) return null;
    return { type, word: w, prompt: 'Яке слово підходить до пояснення?', context: m, options: opts('en'), answer: w.wordId };
  }
  if (type === 'listen') {
    if (!canSpeak()) return null;
    return { type, word: w, prompt: 'Послухай і обери слово', listen: w.en, options: opts('en'), answer: w.wordId };
  }
  if (type === 'type') {
    if (!typeable(w)) return null;
    return { type, word: w, prompt: 'Напиши англійською', big: w.uk, emoji: w.emoji, answer: w.en };
  }
  return null;
}

function buildVocabSession(words, type, count, seed) {
  const rnd = seed ? seededRandom(seed) : Math.random;
  if (words.length < 4) return [];
  if (type === 'match') {
    const rounds = [];
    const pool = shuffleWith(words.filter((w, i, a) => a.findIndex(x => x.en === w.en || x.uk === w.uk) === i), rnd);
    for (let i = 0; i + 4 <= pool.length && rounds.length < Math.max(1, Math.floor(count / 5)); i += 5) {
      const set = pool.slice(i, i + 5);
      if (set.length >= 4) rounds.push({ type: 'match', pairs: set, right: shuffleWith(set, rnd) });
    }
    return rounds;
  }
  const types = type === 'mix' ? ['en2uk', 'uk2en', 'meaning', 'listen', 'type'].filter(t => t !== 'listen' || canSpeak()) : [type];
  const out = []; const used = new Set();
  const order = shuffleWith(words, rnd);
  for (let i = 0, guard = 0; out.length < count && guard < count * 12; guard++, i++) {
    const w = order[i % order.length];
    if (used.has(w.wordId) && used.size < order.length) continue;
    const t = types[Math.floor(rnd() * types.length)];
    const q = makeWordQuestion(t, w, words, rnd);
    if (!q) continue;
    used.add(w.wordId); out.push(q);
  }
  return out;
}

const VB_TABS = [
  { id: 'words', label: 'Слова', icon: Library },
  { id: 'cards', label: 'Флешкартки', icon: Layers2 },
  { id: 'practice', label: 'Практика', icon: Target },
  { id: 'collections', label: 'Колекції', icon: Folder },

function VocabularyBank({ goHome, setRoute, canSeeVocabWord, isTeacher, session, focusCourseId, focusLessonId, initialTab }) {
  const allItems = useMemo(() => getAllVocabItems(), []);
  const words = useMemo(() => allItems.filter(w => canSeeVocabWord(w)), [allItems, canSeeVocabWord]);
  const store = useVocabStore(session);
  const [progress, setProgress] = useState(new Map());
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState(initialTab || 'words');
  const [query, setQuery] = useState('');
  const [practiceCfg, setPracticeCfg] = useState({ scope: 'all', type: 'mix', run: null, daily: false });

  useEffect(() => {
    let alive = true;
    window.SB.from('vocab_progress').select('word_id, next_review_at, interval_days, repetitions, last_reviewed_at').eq('student_id', session.user.id)
      .then(({ data }) => { if (alive) { setProgress(new Map((data || []).map(r => [r.word_id, r]))); setLoaded(true); } }, () => setLoaded(true));
    return () => { alive = false; };
  }, [session.user.id]);

  const stats = useMemo(() => {
    const now = new Date(); let reviewed = 0, due = 0, strong = 0, fresh = 0;
    words.forEach(w => { const s = wordStatus(progress.get(w.wordId), now); if (s === 'new') fresh++; else reviewed++; if (s === 'due') due++; if (s === 'strong') strong++; });
    return { total: words.length, reviewed, due, strong, fresh, sessions: store.activity.filter(a => a.kind === 'practice').length };
  }, [words, progress, store.activity]);

  const today = localDayKey(Date.now());
  const dailyDone = store.activity.find(a => a.kind === 'daily' && a.day === today);
  const startPractice = (cfg) => {
    const pool = resolveScope(cfg.scope, words, store);
    const run = cfg.daily
      ? buildVocabSession(words, 'mix', 5, `${session.user.id}:${today}`).map(q => q)
      : buildVocabSession(pool, cfg.type, cfg.type === 'match' ? 10 : 10);
    setPracticeCfg({ ...cfg, run });
    setTab('practice');
    requestAnimationFrame(() => { const el = document.getElementById('vb-top'); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' }); });
  };
  const course = focusCourseId ? COURSES.find(c => c.id === focusCourseId) : null;

  return (
    <main className="page iw-vb">
      <Crumbs items={[
        { label: isTeacher ? 'Library' : 'Home', onClick: goHome },
        course ? { label: 'Vocabulary Bank', onClick: () => setRoute({ page: 'vocabulary' }) } : { label: 'Vocabulary Bank', current: true },
        ...(course ? [{ label: course.title, current: true }] : []),
      ]} />
      <PageHeader eyebrow="Vocabulary Bank"
        title={<React.Fragment>Твої слова <em>під рукою.</em></React.Fragment>}
        subtitle={isTeacher ? 'Уся лексика курсів: пошук, перегляд за юнітами й уроками, практика.' : 'Тут з’являються слова з уроків, які ти завершив. Повторюй флешкартками, тренуйся та збирай власні колекції.'}
        art="vocab" buddy={<CompanionSpot context="vocab" state="greet" size={78} align="right" />} />

      <div className="iw-gb-search" role="search">
        <div className="search-bar">
          <Search size={20} aria-hidden="true" />
          <input type="search" className="search-input" value={query} onChange={e => { setQuery(e.target.value); if (e.target.value) setTab('words'); }}
            placeholder="Шукай англійською чи українською, або за уроком…" aria-label="Пошук слів" />
          {query && <button className="search-clear" onClick={() => setQuery('')} aria-label="Очистити"><X size={16} /></button>}
        </div>
      </div>

      {!isTeacher && (
        <div className="iw-stat-grid iw-vb-stats">
          <StatCard icon={Library} tone="sage" value={stats.total} label="Слів доступно" sub={stats.fresh ? `${stats.fresh} ще нових` : 'усі вже повторював(-ла)'} />
          <StatCard icon={RefreshCw} tone="sky" value={loaded ? stats.reviewed : '–'} label="Повторено у флешкартках" />
          <StatCard icon={Clock} tone="mustard" value={loaded ? stats.due : '–'} label="На повторення сьогодні" />
          <StatCard icon={CheckCircle} tone="plum" value={loaded ? stats.strong : '–'} label="У довготривалій пам’яті" sub={`інтервал ≥ ${STRONG_INTERVAL_DAYS} днів`} />
        </div>
      )}

      {words.length >= 4 && (
        <div className={cx('iw-daily', dailyDone && 'done')}>
          <div className="iw-daily-icon" aria-hidden="true">{dailyDone ? <CheckCircle size={22} /> : <Zap size={22} />}</div>
          <div className="iw-daily-body">
            <div className="iw-kicker">Щоденний челендж · {new Date().toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' })}</div>
            <div className="iw-daily-title">{dailyDone ? `Виконано: ${dailyDone.score} з ${dailyDone.total}` : '5 питань зі слів, які ти вже знаєш'}</div>
            <div className="iw-daily-sub">{dailyDone ? 'Новий челендж з’явиться завтра.' : 'Кілька хвилин на день — і слова не забуваються.'}</div>
          </div>
          {!dailyDone && <IwButton variant="primary" iconRight={ArrowRight} onClick={() => startPractice({ scope: 'all', type: 'mix', daily: true })}>Почати</IwButton>}

function dailyStreak(activity) {
  const days = new Set(activity.filter(a => a.kind === 'daily').map(a => a.day));
  let n = 0; const d = new Date();
  if (!days.has(localDayKey(d))) d.setDate(d.getDate() - 1);
  while (days.has(localDayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function resolveScope(scope, words, store) {
  if (!scope || scope === 'all') return words;
  if (scope === 'favorites') return words.filter(w => store.favorites.includes(w.wordId));
  if (scope.startsWith('col:')) { const c = store.collections.find(x => x.id === scope.slice(4)); return c ? words.filter(w => c.wordIds.includes(w.wordId)) : []; }
  if (scope.startsWith('course:')) return words.filter(w => w.courseId === scope.slice(7));
  if (scope.startsWith('unit:')) { const [, cid, uid] = scope.split(':'); return words.filter(w => w.courseId === cid && w.unitId === uid); }
  if (scope.startsWith('lesson:')) { const [, cid, lid] = scope.split(':'); return words.filter(w => w.courseId === cid && w.lessonId === lid); }
  return words;
}

  const [openUnits, setOpenUnits] = useState(() => {
    if (focusLessonId) { const w = words.find(x => x.lessonId === focusLessonId && x.courseId === focusCourseId); return new Set(w ? [`${w.courseId}:${w.unitId}`] : []); }
    return new Set();
  });
  const [openLesson, setOpenLesson] = useState(focusCourseId && focusLessonId ? `${focusCourseId}:${focusLessonId}` : null);
  const now = new Date();
  const statusOf = (w) => isTeacher ? null : wordStatus(progress.get(w.wordId), now);
  const q = query.trim().toLowerCase();

  useEffect(() => {
    if (!focusLessonId) return;
    const el = document.getElementById(`vl-${focusCourseId}:${focusLessonId}`);
    if (el) setTimeout(() => window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 90, behavior: 'smooth' }), 120);
  }, []);

  const flat = q || filter !== 'all';
  const shown = flat ? words.filter(w => {
    if (q && ![w.en, w.uk, w.explain, w.lessonTitle, w.lessonTitleUk, w.unitTitle, w.courseTitle, `l${w.lessonNumber}`, `unit ${w.unitNumber}`].some(f => (f || '').toLowerCase().includes(q))) return false;

    if (filter !== 'all') return statusOf(w) === filter;
    return true;
  }) : [];

  const tree = useMemo(() => {
    const courses = [];

      if (focusCourseId && c.id !== focusCourseId) return;

            })}

      </div>

      {flat ? (
        shown.length === 0
          ? <EmptyState art="books" title="Нічого не знайдено" text={q ? 'Спробуй інше слово — англійською чи українською.' : 'У цьому фільтрі поки порожньо.'} />
          : <React.Fragment>

              {shown.length > 120 && <p className="iw-help">Показано перші 120 — уточни пошук.</p>}
            </React.Fragment>
      ) : tree.map(({ course, units, count }) => (
        <section key={course.id} className="iw-course-block">
          <div className="iw-course-block-head">
            <div><div className="iw-kicker">Курс · {count} {pluralUk(count, 'слово', 'слова', 'слів')}</div><h3 className="iw-course-sum-title">{course.title}</h3></div>

                              <div className="iw-vlesson-body">

                        );

  );

function scopeOptions(words, store) {
  const opts = [{ id: 'all', label: `Усі мої слова (${words.length})` }];
  const fav = words.filter(w => store.favorites.includes(w.wordId)).length;
  if (fav >= 4) opts.push({ id: 'favorites', label: `Обране (${fav})` });
  store.collections.forEach(c => { const n = words.filter(w => c.wordIds.includes(w.wordId)).length; if (n >= 4) opts.push({ id: `col:${c.id}`, label: `Колекція «${c.name}» (${n})` }); });
  COURSES.forEach(c => c.units.forEach(u => { const n = words.filter(w => w.courseId === c.id && w.unitId === u.id).length; if (n >= 4) opts.push({ id: `unit:${c.id}:${u.id}`, label: `Unit ${u.number}: ${u.title} (${n})` }); }));
  return opts;
}

function VocabPracticeTab({ words, store, cfg, setCfg, start }) {
  const comp = useCompanion();
  const { scope, type, run, daily } = cfg;
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [typed, setTyped] = useState('');
  const [answers, setAnswers] = useState([]);
  const [match, setMatch] = useState({ left: null, done: [], wrong: null });
  useEffect(() => { setIdx(0); setPicked(null); setTyped(''); setAnswers([]); setMatch({ left: null, done: [], wrong: null }); }, [run]);
  const q = run && run[idx];
  useEffect(() => { if (q && q.type === 'listen') setTimeout(() => speakWord(q.listen), 250); }, [q]);

  if (words.length < 4) return <EmptyState art="books" title="Для практики потрібно хоча б 4 слова" text="Слова з’являться після завершення уроків." />;

  if (!run) {
    const opts = scopeOptions(words, store);
    const pool = resolveScope(scope, words, store);
    return (
      <div className="iw-gpractice-setup">
        <div className="iw-card">
          <h3 className="iw-card-title">Які слова тренуємо?</h3>
          <label className="iw-select iw-gpractice-tense">
            <span className="sr-only">Набір слів</span>
            <select value={scope} onChange={e => setCfg(c => ({ ...c, scope: e.target.value }))}>
              {opts.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}
            </select>
            <ChevronDown size={15} aria-hidden="true" />
          </label>
          <h3 className="iw-card-title" style={{ marginTop: 22 }}>Тип вправи</h3>
          <div className="iw-chips" role="group" aria-label="Тип вправи">
            {VOCAB_PRACTICE_TYPES.filter(t => t.id !== 'listen' || canSpeak()).map(t => <button key={t.id} type="button" className="iw-chip" aria-pressed={type === t.id} onClick={() => setCfg(c => ({ ...c, type: t.id }))}>{t.label}</button>)}
          </div>
          <div className="iw-gpractice-go">
            <IwButton variant="primary" size="lg" icon={Play} disabled={pool.length < 4} onClick={() => start({ scope, type, daily: false })}>Почати · {type === 'match' ? '2 раунди пар' : '10 завдань'}</IwButton>
          </div>
        </div>
        <div className="iw-card iw-card-soft iw-gpractice-about">
          <div className="iw-gpractice-art"><Illustration name="trophy" /></div>
          <p>Практика не змінює розклад флешкарток — це окреме тренування. Слова беруться лише з уже доступних тобі уроків.</p>
        </div>
      </div>
    );
  }

  if (run.length === 0) return <EmptyState art="books" title="Не вдалося скласти завдання" text="Для цього типу потрібно більше слів. Обери інший набір." action={<IwButton size="sm" onClick={() => setCfg(c => ({ ...c, run: null }))}>Назад</IwButton>} />;

  const total = run.reduce((a, r) => a + (r.type === 'match' ? r.pairs.length : 1), 0);
  const finish = (all) => {
    const ok = all.filter(a => a.correct).length;
    store.logActivity(daily ? 'daily' : 'practice', daily ? 'daily' : type, ok, all.length);
  };

  if (idx >= run.length) {
    const ok = answers.filter(a => a.correct).length;
    const pct = Math.round((ok / Math.max(answers.length, 1)) * 100);
    const wrong = answers.filter(a => !a.correct && a.word);
    return (
      <div className="iw-gresult">
        <div className={cx('iw-card iw-gresult-head', daily && 'iw-daily-result')}>
          {comp && comp.active
            ? <CompanionSpot event size={96} align="right" state={pct >= 80 ? 'celebrate' : pct >= 50 ? 'happy' : 'encourage'}
                lines={[pct >= 80 ? 'Amazing work! You nailed it!' : pct >= 50 ? 'Nice job! A bit more practice and you’ll nail it.' : 'Mistakes help us learn. Let’s try again!']} />
            : pct >= 80 && <div className="iw-gresult-art"><Illustration name="trophy" /></div>}
          <ProgressRing value={ok} max={answers.length} size={110} stroke={9} tone={pct >= 80 ? 'sage' : pct >= 50 ? 'mustard' : 'terracotta'} label="Результат">{ok}/{answers.length}</ProgressRing>
          <div>
            <h3 className="iw-gresult-title">{daily ? (pct >= 80 ? 'Челендж виконано на відмінно!' : 'Челендж виконано!') : pct >= 80 ? 'Чудова робота!' : pct >= 50 ? 'Непогано — ще трохи практики!' : 'Варто повторити ці слова'}</h3>
            <p className="iw-modal-text">{daily ? 'Повертайся завтра по новий челендж.' : `${pct}% правильних відповідей`}</p>
            <div className="iw-gresult-actions">
              {!daily && <IwButton variant="primary" icon={RefreshCw} onClick={() => start({ scope, type, daily: false })}>Ще раз</IwButton>}
              <IwButton variant="secondary" onClick={() => setCfg(c => ({ ...c, run: null, daily: false }))}>{daily ? 'До практики' : 'Інші налаштування'}</IwButton>
            </div>
          </div>
        </div>
        {wrong.length > 0 && (
          <section className="iw-card">
            <h3 className="iw-card-title">Слова, які варто повторити</h3>
            <div className="iw-word-grid">{Array.from(new Map(wrong.map(a => [a.word.wordId, a.word])).values()).map(w => <WordCard key={w.wordId} word={w} store={store} showUk />)}</div>
          </section>
        )}
      </div>
    );
  }

  const record = (entries) => {
    const next = [...answers, ...entries];
    setAnswers(next);
    if (idx + 1 >= run.length) finish(next);
    return next;
  };
  const nextQ = () => { setIdx(i => i + 1); setPicked(null); setTyped(''); setMatch({ left: null, done: [], wrong: null }); };
  const header = (
    <React.Fragment>
      <div className="iw-gq-top">
        <span className="iw-kicker">{daily ? 'Щоденний челендж' : (VOCAB_PRACTICE_TYPES.find(t => t.id === (q.type === 'match' ? 'match' : q.type)) || {}).label}</span>
        <span className="iw-gq-count">{idx + 1} / {run.length}</span>
        <IwButton size="sm" variant="ghost" onClick={() => setCfg(c => ({ ...c, run: null, daily: false }))}>Завершити</IwButton>
      </div>
      <ProgressBar value={idx + (picked != null ? 1 : 0)} max={run.length} size="sm" tone={daily ? 'gold-fill' : 'lavender-fill'} label="Прогрес" />
    </React.Fragment>
  );

  if (q.type === 'match') {
    const doneIds = match.done;
    const allDone = doneIds.length === q.pairs.length;
    const clickRight = (w) => {
      if (!match.left || doneIds.includes(w.wordId)) return;
      if (match.left === w.wordId) {
        const done = [...doneIds, w.wordId];
        setMatch({ left: null, done, wrong: null });
        if (done.length === q.pairs.length) {
          setPicked('done');
          record(q.pairs.map(p => ({ word: p, correct: !(match.misses || []).includes(p.wordId) })));
        }
      } else {
        setMatch(m => ({ ...m, wrong: w.wordId, misses: Array.from(new Set([...(m.misses || []), m.left])) }));
        setTimeout(() => setMatch(m => ({ ...m, wrong: null })), 500);
      }
    };
    return (
      <div className="iw-gq">
        {header}
        <div className="iw-card iw-gq-card" key={idx}>
          <h3 className="iw-gq-prompt">З’єднай слово з перекладом</h3>
          <div className="iw-vmatch">
            <div className="iw-vmatch-col" role="group" aria-label="Англійські слова">
              {q.pairs.map(w => (
                <button key={w.wordId} type="button" className={cx('iw-vmatch-item', match.left === w.wordId && 'sel', doneIds.includes(w.wordId) && 'ok')}
                  disabled={doneIds.includes(w.wordId)} aria-pressed={match.left === w.wordId} onClick={() => setMatch(m => ({ ...m, left: w.wordId }))}>
                  <span aria-hidden="true">{w.emoji}</span> {w.en}
                </button>
              ))}
            </div>
            <div className="iw-vmatch-col" role="group" aria-label="Переклади">
              {q.right.map(w => (
                <button key={w.wordId} type="button" className={cx('iw-vmatch-item', doneIds.includes(w.wordId) && 'ok', match.wrong === w.wordId && 'bad')}
                  disabled={doneIds.includes(w.wordId) || !match.left} onClick={() => clickRight(w)}>{w.uk}</button>
              ))}
            </div>
          </div>
          {allDone && (
            <div className="iw-gq-feedback right" role="status">
              <strong>Усі пари знайдено!</strong>
              <p>{(match.misses || []).length ? `Помилок: ${(match.misses || []).length}. Ці слова варто повторити.` : 'Без жодної помилки.'}</p>
              <IwButton variant="primary" iconRight={ArrowRight} onClick={nextQ} autoFocus>{idx + 1 === run.length ? 'Результат' : 'Далі'}</IwButton>
            </div>
          )}
        </div>
      </div>
    );
  }

  const answered = picked != null;
  const isTyped = q.type === 'type';
  const correct = answered && (isTyped ? normAnswer(picked) === normAnswer(q.answer) : picked === q.answer);
  const submit = (val) => { if (answered) return; setPicked(val); record([{ word: q.word, correct: isTyped ? normAnswer(val) === normAnswer(q.answer) : val === q.answer }]); };
  const onKey = (e) => {
    if (!isTyped && !answered && /^[1-4]$/.test(e.key) && q.options[+e.key - 1]) submit(q.options[+e.key - 1].id);
    if (answered && e.key === 'Enter') { e.preventDefault(); nextQ(); }
  };
  return (
    <div className="iw-gq" onKeyDown={onKey}>
      {header}
      <div className="iw-card iw-gq-card" key={idx}>
        <h3 className="iw-gq-prompt">{q.prompt}</h3>
        {q.big && <div className="iw-vq-big"><span aria-hidden="true">{q.emoji}</span> {q.big}{q.type === 'en2uk' && <SpeakButton text={q.big} size={18} />}</div>}
        {q.context && <blockquote className="iw-gq-sentence">{q.context}</blockquote>}
        {q.listen && <div className="iw-vq-listen"><IwButton variant="secondary" size="lg" icon={Volume} onClick={() => speakWord(q.listen)}>Послухати ще раз</IwButton></div>}
        {!isTyped && (
          <div className="iw-gq-options" role="group" aria-label="Варіанти відповіді">
            {q.options.map((o, i) => {
              const st = !answered ? '' : o.id === q.answer ? 'right' : o.id === picked ? 'wrong' : 'dim';
              return (
                <button key={o.id} type="button" className={cx('iw-gq-opt', st)} onClick={() => submit(o.id)} disabled={answered} autoFocus={i === 0 && !answered && q.type !== 'listen'}>
                  <span className="iw-gq-key" aria-hidden="true">{i + 1}</span>{o.label}
                  {st === 'right' && <CheckCircle size={17} className="iw-gq-mark" aria-label="правильно" />}
                  {st === 'wrong' && <X size={17} className="iw-gq-mark" aria-label="неправильно" />}
                </button>
              );
            })}
          </div>
        )}
        {isTyped && (
          <form className="iw-vtype" onSubmit={e => { e.preventDefault(); if (typed.trim()) submit(typed); }}>
            <input className={cx('iw-text-input', answered && (correct ? 'right' : 'wrong'))} value={answered ? picked : typed} onChange={e => setTyped(e.target.value)} disabled={answered}
              autoFocus autoComplete="off" autoCapitalize="off" spellCheck={false} placeholder="Твоя відповідь англійською" aria-label="Відповідь англійською" />
            {!answered && <IwButton type="submit" variant="primary" disabled={!typed.trim()}>Перевірити</IwButton>}
          </form>
        )}
        {answered && (
          <div className={cx('iw-gq-feedback', correct ? 'right' : 'wrong')} role="status">
            <strong>{correct ? 'Правильно!' : 'Не зовсім.'}</strong>
            <div className="iw-vq-answer"><span aria-hidden="true">{q.word.emoji}</span> <b>{q.word.en}</b> — {q.word.uk} <SpeakButton text={q.word.en} /></div>
            {q.word.explain && <p>{q.word.explain}</p>}
            <IwButton variant="primary" iconRight={ArrowRight} onClick={nextQ} autoFocus={!isTyped || answered}>{idx + 1 === run.length ? 'Результат' : 'Далі'}</IwButton>
          </div>
        )}
      </div>
    </div>
  );
}

];
const ACH_CATS = [
  { id: 'lessons', label: 'Уроки й курс' }, { id: 'vocab', label: 'Слова' }, { id: 'grammar', label: 'Граматика' }, { id: 'habits', label: 'Звички' },
];

function evaluateAchievements(m) {
  return ACHIEVEMENTS.map(a => {
    const value = m[a.metric] || 0;
    let level = 0;
    a.steps.forEach((s, i) => { if (value >= s) level = i + 1; });
    const single = a.steps.length === 1;
    const tier = level === 0 ? null : single ? 'gold' : ACH_TIERS[level - 1];
    const next = a.steps[level] || null;
    const date = m.dates && m.dates[a.metric] ? m.dates[a.metric][a.steps[Math.max(level - 1, 0)] - 1] : null;
    return { ...a, value, level, tier, next, earned: level > 0, max: level === a.steps.length, date: level > 0 ? date : null, key: `${a.id}:${level}` };
  });
}

    let alive = true;
    (async () => {
      const safe = (p) => p.then(r => (r.error ? null : r.data || []), () => null);
      const [lc, hw, vp, gp, va] = await Promise.all([
        safe(window.SB.from('lesson_completions').select('course_id, lesson_id, completed_at').eq('student_id', studentId)),
        safe(window.SB.from('homework_submissions').select('status, reviewed_at').eq('student_id', studentId)),
        safe(window.SB.from('vocab_progress').select('word_id, interval_days').eq('student_id', studentId)),
        safe(window.SB.from('grammar_progress').select('topic_id, studied_count, practice_correct').eq('student_id', studentId)),
        safe(window.SB.from('vocab_activity').select('kind, day').eq('student_id', studentId)),
      ]);
      let grammar = gp, activity = va;
      if (readLocal) {
        try { if (!grammar) grammar = Object.entries(JSON.parse(localStorage.getItem(`inkwell-grammar:${studentId}`) || '{}')).map(([topic_id, r]) => ({ topic_id, ...r })); } catch (e) {}
        try { if (!activity) activity = (JSON.parse(localStorage.getItem(`inkwell-vocab:${studentId}`) || '{}').activity) || []; } catch (e) {}
      }
      const done = new Set((lc || []).map(r => `${r.course_id}:${r.lesson_id}`));
      const sorted = (lc || []).filter(r => r.completed_at).map(r => r.completed_at).sort();
      let units = 0, courses = 0; const unitDates = [], courseDates = [];
      const dateOf = new Map((lc || []).map(r => [`${r.course_id}:${r.lesson_id}`, r.completed_at]));
      COURSES.forEach(c => {
        let all = true; let last = null;
        c.units.forEach(u => {
          const keys = u.lessons.map(l => `${c.id}:${l.id}`);
          const ok = keys.length > 0 && keys.every(k => done.has(k));
          if (ok) { units++; unitDates.push(keys.map(k => dateOf.get(k)).filter(Boolean).sort().pop() || null); }
          if (!ok) all = false;
          keys.forEach(k => { last = maxDate(last, dateOf.get(k)); });
        });
        if (all && c.units.length) { courses++; courseDates.push(last); }
      });
      const metrics = {
        lessons: done.size, units, courses,
        wordsReviewed: (vp || []).length,
        wordsStrong: (vp || []).filter(r => (r.interval_days || 0) >= STRONG_INTERVAL_DAYS).length,
        dailies: (activity || []).filter(a => a.kind === 'daily').length,
        grammarStudied: (grammar || []).filter(r => (r.studied_count || 0) > 0).length,
        grammarCorrect: (grammar || []).reduce((a, r) => a + (r.practice_correct || 0), 0),
        bestStreak: Math.max(profile.longest_streak || 0, profile.current_streak || 0),
        hwAccepted: (hw || []).filter(h => h.status === 'accepted').length,
        dates: { lessons: sorted, units: unitDates.sort(), courses: courseDates.sort() },
      };
      if (alive) setM(metrics);
    })();
    return () => { alive = false; };
  }, [studentId, permissions && permissions.completions && permissions.completions.size]);
  return m ? evaluateAchievements(m) : null;
}

function AchBadge({ a, size = 72 }) {
  const I = a.icon;
  const tier = a.tier || 'locked';
  return (
    <span className={cx('iw-ach-badge', `t-${tier}`)} style={{ '--sz': `${size}px` }} aria-hidden="true">
      <span className="iw-ach-ribbon" />
      <span className="iw-ach-disc"><I size={Math.round(size * 0.38)} /></span>
      {a.earned && !a.max && a.steps.length > 1 && <span className="iw-ach-level">{a.level}</span>}
      {!a.earned && <span className="iw-ach-lock"><Lock size={Math.round(size * 0.2)} /></span>}
    </span>
  );
}

function AchCard({ a, compact }) {
  const unitWord = (n) => pluralUk(n, ...a.unit);
  const target = a.next || a.steps[a.steps.length - 1];
  return (
    <article className={cx('iw-ach', a.earned ? 'earned' : 'locked', compact && 'compact')}>
      <AchBadge a={a} size={compact ? 56 : 76} />
      <div className="iw-ach-body">
        <div className="iw-ach-top">
          <h3 className="iw-ach-title">{a.title}</h3>
          {a.earned && <Badge tone="gold">{a.steps.length === 1 ? 'Отримано' : ACH_TIER_LABEL[a.tier]}</Badge>}
        </div>
        <p className="iw-ach-desc">{a.desc}</p>
        {!a.max ? (
          <ProgressBar value={Math.min(a.value, target)} max={target} size="sm" tone="gold-fill"
            label={a.earned ? `До рівня «${ACH_TIER_LABEL[ACH_TIERS[a.level]] || ''}»` : 'Прогрес'} valueLabel={`${Math.min(a.value, target)} / ${target}`} />
        ) : (
          <div className="iw-ach-done"><CheckCircle size={14} aria-hidden="true" /> {a.steps.length === 1 ? 'Отримано' : `${a.value} ${unitWord(a.value)}`}{a.date ? ` · ${new Date(a.date).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' })}` : ''}</div>
        )}
      </div>
    </article>
  );
}

// ── Сторінка «Мої досягнення» ──
function AchievementsPage({ session, permissions, goHome }) {
  const list = useAchievementMetrics({ studentId: session.user.id, profile: session.profile, permissions });
  const [cat, setCat] = useState('all');
  if (!list) return <PageLoader label="Рахую твої досягнення…" />;
  const earned = list.filter(a => a.earned);
  const tiersEarned = list.reduce((n, a) => n + a.level, 0);
  const tiersTotal = list.reduce((n, a) => n + a.steps.length, 0);
  const nextUp = list.filter(a => !a.max).map(a => ({ a, left: (a.next || 0) - a.value, ratio: a.value / (a.next || 1) })).sort((x, y) => y.ratio - x.ratio).slice(0, 3);
  const shown = list.filter(a => cat === 'all' || a.cat === cat);
  return (
    <main className="page iw-achp">
      <Crumbs items={[{ label: 'Home', onClick: goHome }, { label: 'Мої досягнення', current: true }]} />
      <PageHeader eyebrow="Досягнення" title={<React.Fragment>Твоя полиця <em>нагород</em></React.Fragment>}
        subtitle="Нагороди за справжні кроки в навчанні: завершені уроки, повторені слова, вивчені теми й регулярність. Їх не можна втратити."
        art="trophy" buddy={<CompanionSpot state="celebrate" size={76} align="right" lines={earned.length ? [`You have ${earned.length} ${earned.length === 1 ? 'award' : 'awards'}!`, 'Look at your collection!'] : ['Your first award is one lesson away!']} />} />
      <div className="iw-stat-grid iw-achp-stats">
        <StatCard icon={Award} tone="gold-fill" value={`${earned.length} / ${list.length}`} label="Досягнень отримано" />
        <StatCard icon={Medal} tone="mustard" value={`${tiersEarned} / ${tiersTotal}`} label="Рівнів відкрито" sub="бронза · срібло · золото" />
        {nextUp[0] && <StatCard icon={Target} tone="terracotta" value={nextUp[0].a.title} label="Найближча мета" sub={`ще ${nextUp[0].left} ${pluralUk(nextUp[0].left, ...nextUp[0].a.unit)}`} />}
      </div>
      <div className="iw-chips iw-achp-filter" role="group" aria-label="Категорія досягнень">
        <button type="button" className="iw-chip" aria-pressed={cat === 'all'} onClick={() => setCat('all')}>Усі</button>
        {ACH_CATS.map(c => <button key={c.id} type="button" className="iw-chip" aria-pressed={cat === c.id} onClick={() => setCat(c.id)}>{c.label}</button>)}
      </div>
      <div className="iw-ach-grid">{shown.map(a => <AchCard key={a.id} a={a} />)}</div>
      <p className="iw-gb-levelnote">Досягнення рахуються автоматично з твоїх уроків, флешкарток, Grammar Bank і домашніх. Вони не відкривають уроки — це робить учитель.</p>
    </main>
  );
}

// ── Блок на головній + святкування нового досягнення ──
function AchievementsStrip({ session, permissions, setRoute }) {
  const list = useAchievementMetrics({ studentId: session.user.id, profile: session.profile, permissions });
  const [fresh, setFresh] = useState(null); // { items, intro }
  const seenKey = `inkwell-ach-seen:${session.user.id}`;
  useEffect(() => {
    if (!list) return;
    let seen = null;
    try { seen = JSON.parse(localStorage.getItem(seenKey) || 'null'); } catch (e) {}
    const keys = list.filter(a => a.earned).map(a => a.key);
    const save = () => { try { localStorage.setItem(seenKey, JSON.stringify(keys)); } catch (e) {} };
    if (!seen) { save(); if (keys.length) setFresh({ intro: true, items: list.filter(a => a.earned) }); return; }
    const added = list.filter(a => a.earned && !seen.includes(a.key));
    if (added.length) { save(); setFresh({ intro: false, items: added }); }
  }, [list]);
  if (!list) return null;
  const earned = list.filter(a => a.earned).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const next = list.filter(a => !a.max).sort((x, y) => y.value / (y.next || 1) - x.value / (x.next || 1))[0];
  return (
    <section className="iw-home-section">
      {fresh && (
        <div className="iw-ach-toast" role="status">
          <span className="iw-confetti" aria-hidden="true">{Array.from({ length: 10 }).map((_, i) => <i key={i} />)}</span>
          <CompanionSpot state="celebrate" size={64} event lines={[fresh.intro ? 'Look — you already have awards!' : 'New award! Well done!']} />
          <AchBadge a={fresh.items[0]} size={58} />
          <div className="iw-ach-toast-text">
            <strong>{fresh.intro ? `У тебе вже ${fresh.items.length} ${pluralUk(fresh.items.length, 'досягнення', 'досягнення', 'досягнень')}!` : `Нове досягнення: ${fresh.items[0].title}${fresh.items[0].steps.length > 1 ? ` · ${ACH_TIER_LABEL[fresh.items[0].tier]}` : ''}`}</strong>
            <span>{fresh.intro ? 'Ми порахували нагороди за все, що ти вже пройшов.' : fresh.items.length > 1 ? `І ще ${fresh.items.length - 1} — подивись на полиці нагород.` : fresh.items[0].desc}</span>
          </div>
          <IwButton size="sm" variant="secondary" onClick={() => setRoute({ page: 'achievements' })}>Подивитись</IwButton>
          <button type="button" className="iw-streak-celebrate-x" onClick={() => setFresh(null)} aria-label="Закрити"><X size={16} /></button>
        </div>
      )}
      <div className="iw-home-section-head">
        <h2 className="iw-home-h">Досягнення <span className="iw-muted-num">({earned.length}/{list.length})</span></h2>
        <IwButton size="sm" variant="ghost" iconRight={ArrowRight} onClick={() => setRoute({ page: 'achievements' })}>Усі нагороди</IwButton>
      </div>
      <div className="iw-ach-strip">
        {earned.slice(0, 4).map(a => (
          <button key={a.id} type="button" className="iw-ach-mini" onClick={() => setRoute({ page: 'achievements' })} title={a.desc}>
            <AchBadge a={a} size={54} /><span>{a.title}</span>
          </button>
        ))}
        {earned.length === 0 && <p className="iw-scard-muted" style={{ margin: 0 }}>Перше досягнення — після першого завершеного уроку.</p>}
        {next && (
          <div className="iw-ach-next">
            <AchBadge a={{ ...next, earned: false, tier: null }} size={54} />
            <div>
              <div className="iw-kicker">Наступна мета</div>
              <strong>{next.title}</strong>
              <ProgressBar value={next.value} max={next.next} size="sm" tone="gold-fill" label={next.title} valueLabel={`${next.value} / ${next.next}`} />
            </div>
          </div>
        )}
      </div>
    </section>
  );
}

// ── Для вчителя: досягнення учня в профілі ──
function StudentAchievements({ student }) {
  const list = useAchievementMetrics({ studentId: student.id, profile: student, permissions: null, readLocal: false });
  if (!list) return <Skeleton h={90} r={16} />;
  const earned = list.filter(a => a.earned);
  return (
    <section className="iw-card iw-ach-teacher">
      <h3 className="iw-card-title">Досягнення <span className="iw-muted-num">({earned.length}/{list.length})</span></h3>
      {earned.length === 0 ? <p className="iw-scard-muted" style={{ margin: 0 }}>Поки немає. Перше — після першого завершеного уроку.</p> : (
        <div className="iw-ach-strip">
          {earned.map(a => <span key={a.id} className="iw-ach-mini static" title={`${a.title}${a.steps.length > 1 ? ` (${ACH_TIER_LABEL[a.tier]})` : ''}: ${a.desc}`}><AchBadge a={a} size={46} /><span>{a.title}</span></span>)}
        </div>
      )}
    </section>
  );
}

root.render(<AuthGate />);
</script>
