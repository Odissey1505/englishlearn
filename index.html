function MyHomeworkPage({ session, goHome, setRoute }) {
  const [submissions, setSubmissions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState('all'); // all | pending | accepted | returned

  useEffect(() => {
    async function load() {
      setLoading(true);
      const { data } = await window.SB
        .from('homework_submissions')
        .select('*')
        .eq('student_id', session.user.id)
        .order('submitted_at', { ascending: false });
      setSubmissions(data || []);
      setLoading(false);
    }
    load();
  }, [session.user.id]);

  const filtered = filter === 'all' ? submissions : submissions.filter(s => s.status === filter);

  // Групуємо за уроком
  const grouped = useMemo(() => {
    const map = new Map();
    filtered.forEach(s => {
      const key = `${s.course_id}:${s.lesson_id}`;
      if (!map.has(key)) {
        const lesson = findLesson(s.course_id, s.lesson_id);
        map.set(key, {
          key,
          courseId: s.course_id,
          lessonId: s.lesson_id,
          courseTitle: lesson?.course?.title || s.course_id,
          lessonNumber: lesson?.lesson?.number || '?',
          lessonTitle: lesson?.lesson?.title || s.lesson_id,
          writing: null,
          speaking: null,
          latestAt: s.submitted_at,
        });
      }
      const g = map.get(key);
      if (s.kind === 'writing') g.writing = s;
      if (s.kind === 'speaking') g.speaking = s;
      if (s.submitted_at > g.latestAt) g.latestAt = s.submitted_at;
    });
    return Array.from(map.values()).sort((a, b) => b.latestAt.localeCompare(a.latestAt));
  }, [filtered]);

  return (
    <main className="page">
      <Crumbs items={[
        { label: 'Головна', onClick: goHome },
        { label: 'Мої домашки', current: true }
      ]} />
      <header className="page-header">
        <div className="page-eyebrow"><span className="dot" /> Домашні завдання</div>
        <h1 className="page-title">Мої домашки</h1>
        <p style={{ fontSize: 15, color: 'var(--ink-2)', lineHeight: 1.6, marginTop: 14 }}>
          Усі домашки, які ти здав, з їхніми поточними статусами.
        </p>
      </header>

      <div className="hw-review-toolbar">
        <div className="hw-review-tabs">
          <button className={`hw-review-tab ${filter === 'all' ? 'active' : ''}`} onClick={() => setFilter('all')}>Усі ({submissions.length})</button>
          <button className={`hw-review-tab ${filter === 'submitted' ? 'active' : ''}`} onClick={() => setFilter('submitted')}>На перевірці ({submissions.filter(s => s.status === 'submitted').length})</button>
          <button className={`hw-review-tab ${filter === 'accepted' ? 'active' : ''}`} onClick={() => setFilter('accepted')}>Прийнято ({submissions.filter(s => s.status === 'accepted').length})</button>
          <button className={`hw-review-tab ${filter === 'returned' ? 'active' : ''}`} onClick={() => setFilter('returned')}>Повернуто ({submissions.filter(s => s.status === 'returned').length})</button>
        </div>
      </div>

      {loading && <div className="empty-inline">Завантажую...</div>}

      {!loading && grouped.length === 0 && (
        <div className="empty-inline">
          <div className="empty-inline-title">Поки що порожньо</div>
          <div>Коли здаси перше домашнє завдання, воно з'явиться тут.</div>
        </div>
      )}

      {!loading && grouped.length > 0 && (
        <div className="hw-review-list">
          {grouped.map(g => (
            <button
              key={g.key}
              className="hw-review-row"
              onClick={() => setRoute({ page: 'lesson', courseId: g.courseId, lessonId: g.lessonId })}
            >
              <div className="hw-review-info">
                <div className="hw-review-student">{g.courseTitle}</div>
                <div className="hw-review-lesson">Lesson {g.lessonNumber}: {g.lessonTitle}</div>
                <div className="hw-review-date">
                  Здано: {new Date(g.latestAt).toLocaleString('uk-UA', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}
                </div>
              </div>
              <div className="hw-review-badges">
                {g.writing && <HomeworkKindBadge kind="writing" status={g.writing.status} />}
                {g.speaking && <HomeworkKindBadge kind="speaking" status={g.speaking.status} />}
              </div>
              <ChevronRight size={18} className="hw-review-chevron" />
            </button>
          ))}
        </div>
      )}
    </main>
  );
}

function AuthPage({ onAuth }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  async function handleSubmit(e) {
    if (e) e.preventDefault();
    setError('');
    if (!username.trim() || !password) {
      setError('Введи ім\u2019я і пароль');
      return;
    }
    setLoading(true);
    try {
      const email = username.trim().toLowerCase() + '@inkwell.local';
      const { data, error: authError } = await window.SB.auth.signInWithPassword({
        email,
        password,
      });
      if (authError) {
        if (authError.message.toLowerCase().includes('invalid')) {
          setError('Неправильне ім\u2019я або пароль');
        } else {
          setError(authError.message);
        }
        setLoading(false);
        return;
      }
      // Успіх — тягнемо профіль
      const { data: profile, error: profileError } = await window.SB
        .from('profiles')
        .select('*')
        .eq('id', data.user.id)
        .single();
      if (profileError || !profile) {
        setError('Не вдалося завантажити профіль. Зверніться до вчителя.');
        await window.SB.auth.signOut();
        setLoading(false);
        return;
      }
      // Якщо teacher — зберігаємо пароль в пам'яті сесії для швидкого створення учнів
      if (profile.role === 'teacher') {
        window.__inkwell_teacher_pw = password;
      }
      onAuth({ user: data.user, profile });
    } catch (err) {
      setError('Помилка з\u2019єднання: ' + err.message);
      setLoading(false);
    }
  }

  return (
    <div className="auth-page">
      <div className="auth-card">
        <div className="auth-brand">
          <div className="auth-brand-icon"><BookOpen size={18} /></div>
          <div className="auth-brand-name">Inkwell</div>
        </div>
        <h1 className="auth-title">Вхід</h1>
        <p className="auth-subtitle">Введи своє ім\u2019я і пароль, щоб продовжити. Якщо в тебе ще немає акаунта — попроси вчителя його створити.</p>
        {error && <div className="auth-error">{error}</div>}
        <div className="auth-field">
          <label className="auth-label" htmlFor="auth-username">Ім\u2019я користувача</label>
          <input
            id="auth-username"
            className="auth-input"
            type="text"
            autoComplete="username"
            value={username}
            onChange={e => setUsername(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && handleSubmit()}
            placeholder="наприклад, taras"
            disabled={loading}
            autoFocus
          />
        </div>
        <div className="auth-field">
          <label className="auth-label" htmlFor="auth-password">Пароль</label>
          <input
            id="auth-password"
            className="auth-input"
            type="password"
            autoComplete="current-password"
            value={password}
            onChange={e => setPassword(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && handleSubmit()}
            placeholder="твій пароль"
            disabled={loading}
          />
        </div>
        <button className="auth-submit" onClick={handleSubmit} disabled={loading}>
          {loading ? 'Заходжу...' : 'Увійти'}
        </button>
        <div className="auth-hint">Бібліотека курсів для учнів 10–17 років</div>
      </div>
    </div>
  );
}

function AuthGate() {
  const [status, setStatus] = useState('checking'); // checking | authed | anon
  const [session, setSession] = useState(null);

  useEffect(() => {
    // Спочатку перевіряємо, чи вже є активна сесія
    async function check() {
      const { data: { session: currentSession } } = await window.SB.auth.getSession();
      if (currentSession) {
        // Завантажуємо профіль
        const { data: profile } = await window.SB
          .from('profiles')
          .select('*')
          .eq('id', currentSession.user.id)
          .single();
        if (profile) {
          setSession({ user: currentSession.user, profile });
          setStatus('authed');
        } else {
          // Сесія є, але профілю нема — розлогінюємо
          await window.SB.auth.signOut();
          setStatus('anon');
        }
      } else {
        setStatus('anon');
      }
    }
    check();

    // Слухаємо зміни авторизації (SIGN_OUT з іншої вкладки тощо)
    const { data: sub } = window.SB.auth.onAuthStateChange((event) => {
      if (event === 'SIGNED_OUT') {
        setSession(null);
        setStatus('anon');
      }
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  async function handleLogout() {
    await window.SB.auth.signOut();
    window.__inkwell_teacher_pw = null;
    setSession(null);
    setStatus('anon');
  }

  if (status === 'checking') {
    return (
      <div className="auth-page">
        <div style={{ color: 'var(--ink-3)', fontSize: 14 }}>Перевіряю вхід...</div>
      </div>
    );
  }

  if (status === 'anon' || !session) {
    return <AuthPage onAuth={(s) => { setSession(s); setStatus('authed'); }} />;
  }

  return <App session={session} onLogout={handleLogout} />;
}

function App({ session, onLogout }) {
  // Тема запам'ятовується на цьому пристрої для кожного акаунта.
  // За замовчуванням: вчитель — темна, учень — світла.
  const themeKey = `inkwell-theme:${session.user.id}`;
  const [theme, setThemeRaw] = useState(() => {
    try { const saved = localStorage.getItem(themeKey); if (saved === 'light' || saved === 'dark') return saved; } catch (e) {}
    return session.profile.role === 'teacher' ? 'dark' : 'light';
  });
  const setTheme = (t) => {
    setThemeRaw(t);
    try { localStorage.setItem(themeKey, t); } catch (e) {}
  };
  useEffect(() => {
    const rootEl = document.documentElement;
    rootEl.classList.toggle('dark', theme === 'dark');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#161412' : '#faf6ee');
    return () => rootEl.classList.remove('dark');
  }, [theme]);
  const [route, setRouteRaw] = useState({ page: 'home' });
  const [routeHistory, setRouteHistory] = useState([]); // стек попередніх routes
  const [query, setQuery] = useState('');
  const [activeFilters, setActiveFilters] = useState({ level: [], age: [], type: [] });
  const [favorites, setFavorites] = useState(new Set());
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [mobileMenu, setMobileMenu] = useState(false);
  useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [route]);
  const allLessons = useMemo(() => getAllLessons(), []);

  // Обгортка над setRoute — записує попередній route в історію
  // (крім випадків, коли явно скидаємо на 'home' — тоді очищуємо історію)
  const setRoute = (newRoute) => {
    if (newRoute && newRoute.page === 'home') {
      setRouteHistory([]); // повернення на головну очищає стек
    } else if (!newRoute._skipHistory) {
      setRouteHistory(prev => [...prev, route]);
    }
    setRouteRaw(newRoute);
  };

  // Кнопка "Назад"
  const goBack = () => {
    if (routeHistory.length === 0) return;
    const prev = routeHistory[routeHistory.length - 1];
    setRouteHistory(history => history.slice(0, -1));
    setRouteRaw(prev);
  };

  const canGoBack = routeHistory.length > 0;

  // ── Permissions state (для учня) ──
  const isTeacher = session.profile.role === 'teacher';

  // ── Pending homework counter (для teacher) ──
  const [pendingHomeworkCount, setPendingHomeworkCount] = useState(0);

  useEffect(() => {
    if (!isTeacher) return;
    async function loadPending() {
      const { count } = await window.SB
        .from('homework_submissions')
        .select('*', { count: 'exact', head: true })
        .eq('status', 'submitted');
      setPendingHomeworkCount(count || 0);
    }
    loadPending();
    // Оновлюємо кожні 30 секунд + при кожній зміні route
    const interval = setInterval(loadPending, 30000);
    return () => clearInterval(interval);
  }, [isTeacher, route]);
  const [permissions, setPermissions] = useState({
    loading: !isTeacher, // teacher бачить все, не треба чекати
    courseAccess: new Set(),   // course_id
    lessonAccess: new Set(),   // 'courseId:lessonId'
    completions: new Set(),    // 'courseId:lessonId'
    vocabAccess: new Set(),    // word_id (ручний доступ до окремих слів)
  });

  useEffect(() => {
    if (isTeacher) return; // Teacher має доступ до всього
    // Тягнемо permissions учня
    async function load() {
      const [ca, la, lc, va] = await Promise.all([
        window.SB.from('course_access').select('course_id').eq('student_id', session.user.id),
        window.SB.from('lesson_access').select('course_id, lesson_id').eq('student_id', session.user.id),
        window.SB.from('lesson_completions').select('course_id, lesson_id').eq('student_id', session.user.id),
        window.SB.from('vocab_access').select('word_id').eq('student_id', session.user.id),
      ]);
      setPermissions({
        loading: false,
        courseAccess: new Set((ca.data || []).map(r => r.course_id)),
        lessonAccess: new Set((la.data || []).map(r => `${r.course_id}:${r.lesson_id}`)),
        completions: new Set((lc.data || []).map(r => `${r.course_id}:${r.lesson_id}`)),
        vocabAccess: new Set((va.data || []).map(r => r.word_id)),
      });
    }
    load().catch((err) => {
      console.warn('[Inkwell] Не вдалося завантажити доступи учня:', err);
      setPermissions(prev => ({ ...prev, loading: false }));
    });
  }, [session.user.id, isTeacher]);

  // Функції доступу
  const canSeeCourse = (courseId) => isTeacher || permissions.courseAccess.has(courseId);
  const canSeeLesson = (courseId, lessonId) => {
    if (isTeacher) return true;
    const key = `${courseId}:${lessonId}`;
    return permissions.lessonAccess.has(key) || permissions.completions.has(key);
  };
  const isLessonCompleted = (courseId, lessonId) => permissions.completions.has(`${courseId}:${lessonId}`);
  // Vocab: учень бачить слово, якщо (а) урок завершений АБО (б) слово вручну відкрито
  const canSeeVocabWord = (word) => {
    if (isTeacher) return true;
    const lessonKey = `${word.courseId}:${word.lessonId}`;
    return permissions.completions.has(lessonKey) || permissions.vocabAccess.has(word.wordId);
  };

  // Курси, які видимі поточному користувачу
  const visibleCourses = useMemo(() => {
    if (isTeacher) return COURSES;
    return COURSES.filter(c => permissions.courseAccess.has(c.id));
  }, [isTeacher, permissions.courseAccess]);

  // Уроки, які видимі поточному користувачу
  const visibleLessons = useMemo(() => {
    if (isTeacher) return allLessons;
    return allLessons.filter(l => canSeeLesson(l.courseId, l.id));
  }, [isTeacher, allLessons, permissions.lessonAccess, permissions.completions]);

  // Уроки (показуються коли активний пошук або фільтр Type)
  const filteredLessons = useMemo(() => {
    return visibleLessons.filter(l => {
      const q = query.toLowerCase().trim();
      const matchesQuery = !q || l.title.toLowerCase().includes(q) || (l.titleUk && l.titleUk.toLowerCase().includes(q)) || l.tags.some(t => t.toLowerCase().includes(q));
      const matchesLevel = !activeFilters.level.length || activeFilters.level.includes(l.level);
      const matchesAge = !activeFilters.age.length || activeFilters.age.includes(l.age);
      const matchesType = !activeFilters.type.length || activeFilters.type.includes(l.type);
      return matchesQuery && matchesLevel && matchesAge && matchesType;
    });
  }, [query, activeFilters, visibleLessons]);

  // Курси (за замовчуванням на головній)
  const filteredCourses = useMemo(() => {
    return visibleCourses.filter(c => {
      const matchesLevel = !activeFilters.level.length || activeFilters.level.includes(c.level);
      const matchesAge = !activeFilters.age.length || activeFilters.age.includes(c.age);
      return matchesLevel && matchesAge;
    });
  }, [activeFilters, visibleCourses]);

  const toggleFilter = (group, value) => setActiveFilters(prev => ({ ...prev, [group]: prev[group].includes(value) ? prev[group].filter(v => v !== value) : [...prev[group], value] }));
  const clearFilters = () => setActiveFilters({ level: [], age: [], type: [] });
  const hasFilters = activeFilters.level.length + activeFilters.age.length + activeFilters.type.length > 0;
  const toggleFavorite = (id) => setFavorites(prev => { const next = new Set(prev); next.has(id) ? next.delete(id) : next.add(id); return next; });
  const goLesson = (courseId, lessonId) => setRoute({ page: 'lesson', courseId, lessonId });
  const goCourse = (courseId) => setRoute({ page: 'course', courseId });
  const goHome = () => setRoute({ page: 'home' });

  // Режим показу на головній: уроки якщо є query або обраний Type-фільтр; інакше - курси
  const lessonMode = Boolean(query.trim()) || activeFilters.type.length > 0;

  // Поки доступи учня вантажаться, показуємо спільний екран завантаження —
  // інакше головна встигає порахувати «немає уроків» з порожніх даних.
  const permsReady = isTeacher || !permissions.loading;
  const showTabBar = !['lesson', 'flashcards'].includes(route.page);
  const focusMain = () => { const m = document.getElementById('iw-main'); if (m) m.focus(); };

  return (
    <div className={theme === 'dark' ? 'dark' : ''}>
      <div className={cx('app-root', showTabBar && 'has-tabbar')}>
        <button type="button" className="iw-skip" onClick={focusMain}>Перейти до змісту</button>
        <div className="bg-deco" aria-hidden="true">
          <div className="bg-grain" />
          <div className="bg-blob bg-blob-1" />
          <div className="bg-blob bg-blob-2" />
        </div>
        <Nav theme={theme} setTheme={setTheme} route={route} setRoute={setRoute} session={session} onLogout={onLogout} pendingHomeworkCount={pendingHomeworkCount} />
        <div id="iw-main" className="iw-page" key={route.page} tabIndex={-1}>
        {!permsReady && <PageLoader label="Відкриваю твою бібліотеку…" />}
        {permsReady && <React.Fragment>
        {route.page === 'home' && isTeacher && (
          <React.Fragment>
            <Hero query={query} setQuery={setQuery} setRoute={setRoute} totalLessons={visibleLessons.length} />
            <main className="layout">
              <Sidebar open={sidebarOpen} setOpen={setSidebarOpen} activeFilters={activeFilters} toggleFilter={toggleFilter} clearFilters={clearFilters} hasFilters={hasFilters} showTypeFilter={lessonMode || activeFilters.type.length > 0} />
              <section className="content">
                <ResultHeader
                  count={lessonMode ? filteredLessons.length : filteredCourses.length}
                  query={query}
                  hasFilters={hasFilters}
                  lessonMode={lessonMode}
                />
                {lessonMode
                  ? <LessonGrid lessons={filteredLessons} favorites={favorites} toggleFavorite={toggleFavorite} goLesson={goLesson} />
                  : <CourseGrid courses={filteredCourses} goCourse={goCourse} />
                }
                {!lessonMode && !hasFilters && !query && (
                  <div style={{ marginTop: 30 }}><ExternalCoursesList /></div>
                )}
              </section>
            </main>
          </React.Fragment>
        )}
        {route.page === 'home' && !isTeacher && (
          <StudentDashboard
            session={session}
            setRoute={setRoute}
            permissions={permissions}
            canSeeCourse={canSeeCourse}
            canSeeLesson={canSeeLesson}
            isLessonCompleted={isLessonCompleted}
            canSeeVocabWord={canSeeVocabWord}
          />
        )}
        {route.page !== 'home' && canGoBack && (
          <div className="page-container back-btn-wrapper">
            <button className="back-btn-floating" onClick={goBack} title="Повернутись до попередньої сторінки">
              <ChevronLeft size={16} /> Назад
            </button>
          </div>
        )}
        {route.page === 'course' && <CoursePage courseId={route.courseId} goHome={goHome} goLesson={goLesson} canSeeLesson={canSeeLesson} isLessonCompleted={isLessonCompleted} isTeacher={isTeacher} />}
        {route.page === 'lesson' && <LessonPage courseId={route.courseId} lessonId={route.lessonId} goHome={goHome} goCourse={goCourse} goLesson={goLesson} favorites={favorites} toggleFavorite={toggleFavorite} canSeeLesson={canSeeLesson} isTeacher={isTeacher} session={session} />}
        {route.page === 'grammar' && <GrammarBank goHome={goHome} />}
        {route.page === 'vocabulary' && <VocabularyBank goHome={goHome} setRoute={setRoute} canSeeVocabWord={canSeeVocabWord} isTeacher={isTeacher} session={session} />}
        {route.page === 'vocab-course' && <VocabCoursePage courseId={route.courseId} goHome={goHome} setRoute={setRoute} canSeeVocabWord={canSeeVocabWord} isTeacher={isTeacher} />}
        {route.page === 'vocab-lesson' && <VocabLessonPage courseId={route.courseId} lessonId={route.lessonId} goHome={goHome} setRoute={setRoute} canSeeVocabWord={canSeeVocabWord} isTeacher={isTeacher} />}
        {route.page === 'flashcards' && <FlashcardsPage session={session} mode={route.mode} courseId={route.courseId} lessonId={route.lessonId} unitId={route.unitId} canSeeVocabWord={canSeeVocabWord} goHome={goHome} setRoute={setRoute} />}
        {route.page === 'my-homework' && <MyHomeworkPage session={session} goHome={goHome} setRoute={setRoute} />}
        {route.page === 'students' && <StudentsPage session={session} goHome={goHome} setRoute={setRoute} />}
        {route.page === 'homework-review' && <HomeworkReviewPage session={session} goHome={goHome} setRoute={setRoute} />}
        {route.page === 'student' && <StudentPage key={route.studentId + ':' + (route.tab || '')} studentId={route.studentId} initialTab={route.tab} session={session} goHome={goHome} setRoute={setRoute} />}
        </React.Fragment>}
        </div>
        <Footer setRoute={setRoute} isTeacher={isTeacher} />
        {showTabBar && <MobileTabBar route={route} setRoute={setRoute} isTeacher={isTeacher} pendingHomeworkCount={pendingHomeworkCount} />}
        <ToastHost />
        <ScrollToTop />
      </div>
    </div>
  );
}

// ── Навігація 2.0 ─────────────────────────────────────────────
// Спільний опис розділів: верхнє меню (desktop) і нижня панель (mobile).
// pages — які сторінки підсвічують цей розділ як активний.
function getNavLinks(isTeacher, pendingHomeworkCount = 0) {
  const firstCourseId = COURSES[0] ? COURSES[0].id : null;
  const links = [
    { key: 'home', label: isTeacher ? 'Library' : 'Home', short: isTeacher ? 'Library' : 'Home', icon: isTeacher ? BookOpen : Home, pages: ['home'] },
    { key: 'grammar', label: 'Grammar Bank', short: 'Grammar', icon: Brain, pages: ['grammar'] },
    { key: 'vocabulary', label: 'Vocabulary Bank', short: 'Vocab', icon: Library, pages: ['vocabulary', 'vocab-course', 'vocab-lesson', 'flashcards'] },
  ];
  if (firstCourseId) links.push({ key: 'course', label: isTeacher ? 'Courses' : 'Мої курси', short: isTeacher ? 'Courses' : 'Курси', icon: MapIcon, pages: ['course', 'lesson'], route: { page: 'course', courseId: firstCourseId } });
  if (isTeacher) links.push({ key: 'students', label: 'Учні', short: 'Учні', icon: Users, pages: ['students', 'student', 'homework-review'], badge: pendingHomeworkCount > 0 ? pendingHomeworkCount : null });
  return links;
}

function BrandMark() {
  return (
    <div className="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="28" height="28">
        <path d="M4 6 Q16 2 28 6 L28 24 Q16 20 4 24 Z" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" />
        <path d="M16 4 L16 22" stroke="currentColor" strokeWidth="1.6" />
        <circle cx="16" cy="13" r="1.4" fill="currentColor" />
      </svg>
    </div>
  );
}

function AccountMenu({ profile, theme, setTheme, setRoute, onLogout, pendingHomeworkCount = 0 }) {
  const isTeacher = profile.role === 'teacher';
  const name = profile.display_name || profile.username;
  const seed = profile.id || profile.username;
  return (
    <DropdownMenu label="Меню акаунта" trigger={({ ref, toggle, menuProps }) => (
      <button ref={ref} type="button" className="iw-account-btn" data-test="account-btn" onClick={toggle} aria-label={`Акаунт: ${name}`} {...menuProps}>
        <Avatar name={name} seed={seed} />
        <span className="iw-account-name">{name}</span>
        <span className={`user-chip-role ${profile.role}`}>{isTeacher ? 'Вчитель' : 'Учень'}</span>
        <ChevronDown size={15} className="iw-account-chev" aria-hidden="true" />
      </button>
    )}>
      {(close) => (
        <React.Fragment>
          <div className="iw-menu-head">
            <Avatar name={name} seed={seed} size={42} />
            <div style={{ minWidth: 0 }}>
              <div className="iw-menu-head-name">{name}</div>
              <div className="iw-menu-head-sub">@{profile.username} · {isTeacher ? 'вчитель' : 'учень'}</div>
            </div>
          </div>
          {isTeacher ? (
            <React.Fragment>
              <MenuItem icon={Users} onSelect={() => { close(); setRoute({ page: 'students' }); }}>Мої учні</MenuItem>
              <MenuItem icon={Inbox} onSelect={() => { close(); setRoute({ page: 'homework-review' }); }}
                meta={pendingHomeworkCount > 0 ? <span className="iw-menu-badge">{pendingHomeworkCount}</span> : null}>
                Перевірка домашніх
              </MenuItem>
            </React.Fragment>
          ) : (
            <MenuItem icon={Inbox} onSelect={() => { close(); setRoute({ page: 'my-homework' }); }}>Мої домашні роботи</MenuItem>
          )}
          <MenuItem icon={theme === 'dark' ? Moon : Sun} role="menuitemcheckbox" aria-checked={theme === 'dark'}
            onSelect={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
            meta={<span className={`iw-theme-switch ${theme === 'dark' ? 'on' : ''}`} aria-hidden="true" />}>
            Темна тема
          </MenuItem>
          <div className="iw-menu-sep" role="separator" />
          <MenuItem icon={LogOut} danger onSelect={() => { close(); onLogout(); }}>Вийти</MenuItem>
        </React.Fragment>
      )}
    </DropdownMenu>
  );
}

function Nav({ theme, setTheme, route, setRoute, session, onLogout, pendingHomeworkCount = 0 }) {
  const profile = session && session.profile;
  const isTeacher = profile && profile.role === 'teacher';
  const links = getNavLinks(isTeacher, pendingHomeworkCount);
  const nextTheme = theme === 'light' ? 'dark' : 'light';
  return (
    <header className="nav">
      <div className="nav-inner">
        <button className="brand" onClick={() => setRoute({ page: 'home' })} aria-label="Inkwell — на головну">
          <BrandMark />
          <div className="brand-text">
            <span className="brand-name">Inkwell</span>
            <span className="brand-sub">English Library</span>
          </div>
        </button>
        <nav className="nav-links" aria-label="Основна навігація">
          {links.map(l => {
            const I = l.icon;
            const isActive = l.pages.includes(route.page);
            return (
              <button key={l.key} className={`nav-link ${isActive ? 'active' : ''}`} aria-current={isActive ? 'page' : undefined}
                onClick={() => setRoute(l.route || { page: l.key })}>
                <I size={16} aria-hidden="true" /><span>{l.label}</span>
                {l.badge && <span className="nav-link-badge" aria-label={`, нових домашніх: ${l.badge}`}>{l.badge}</span>}
              </button>
            );
          })}
        </nav>
        <div className="nav-tools">
          <button className="icon-btn" data-test="theme-toggle" onClick={() => setTheme(nextTheme)}
            aria-label={nextTheme === 'dark' ? 'Увімкнути темну тему' : 'Увімкнути світлу тему'}
            data-tip={nextTheme === 'dark' ? 'Темна тема' : 'Світла тема'}>
            {theme === 'light' ? <Moon size={18} /> : <Sun size={18} />}
          </button>
          {profile && (
            <AccountMenu profile={profile} theme={theme} setTheme={setTheme} setRoute={setRoute} onLogout={onLogout} pendingHomeworkCount={pendingHomeworkCount} />
          )}
        </div>
      </div>
    </header>
  );
}

// Нижня панель розділів на телефонах (≤720px). Ховається в уроці
// та флешкартках, щоб не заважати навчанню.
function MobileTabBar({ route, setRoute, isTeacher, pendingHomeworkCount }) {
  const links = getNavLinks(isTeacher, pendingHomeworkCount);
  return (
    <nav className="iw-tabbar" style={{ '--n': links.length }} aria-label="Розділи">
      {links.map(l => {
        const I = l.icon;
        const active = l.pages.includes(route.page);
        return (
          <button key={l.key} type="button" className={`iw-tabbar-btn ${active ? 'active' : ''}`} aria-current={active ? 'page' : undefined}
            aria-label={l.label} onClick={() => setRoute(l.route || { page: l.key })}>
            <I size={20} aria-hidden="true" /><span>{l.short}</span>
            {l.badge && <span className="iw-tabbar-badge" aria-hidden="true">{l.badge}</span>}
          </button>
        );
      })}
    </nav>
  );
}

function Hero({ query, setQuery, setRoute, totalLessons }) {
  const firstCourse = COURSES[0];
  return (
    <section className="hero">
      <div>
        <div className="hero-eyebrow"><span className="dot" /> A teacher's quiet little library</div>
        <h1 className="hero-title">Find any lesson <em>in seconds.</em></h1>
        <p className="hero-sub">Grammar, vocabulary, speaking, revision, games — every presentation, worksheet, and warm-up, gathered in one calm corner of the internet.</p>
        <div className="search-wrap">
          <div className="search-bar">
            <Search size={20} />
            <input type="text" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Шукай за назвою, темою, рівнем або тегом…" className="search-input" />
            {query && <button className="search-clear" onClick={() => setQuery('')}><X size={16} /></button>}
            <kbd className="search-kbd">⌘ K</kbd>
          </div>
        </div>
        <div className="quick-buttons">
          {firstCourse && <button className="quick-btn" onClick={() => setRoute({ page: 'course', courseId: firstCourse.id })}><MapIcon size={15} /> {firstCourse.title}</button>}
          <button className="quick-btn" onClick={() => setRoute({ page: 'grammar' })}><Brain size={15} /> Grammar Bank</button>
          <button className="quick-btn" onClick={() => setRoute({ page: 'vocabulary' })}><Library size={15} /> Vocabulary Bank</button>
        </div>
        <div className="hero-stats">
          <div className="stat"><strong>{totalLessons}</strong><span>Lesson{totalLessons !== 1 ? 's' : ''}</span></div>
          <div className="stat-divider" />
          <div className="stat"><strong>{COURSES.length}</strong><span>Course{COURSES.length !== 1 ? 's' : ''}</span></div>
          <div className="stat-divider" />
          <div className="stat"><strong>{COURSES.reduce((sum, c) => sum + c.units.length, 0)}</strong><span>Units</span></div>
        </div>
      </div>
      <div className="hero-illust" aria-hidden="true">
        <Illustration name="library" />
      </div>
    </section>
  );
}

function Sidebar({ open, setOpen, activeFilters, toggleFilter, clearFilters, hasFilters, showTypeFilter = true }) {
  const allGroups = [
    { key: 'level', label: 'English Level', items: LEVELS },
    { key: 'age', label: 'Age Group', items: AGE_GROUPS },
    { key: 'type', label: 'Lesson Type', items: TYPES },
  ];
  const groups = showTypeFilter ? allGroups : allGroups.filter(g => g.key !== 'type');
  return (
    <aside className={`sidebar ${open ? '' : 'closed'}`}>
      <div className="sidebar-header">
        <button className="sidebar-toggle" onClick={() => setOpen(!open)}>
          {open ? <PanelLeftClose size={16} /> : <PanelLeft size={16} />}
          {open && <span>Filters</span>}
        </button>
        {open && hasFilters && <button className="clear-btn" onClick={clearFilters}>Clear</button>}
      </div>
      {open && (
        <div className="sidebar-body">
          {groups.map(g => (
            <div key={g.key}>
              <div className="filter-title">{g.label}</div>
              <div className="filter-list">
                {g.items.map(item => {
                  const checked = activeFilters[g.key].includes(item);
                  return (
                    <label key={item} className={`check ${checked ? 'checked' : ''}`}>
                      <input type="checkbox" checked={checked} onChange={() => toggleFilter(g.key, item)} />
                      <span className="check-box">{checked && <svg viewBox="0 0 12 12" width="10" height="10"><path d="M2 6 L5 9 L10 3" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" /></svg>}</span>
                      <span>{item}</span>
                    </label>
                  );
                })}
              </div>
            </div>
          ))}
          <div className="sidebar-tip">
            <Sparkles size={14} />
            <p>{showTypeFilter
              ? 'Фільтри допомагають швидко знайти потрібний матеріал.'
              : 'Шукай у пошуку, щоб переключитися на пошук по уроках і додати фільтр Type.'}</p>
          </div>
        </div>
      )}
    </aside>
  );
}

function ResultHeader({ count, query, hasFilters, lessonMode }) {
  let title;
  if (query) title = <React.Fragment>Результати для <em>"{query}"</em></React.Fragment>;
  else if (lessonMode && hasFilters) title = 'Відфільтровані уроки';
  else if (lessonMode) title = 'Усі уроки';
  else if (hasFilters) title = 'Відфільтровані курси';
  else title = 'Усі курси';
  const noun = lessonMode ? 'lesson' : 'course';
  return (
    <div className="result-header">
      <div>
        <h2 className="result-title">{title}</h2>
        <p className="result-count">{count} {noun}{count !== 1 ? 's' : ''} found</p>
      </div>
    </div>
  );
}

function LessonGrid({ lessons, favorites, toggleFavorite, goLesson }) {
  if (!lessons.length) return <div className="empty"><div className="empty-mark">∅</div><p>Жодного уроку не знайдено.</p></div>;
  return <div className="grid">{lessons.map((l, i) => <LessonCard key={l.id} lesson={l} favorited={favorites.has(l.id)} toggleFavorite={toggleFavorite} delay={i * 30} goLesson={goLesson} />)}</div>;
}

function LessonCard({ lesson, favorited, toggleFavorite, delay = 0, goLesson }) {
  return (
    <article className={`card accent-${lesson.accent}`} style={{ animationDelay: `${delay}ms` }} onClick={() => goLesson(lesson.courseId, lesson.id)}>
      <div className="card-top">
        <div className="card-meta">
          <span className="badge level">{lesson.level}</span>
          <span className="badge age">{lesson.age}</span>
        </div>
        <button className={`fav ${favorited ? 'on' : ''}`} onClick={(e) => { e.stopPropagation(); toggleFavorite(lesson.id); }}>
          {favorited ? <BookmarkCheck size={16} /> : <Bookmark size={16} />}
        </button>
      </div>
      <div className="card-type"><span className="card-type-dot" />{lesson.type && lesson.type.toLowerCase() !== 'vocabulary' ? `${lesson.type} · ` : ''}Unit {lesson.unitNumber}</div>
      <h3 className="card-title">{lesson.title}{lesson.titleUk && <div style={{ fontSize: 13, color: 'var(--ink-3)', fontStyle: 'italic', marginTop: 2, fontWeight: 400 }}>{lesson.titleUk}</div>}</h3>
      <div className="card-tags">{lesson.tags.map(t => <span key={t} className="tag">#{t}</span>)}</div>
      <div className="card-foot">
        <span className="card-updated">Оновлено: {lesson.updated}</span>
        <button className="card-btn primary" onClick={(e) => { e.stopPropagation(); goLesson(lesson.courseId, lesson.id); }}>Open <ChevronRight size={13} /></button>
      </div>
    </article>
  );
}

function ExternalCourseCard({ course }) {
  return (
    <a
      className={`external-link-card ${course.variant}`}
      href={course.url}
      target="_blank"
      rel="noopener noreferrer"
    >
      <div className="external-link-icon">{course.icon}</div>
      <div className="external-link-body">
        <div className="external-link-eyebrow">{course.eyebrow}</div>
        <div className="external-link-title">{course.title}</div>
        <div className="external-link-sub">
          {course.sub} Окремий застосунок — вхід виконувати не потрібно, він підхопить твій акаунт.
        </div>
      </div>
      <div className="external-link-cta">
        {course.cta} <ExternalLink size={14} />
      </div>
    </a>
  );
}

function ExternalCoursesList() {
  return (
    <React.Fragment>
      {EXTERNAL_COURSES.map(c => <ExternalCourseCard key={c.id} course={c} />)}
    </React.Fragment>
  );
}

function CourseGrid({ courses, goCourse }) {
  if (!courses.length) {
    return (
      <div className="empty">
        <div className="empty-mark">∅</div>
        <p>Жодного курсу не знайдено.</p>
      </div>
    );
  }
  return (
    <div className="course-grid">
      {courses.map((c, i) => <CourseCard key={c.id} course={c} goCourse={goCourse} delay={i * 60} />)}
    </div>
  );
}

function CourseCard({ course, goCourse, delay = 0 }) {
  const totalLessons = course.units.reduce((sum, u) => sum + u.lessons.length, 0);
  return (
    <article className={`course-card accent-${course.accent || 'sage'}`} style={{ animationDelay: `${delay}ms` }} onClick={() => goCourse(course.id)}>
      <div className="course-card-top">
        <div className="course-card-icon"><MapIcon size={24} /></div>
        <div className="course-card-badges">
          <span className="badge level">{course.level}</span>
          <span className="badge age">{course.age}</span>
        </div>
      </div>
      <h3 className="course-card-title">{course.title}</h3>
      {course.subtitle && <div className="course-card-subtitle">{course.subtitle}</div>}
      {course.description && <p className="course-card-desc">{course.description}</p>}
      <div className="course-card-stats">
        <span><strong>{course.units.length}</strong>{course.units.length === 1 ? 'unit' : 'units'}</span>
        <span className="course-card-stat-divider" />
        <span><strong>{totalLessons}</strong>{totalLessons === 1 ? 'lesson' : 'lessons'}</span>
        <span className="course-card-cta">Explore course <ArrowRight size={13} /></span>
      </div>
    </article>
  );
}

function CoursesStrip({ goCourse }) {
  return (
    <section className="strip">
      <div className="strip-head"><div><h2 className="strip-title"><MapIcon size={18} /> Courses</h2><p className="strip-sub">Структуровані курси, що ведуть учня крок за кроком.</p></div></div>
      <div className="quick-grid">
        {COURSES.map(c => {
          const totalLessons = c.units.reduce((sum, u) => sum + u.lessons.length, 0);
          return (
            <button key={c.id} className={`quick-card accent-${c.accent || 'sage'}`} onClick={() => goCourse(c.id)}>
              <div className="quick-icon"><MapIcon size={22} /></div>
              <div className="quick-body"><div className="quick-label">{c.title}</div><div className="quick-desc">{c.units.length} unit · {totalLessons} lesson</div></div>
              <ArrowRight size={16} />
            </button>
          );
        })}
      </div>
    </section>
  );
}

function CoursePage({ courseId, goHome, goLesson, canSeeLesson, isLessonCompleted, isTeacher }) {
  const course = COURSES.find(c => c.id === courseId);
  const [openUnits, setOpenUnits] = useState(new Set([course?.units[0]?.id]));
  if (!course) return <div className="page"><p>Курс не знайдено.</p></div>;

  // Готуємо юніти та уроки з урахуванням доступу
  const unitsWithVisibility = course.units.map(unit => {
    const lessonsWithVisibility = unit.lessons.map(lesson => ({
      ...lesson,
      canSee: canSeeLesson ? canSeeLesson(course.id, lesson.id) : true,
      completed: isLessonCompleted ? isLessonCompleted(course.id, lesson.id) : false
    }));
    // Для учня показуємо тільки видимі уроки
    const visibleLessons = isTeacher ? lessonsWithVisibility : lessonsWithVisibility.filter(l => l.canSee);
    return { ...unit, visibleLessons, hasAnyVisible: visibleLessons.length > 0 };
  });

  // Всі юніти видимі для teacher, для учня — тільки ті, де є хоч один доступний урок
  const visibleUnits = isTeacher ? unitsWithVisibility : unitsWithVisibility.filter(u => u.hasAnyVisible);

  const totalLessons = course.units.reduce((sum, u) => sum + u.lessons.length, 0);
  const totalVisibleLessons = visibleUnits.reduce((sum, u) => sum + u.visibleLessons.length, 0);
  const totalCompleted = visibleUnits.reduce((sum, u) => sum + u.visibleLessons.filter(l => l.completed).length, 0);
  const progressPercent = totalVisibleLessons > 0 ? Math.round((totalCompleted / totalVisibleLessons) * 100) : 0;

  const toggleUnit = (id) => setOpenUnits(prev => { const next = new Set(prev); next.has(id) ? next.delete(id) : next.add(id); return next; });

  const circumference = 2 * Math.PI * 60;
  const dashOffset = circumference - (circumference * progressPercent / 100);

  return (
    <main className="page">
      <Crumbs items={[{ label: 'Library', onClick: goHome }, { label: course.title, current: true }]} />
      <div className="course-hero">
        <div className="course-hero-text">
          <div className="course-hero-eyebrow">Course</div>
          <h1 className="course-hero-title">{course.title}</h1>
          <p className="course-hero-sub">{course.description}</p>
          <div className="course-hero-meta">
            <div><strong>{isTeacher ? course.units.length : visibleUnits.length}</strong><span>Unit{visibleUnits.length !== 1 ? 's' : ''}</span></div>
            <div><strong>{isTeacher ? totalLessons : totalVisibleLessons}</strong><span>Lesson{totalVisibleLessons !== 1 ? 's' : ''}</span></div>
            <div><strong>{course.level}</strong><span>Level</span></div>
            <div><strong>{course.age}</strong><span>Age</span></div>
          </div>
        </div>
        <div className="course-progress">
          <div className="progress-ring">
            <svg width="140" height="140">
              <circle className="progress-ring-bg" cx="70" cy="70" r="60" fill="none" strokeWidth="8" />
              <circle className="progress-ring-fg" cx="70" cy="70" r="60" fill="none" strokeWidth="8" strokeLinecap="round" strokeDasharray={circumference} strokeDashoffset={dashOffset} />
            </svg>
            <div className="progress-ring-text">{progressPercent}%<small>completed</small></div>
          </div>
        </div>
      </div>

      {visibleUnits.length === 0 && (
        <div className="empty-inline">
          <div className="empty-inline-title">Ще немає доступних уроків</div>
          <div>Твій вчитель відкриє їх незабаром 🌱</div>
        </div>
      )}

      {visibleUnits.map(unit => {
        const isOpen = openUnits.has(unit.id);
        const lessonsForRender = isTeacher ? unit.lessons.map(l => ({ ...l, canSee: canSeeLesson ? canSeeLesson(course.id, l.id) : true, completed: isLessonCompleted ? isLessonCompleted(course.id, l.id) : false })) : unit.visibleLessons;
        const unitCompleted = lessonsForRender.filter(l => l.completed).length;
        const unitTotal = lessonsForRender.length;
        return (
          <div key={unit.id} className={`unit ${isOpen ? 'open' : ''}`}>
            <button className="unit-head" onClick={() => toggleUnit(unit.id)}>
              <div className="unit-head-left">
                <div className="unit-num">{unit.number}</div>
                <div className="unit-title-block">
                  <div className="unit-eyebrow">Unit {unit.number}</div>
                  <h3 className="unit-title">{unit.title}</h3>
                  <div className="unit-meta-line">{unit.subtitle} · {unitTotal} lesson{unitTotal !== 1 ? 's' : ''}</div>
                </div>
              </div>
              <div className="unit-head-right">
                <div className="unit-progress">
                  <div className="unit-progress-bar"><div className="unit-progress-bar-fg" style={{ width: unitTotal > 0 ? (unitCompleted/unitTotal*100) + '%' : '0%' }} /></div>
                  <span>{unitCompleted}/{unitTotal}</span>
                </div>
                <ChevronRight size={18} className="unit-chevron" />
              </div>
            </button>
            <div className="unit-body">
              <ul className="unit-list">
                {lessonsForRender.map(lesson => {
                  const locked = !lesson.canSee;
                  return (
                    <li
                      key={lesson.id}
                      className={`unit-row ${lesson.completed ? 'row-completed' : ''} ${locked ? 'row-locked' : ''}`}
                      onClick={() => { if (!locked || isTeacher) goLesson(course.id, lesson.id); }}
                      style={{ cursor: (!locked || isTeacher) ? 'pointer' : 'not-allowed', opacity: locked && !isTeacher ? 0.5 : 1 }}
                    >
                      <div className="unit-row-num">
                        {lesson.completed
                          ? <span className="unit-row-check"><Check size={14} /></span>
                          : locked
                            ? <span className="unit-row-lock"><Lock size={12} /></span>
                            : lesson.number}
                      </div>
                      <div className="unit-row-body">
                        <div className="unit-row-title">Lesson {lesson.number} · {lesson.title}</div>
                        <div className="unit-row-meta">{lesson.titleUk}{lesson.type && lesson.type.toLowerCase() !== 'vocabulary' ? ` · ${lesson.type}` : ''}</div>
                      </div>
                      <div className="unit-row-tags">
                        {lesson.completed && <span className="badge badge-completed">Завершено</span>}
                        {!lesson.completed && !locked && <span className="badge badge-open">Відкрито</span>}
                        {locked && isTeacher && <span className="badge badge-locked">Закрито для учнів</span>}
                        {lesson.type && lesson.type.toLowerCase() !== 'vocabulary' && <span className="badge type">{lesson.type}</span>}
                      </div>
                    </li>
                  );
                })}
              </ul>
            </div>
          </div>
        );
      })}
    </main>
  );
}

function Crumbs({ items }) {
  return (
    <nav className="crumbs" aria-label="Навігаційний шлях">
      <ol>
        {items.map((it, i) => (
          <li key={i}>
            {i > 0 && <span className="crumb-sep" aria-hidden="true"><ChevronRight size={13} /></span>}
            {it.current ? <span className="current" aria-current="page">{it.label}</span> : <button type="button" onClick={it.onClick}>{it.label}</button>}
          </li>
        ))}
      </ol>
    </nav>
  );
}

const TENSE_COLUMNS = [

  { key: 'continuous', label: 'Continuous (тривалий)' },

];

const TENSE_ROWS = [
  { key: 'present', label: 'PRESENT (Теперішній)' },
  { key: 'past', label: 'PAST (Минулий)' },

function TenseDetail({ tense, onClose, showClose = true }) {
  return (
    <div className={`tense-detail accent-${tense.group}`} style={{ '--accent-color': tense.group === 'present' ? '#a8bb96' : tense.group === 'past' ? '#d68870' : '#95b6c9' }}>
      {showClose && (
        <button className="tense-detail-close" onClick={onClose} aria-label="Закрити">
          <X size={16} />
        </button>
      )}
      <div className="tense-detail-header">
        <div>
          <h3 className="tense-detail-title">{tense.name}</h3>
          <div className="tense-detail-title-uk">{tense.nameUk}</div>
        </div>
        <div className="tense-detail-formula">{tense.formulaLong}</div>
      </div>

      <div className="tense-universal">
        <div className="tense-universal-label">✦ Універсальне речення</div>
        <div className="tense-universal-text">"{tense.universal}"</div>
      </div>

      {tense.uses && tense.uses.length > 0 && (
        <div className="tense-uses-section">
          <div className="tense-uses-label">Коли вживається — всі варіанти</div>
          <div className="tense-uses-list">
            {tense.uses.map((use, i) => (
              <div key={i} className="tense-use">
                <div className="tense-use-head">
                  <div className="tense-use-num">{i + 1}</div>
                  <div className="tense-use-case">{use.case}</div>
                </div>
                <p className="tense-use-explain">{use.explain}</p>
                <div className="tense-use-examples">
                  {use.examples.map((ex, j) => (
                    <div key={j} className="tense-use-example">
                      <span className="tense-use-example-mark">→</span>
                      <span>{ex}</span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="tense-detail-body">
        <div>
          <div className="tense-detail-block-label">Маркери часу (signal words)</div>
          <div className="tense-detail-markers">{tense.markers}</div>
        </div>
        <div>
          <div className="tense-detail-block-label">Формула</div>
          <div className="tense-detail-when" style={{ fontFamily: 'ui-monospace, SF Mono, Menlo, monospace', fontSize: 13.5 }}>{tense.formulaLong}</div>

          <div className="tense-detail-example negative"><span className="tense-detail-example-sign">−</span><span className="tense-detail-example-text">{tense.negative}</span></div>
          <div className="tense-detail-example question"><span className="tense-detail-example-sign">?</span><span className="tense-detail-example-text">{tense.question}</span></div>
        </div>
      </div>
    </div>
  );
}

function TensesMatrix() {
  const [activeId, setActiveId] = useState('present-simple');
  const [compareAll, setCompareAll] = useState(false);
  const activeTense = TENSES.find(t => t.id === activeId);

  const cellFor = (group, col) => TENSES.find(t => t.group === group && t.col === col);

  return (
    <section className="tenses-section">
      <h2 className="tenses-section-title"><Layers size={22} /> Часи (Tenses)</h2>
      <p className="tenses-section-sub">Дванадцять часів англійської мови в одній зручній таблиці. Натисни на будь-який час, щоб переглянути коли він вживається, маркери, формулу та приклади.</p>

      <div className="tenses-intro">
        <Sparkles size={16} />
        <p>Нижче представлена <strong>велика інтерактивна матриця часів</strong>. Обирай будь-який час, щоб відкрити його детальну схему. Зверни увагу на <strong>універсальне речення</strong> — те ж саме речення про піцу 🍕 змінюється, коли переходиш між часами, і ти бачиш точно як трансформується форма дієслова.</p>
      </div>

      {/* Matrix */}
      <div className="tense-matrix">
        <div className="tense-matrix-header">Часова група</div>
        {TENSE_COLUMNS.map(c => <div key={c.key} className="tense-matrix-header">{c.label}</div>)}

        {TENSE_ROWS.map(r => (
          <React.Fragment key={r.key}>
            <div className={`tense-matrix-rowlabel row-${r.key}`}>{r.label}</div>
            {TENSE_COLUMNS.map(c => {
              const t = cellFor(r.key, c.key);
              if (!t) return <div key={c.key} />;
              const isActive = t.id === activeId && !compareAll;
              return (
                <button
                  key={c.key}
                  className={`tense-cell row-${r.key} ${isActive ? 'active' : ''}`}
                  onClick={() => { setCompareAll(false); setActiveId(t.id); window.scrollTo({ top: document.getElementById('tense-detail-anchor')?.offsetTop - 90 || 0, behavior: 'smooth' }); }}
                >
                  <div className="tense-cell-name">{t.name}</div>
                  <div className="tense-cell-formula">{t.formula}</div>
                </button>
              );
            })}
          </React.Fragment>
        ))}
      </div>

      <div id="tense-detail-anchor" />

      {/* Single detail (default) */}
      {!compareAll && activeTense && (
        <TenseDetail tense={activeTense} onClose={() => setActiveId(null)} />
      )}

      {!compareAll && !activeTense && (
        <div className="empty" style={{ marginBottom: 22 }}>
          <p>Обери будь-який час у матриці зверху, щоб переглянути деталі.</p>
        </div>
      )}

      {/* Compare all toggle */}
      <div className="compare-all-row">
        <div className="compare-all-hint">{compareAll ? 'Усі 12 часів показано один за одним для порівняння.' : 'Хочеш побачити всі часи відразу для порівняння?'}</div>
        <button className="compare-all-btn" onClick={() => setCompareAll(!compareAll)}>
          {compareAll ? <React.Fragment><ChevronUp size={16} /> Згорнути</React.Fragment> : <React.Fragment><Layers size={16} /> Оглянути всі часи</React.Fragment>}
        </button>
      </div>

      {/* Compare all grid */}
      {compareAll && (
        <div className="compare-all-grid">
          {TENSE_ROWS.map(r => (
            <React.Fragment key={r.key}>
              <div className={`compare-group-label row-${r.key}`}>{r.label}</div>
              {TENSES.filter(t => t.group === r.key).map(t => (
                <TenseDetail key={t.id} tense={t} showClose={false} />
              ))}
            </React.Fragment>
          ))}
        </div>
      )}
    </section>
  );
}

// Головна сторінка Vocab Bank — список курсів як категорій
function VocabularyBank({ goHome, setRoute, canSeeVocabWord, isTeacher, session }) {
  const allItems = useMemo(() => getAllVocabItems(), []);
  const [dueCount, setDueCount] = useState(0);
  const [newCount, setNewCount] = useState(0);

  // Рахуємо, скільки карток чекають на повторення (тільки для учня)
  useEffect(() => {
    if (isTeacher || !session) return;
    async function loadDue() {
      const { data } = await window.SB
        .from('vocab_progress')
        .select('word_id, next_review_at')
        .eq('student_id', session.user.id);
      const now = new Date();
      const seenIds = new Set((data || []).map(r => r.word_id));
      const dueIds = new Set(
        (data || [])
          .filter(r => new Date(r.next_review_at) <= now)
          .map(r => r.word_id)
      );
      const visible = allItems.filter(w => canSeeVocabWord(w));
      const due = visible.filter(w => dueIds.has(w.wordId)).length;
      const neu = visible.filter(w => !seenIds.has(w.wordId)).length;
      setDueCount(due);
      setNewCount(neu);
    }
    loadDue();
  }, [session, isTeacher]);

  // Групуємо доступні слова за курсами
  const availableByCourse = useMemo(() => {
    const map = new Map();
    allItems.forEach(item => {
      if (!canSeeVocabWord(item)) return;
      if (!map.has(item.courseId)) {
        const course = COURSES.find(c => c.id === item.courseId);
        map.set(item.courseId, {
          courseId: item.courseId,
          courseTitle: course ? course.title : item.courseTitle,
          courseSubtitle: course ? course.subtitle : null,
          courseAccent: course ? course.accent : 'sage',
          count: 0
        });
      }
      map.get(item.courseId).count++;
    });
    return Array.from(map.values());
  }, [allItems, canSeeVocabWord, isTeacher]);

  return (
    <main className="page">
      <Crumbs items={[{ label: 'Library', onClick: goHome }, { label: 'Vocabulary Bank', current: true }]} />
      <header className="page-header">
        <div className="page-eyebrow"><span className="dot" /> Vocabulary Bank</div>
        <h1 className="page-title">Твої вивчені слова <em>під рукою.</em></h1>
        <p style={{ fontSize: 16, color: 'var(--ink-2)', lineHeight: 1.6, marginTop: 14, maxWidth: 640 }}>
          {isTeacher
            ? 'Уся лексика з усіх курсів. Обери курс, щоб побачити всі слова з нього.'
            : 'Тут з’являються слова з уроків, які ти вже завершив. Обери курс, щоб переглянути вивчену лексику.'}
        </p>
      </header>

      <a
        className="external-link-card external-alias"
        href="https://odissey1505.github.io/alias-game/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <div className="external-link-icon">🎯</div>
        <div className="external-link-body">
          <div className="external-link-eyebrow">Гра для тренування слів</div>
          <div className="external-link-title">Alias</div>
          <div className="external-link-sub">Класична гра «Alias» онлайн — поясни слово, поки товариш його вгадує. Чудовий спосіб закріпити нову лексику. Відкриється у новій вкладці.</div>
        </div>
        <div className="external-link-cta">
          Грати <ExternalLink size={14} />
        </div>
      </a>

      {!isTeacher && (dueCount > 0 || newCount > 0) && (
        <button
          className="fc-review-banner"
          onClick={() => setRoute({ page: 'flashcards', mode: 'due' })}
        >
          <div className="fc-review-banner-icon">🎴</div>
          <div className="fc-review-banner-body">
            <div className="fc-review-banner-title">
              {dueCount > 0 && newCount > 0 && `${dueCount} на повторення + ${newCount} нових`}
              {dueCount > 0 && newCount === 0 && `${dueCount} карток чекають на повторення`}
              {dueCount === 0 && newCount > 0 && `${newCount} нових слів для вивчення`}
            </div>
            <div className="fc-review-banner-sub">Клікни, щоб почати тренування (макс 20 за раз)</div>
          </div>
          <ChevronRight size={20} />
        </button>
      )}

      {availableByCourse.length === 0 ? (
        <div className="empty-inline">
          <div className="empty-inline-title">Поки що порожньо</div>
          <div>
            {isTeacher
              ? 'Немає курсів зі словами. Додай хоча б один курс з vocabPresentation.'
              : 'Слова з’являться, коли ти завершиш перший урок. Твій вчитель позначить його як завершений.'}
          </div>
        </div>
      ) : (
        <div className="vocab-course-grid">
          {availableByCourse.map(c => (
            <button
              key={c.courseId}
              className={`vocab-course-card accent-${c.courseAccent}`}
              onClick={() => setRoute({ page: 'vocab-course', courseId: c.courseId })}
            >
              <div className="vocab-course-icon"><Library size={22} /></div>
              <div className="vocab-course-body">
                <h3 className="vocab-course-title">{c.courseTitle}</h3>
                {c.courseSubtitle && <div className="vocab-course-sub">{c.courseSubtitle}</div>}
                <div className="vocab-course-count">
                  <strong>{c.count}</strong> вивчен{c.count === 1 ? 'е слово' : c.count < 5 ? 'і слова' : 'их слів'}
                </div>
              </div>
              <ChevronRight size={18} className="vocab-course-chevron" />
            </button>
          ))}
        </div>
      )}
    </main>
  );
}

// Сторінка курсу у Vocab Bank — юніти та уроки
function VocabCoursePage({ courseId, goHome, setRoute, canSeeVocabWord, isTeacher }) {
  const course = COURSES.find(c => c.id === courseId);
  const allItems = useMemo(() => getAllVocabItems(), []);
  if (!course) return <main className="page"><p>Курс не знайдено.</p></main>;

  // Групуємо доступні слова за юнітами та уроками
  const structure = useMemo(() => {
    const unitsMap = new Map();
    allItems
      .filter(item => item.courseId === courseId && canSeeVocabWord(item))
      .forEach(item => {
        if (!unitsMap.has(item.unitId)) {
          unitsMap.set(item.unitId, {
            unitId: item.unitId,
            unitNumber: item.unitNumber,
            unitTitle: item.unitTitle,
            lessons: new Map()
          });
        }
        const unit = unitsMap.get(item.unitId);
        if (!unit.lessons.has(item.lessonId)) {
          unit.lessons.set(item.lessonId, {
            lessonId: item.lessonId,
            lessonNumber: item.lessonNumber,
            lessonTitle: item.lessonTitle,
            lessonTitleUk: item.lessonTitleUk,
            count: 0
          });
        }
        unit.lessons.get(item.lessonId).count++;
      });
    // Перетворюємо в масиви для рендеру, сортуємо за номером
    return Array.from(unitsMap.values())
      .sort((a, b) => a.unitNumber - b.unitNumber)
      .map(u => ({
        ...u,
        lessons: Array.from(u.lessons.values()).sort((a, b) => a.lessonNumber - b.lessonNumber)
      }));
  }, [allItems, courseId, canSeeVocabWord, isTeacher]);

  const totalWords = structure.reduce((sum, u) => sum + u.lessons.reduce((s, l) => s + l.count, 0), 0);

  return (
    <main className="page">
      <Crumbs items={[
        { label: 'Library', onClick: goHome },
        { label: 'Vocabulary Bank', onClick: () => setRoute({ page: 'vocabulary' }) },
        { label: course.title, current: true }
      ]} />
      <header className="page-header">
        <div className="page-eyebrow"><span className="dot" /> {course.title}</div>
        <h1 className="page-title">Словник курсу</h1>
        <p style={{ fontSize: 15, color: 'var(--ink-2)', lineHeight: 1.6, marginTop: 14 }}>
          {totalWords} {totalWords === 1 ? 'слово доступне' : totalWords < 5 ? 'слова доступних' : 'слів доступних'} у {structure.length} {structure.length === 1 ? 'юніті' : 'юнітах'}. Обери урок, щоб переглянути його лексику.
        </p>
      </header>

      {totalWords > 0 && !isTeacher && (
        <div style={{ marginBottom: 28 }}>
          <button
            className="fc-cta-btn"
            onClick={() => setRoute({ page: 'flashcards', mode: 'course', courseId })}
          >
            🎴 Тренуватися всім курсом ({totalWords} {totalWords === 1 ? 'слово' : totalWords < 5 ? 'слова' : 'слів'})
          </button>
        </div>
      )}

      {structure.length === 0 ? (
        <div className="empty-inline">
          <div className="empty-inline-title">Ще немає слів</div>
          <div>Заверши перший урок цього курсу, щоб слова з’явилися тут.</div>
        </div>
      ) : (
        structure.map(unit => {
          const unitWordCount = unit.lessons.reduce((s, l) => s + l.count, 0);
          return (
          <div key={unit.unitId} className="vocab-unit-block">
            <div className="vocab-unit-head">
              <div className="vocab-unit-num">{unit.unitNumber}</div>
              <div style={{ flex: 1 }}>
                <div className="vocab-unit-eyebrow">Unit {unit.unitNumber}</div>
                <h3 className="vocab-unit-title">{unit.unitTitle}</h3>
              </div>
              {!isTeacher && unitWordCount > 0 && (
                <button
                  className="fc-cta-btn fc-cta-btn-sm"
                  onClick={(e) => {
                    e.stopPropagation();
                    setRoute({ page: 'flashcards', mode: 'unit', courseId, unitId: unit.unitId });
                  }}
                  title={`Тренувати всі ${unitWordCount} слів цього юніта`}
                >
                  🎴 Тренуватися юнітом ({unitWordCount})
                </button>
              )}
            </div>
            <ul className="vocab-lesson-list">
              {unit.lessons.map(lesson => (
                <li
                  key={lesson.lessonId}
                  className="vocab-lesson-row"
                  onClick={() => setRoute({ page: 'vocab-lesson', courseId, lessonId: lesson.lessonId })}
                >
                  <div className="vocab-lesson-num">L{lesson.lessonNumber}</div>
                  <div className="vocab-lesson-body">
                    <div className="vocab-lesson-title">{lesson.lessonTitle}</div>
                    <div className="vocab-lesson-titleuk">{lesson.lessonTitleUk}</div>
                  </div>
                  <div className="vocab-lesson-count">
                    <strong>{lesson.count}</strong> {lesson.count === 1 ? 'слово' : lesson.count < 5 ? 'слова' : 'слів'}
                  </div>
                  <ChevronRight size={16} className="vocab-lesson-chevron" />
                </li>
              ))}
            </ul>
          </div>
          );
        })
      )}
    </main>
  );
}

// Сторінка уроку у Vocab Bank — самі слова
function VocabLessonPage({ courseId, lessonId, goHome, setRoute, canSeeVocabWord, isTeacher }) {
  const course = COURSES.find(c => c.id === courseId);
  const allItems = useMemo(() => getAllVocabItems(), []);
  const [query, setQuery] = useState('');

  if (!course) return <main className="page"><p>Курс не знайдено.</p></main>;

  const found = findLesson(courseId, lessonId);
  if (!found) return <main className="page"><p>Урок не знайдено.</p></main>;
  const { unit, lesson } = found;

  const words = allItems.filter(item => item.courseId === courseId && item.lessonId === lessonId && canSeeVocabWord(item));

  const q = query.toLowerCase().trim();
  const filtered = q
    ? words.filter(w => (w.en || '').toLowerCase().includes(q) || (w.uk || '').toLowerCase().includes(q))
    : words;

  return (
    <main className="page">
      <Crumbs items={[
        { label: 'Library', onClick: goHome },
        { label: 'Vocabulary Bank', onClick: () => setRoute({ page: 'vocabulary' }) },
        { label: course.title, onClick: () => setRoute({ page: 'vocab-course', courseId }) },
        { label: `Lesson ${lesson.number}`, current: true }
      ]} />
      <header className="page-header">
        <div className="page-eyebrow"><span className="dot" /> Unit {unit.number} · Lesson {lesson.number}</div>
        <h1 className="page-title">{lesson.title}</h1>
        <p style={{ fontSize: 15, color: 'var(--ink-2)', lineHeight: 1.6, marginTop: 14 }}>
          {words.length} {words.length === 1 ? 'слово' : words.length < 5 ? 'слова' : 'слів'} у цьому уроці. Відкрий український переклад натисканням на «Українською», щоб перевірити себе.
        </p>
      </header>

      {words.length > 0 && !isTeacher && (
        <div style={{ marginBottom: 24 }}>
          <button
            className="fc-cta-btn"
            onClick={() => setRoute({ page: 'flashcards', mode: 'lesson', courseId, lessonId })}
          >
            🎴 Тренуватися флешкартками ({words.length})
          </button>
        </div>
      )}

      {words.length > 5 && (
        <div style={{ marginBottom: 24 }}>
          <input
            type="text"
            className="students-search"
            style={{ width: '100%' }}
            placeholder="Пошук по словах (en або uk)..."
            value={query}
            onChange={e => setQuery(e.target.value)}
          />
        </div>
      )}

      {filtered.length === 0 ? (
        <div className="empty-inline">
          <div className="empty-inline-title">Нічого не знайдено</div>
          <div>Спробуй інше слово в пошуку</div>
        </div>
      ) : (
        <div className="vocab-presentation">
          {filtered.map(word => (
            <div key={word.wordId} className="vocab-pres-card" style={{ '--accent': ACCENT_MAP[word.accent] || ACCENT_MAP.sage }}>
              <div className="vocab-pres-emoji">{word.emoji}</div>
              <div className="vocab-pres-word">{word.en}</div>
              <div className="vocab-pres-explain">{word.explain}</div>
              <Spoiler label="Переклад"><strong>{word.uk}</strong></Spoiler>
            </div>
          ))}
        </div>
      )}
    </main>
  );
}

function Footer({ setRoute, isTeacher }) {
  const go = (r) => { if (setRoute) setRoute(r); };
  const firstCourseId = COURSES[0] ? COURSES[0].id : null;
  return (
    <footer className="footer">
      <div className="footer-inner">
        <div className="footer-brand">
          <div className="footer-brand-row"><BrandMark /><span className="brand-name">Inkwell</span></div>
          <span className="footer-tag">A small library, lovingly kept.</span>
        </div>
        <nav className="footer-cols" aria-label="Посилання у футері">
          <div>
            <div className="footer-h">Library</div>
            <button type="button" onClick={() => go({ page: 'home' })}>{isTeacher ? 'Усі матеріали' : 'Головна'}</button>
            {firstCourseId && <button type="button" onClick={() => go({ page: 'course', courseId: firstCourseId })}>{isTeacher ? 'Курси' : 'Мої курси'}</button>}
          </div>
          <div>
            <div className="footer-h">Banks</div>
            <button type="button" onClick={() => go({ page: 'grammar' })}>Grammar</button>
            <button type="button" onClick={() => go({ page: 'vocabulary' })}>Vocabulary</button>
          </div>
          {isTeacher ? (
            <div>
              <div className="footer-h">For teachers</div>
              <button type="button" onClick={() => go({ page: 'students' })}>Учні</button>
              <button type="button" onClick={() => go({ page: 'homework-review' })}>Домашні роботи</button>
            </div>
          ) : (
            <div>
              <div className="footer-h">For students</div>
              <button type="button" onClick={() => go({ page: 'my-homework' })}>Мої домашні</button>
              {EXTERNAL_COURSES.map(c => (
                <button type="button" key={c.id} onClick={() => window.open(c.url, '_blank', 'noopener')}>{c.title} ↗</button>
              ))}
            </div>
          )}
        </nav>
      </div>
      <div className="footer-bottom"><span>© 2026 Inkwell · Made with ☕ for English teachers</span></div>
    </footer>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AuthGate />);
</script>
